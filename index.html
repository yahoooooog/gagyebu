      +'<span style="font-size:12px;font-weight:700;color:var(--text);min-width:80px;text-align:right;white-space:nowrap">'+fmtW(totalRev)+'</span>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="font-size:11px;color:var(--text2);width:22px;flex-shrink:0">전월</span>'
      +'<div style="flex:1;height:7px;background:var(--icon-bg);border-radius:99px;overflow:hidden">'
      +'<div style="height:100%;width:'+(pTotalRev/maxV*100).toFixed(1)+'%;background:var(--text);border-radius:99px;opacity:.4;transition:width .7s"></div></div>'
      +'<span style="font-size:12px;color:var(--text2);min-width:80px;text-align:right;white-space:nowrap">'+fmtW(pTotalRev)+'</span>'
      +'</div></div></div>'
      // 지출 바
      +'<div>'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
      +'<span style="font-size:12px;color:var(--text2)">지출</span>'
      +diffChip(totalExp, pTotalExp, false)
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:3px">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="font-size:11px;color:var(--text2);width:22px;flex-shrink:0">이번</span>'
      +'<div style="flex:1;height:7px;background:var(--icon-bg);border-radius:99px;overflow:hidden">'
      +'<div style="height:100%;width:'+(totalExp/maxV*100).toFixed(1)+'%;background:var(--expense);border-radius:99px;transition:width .7s"></div></div>'
      +'<span style="font-size:12px;font-weight:700;color:var(--text);min-width:80px;text-align:right;white-space:nowrap">'+fmtW(totalExp)+'</span>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="font-size:11px;color:var(--text2);width:22px;flex-shrink:0">전월</span>'
      +'<div style="flex:1;height:7px;background:var(--icon-bg);border-radius:99px;overflow:hidden">'
      +'<div style="height:100%;width:'+(pTotalExp/maxV*100).toFixed(1)+'%;background:var(--expense);border-radius:99px;opacity:.4;transition:width .7s"></div></div>'
      +'<span style="font-size:12px;color:var(--text2);min-width:80px;text-align:right;white-space:nowrap">'+fmtW(pTotalExp)+'</span>'
      +'</div></div></div>'
      +'</div></div>';
  }

  // ── 섹션 타이틀 ──
  function sectionTitle(label, total, prevTotal, goodWhenUp) {
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-left:10px;border-left:3px solid '+(goodWhenUp?'var(--income)':'var(--expense)')+'">'
      +'<span style="font-size:13px;font-weight:700;color:var(--text2)">'+label+'</span>'
      +'<span style="font-size:14px;font-weight:800;color:'+(goodWhenUp?'var(--income)':'var(--expense)')+'">'+fmtW(total)+'</span>'
      +'<span style="font-size:12px;color:var(--text2)">'+diffChip(total, prevTotal, goodWhenUp)+'</span>'
      +'</div>';
  }

  // ── 주별 계정과목 지출 집계 ──
  var weeklyHtml = '';
  if (periodMode === 'month' && totalExp > 0) {
    // 주차 범위 생성: r.s ~ r.e 를 7일씩 분할
    var wkRanges = [];
    var wkCur = new Date(r.s.replace(/-/g, '/') + ' 00:00:00');
    var wkEnd = new Date(r.e.replace(/-/g, '/') + ' 00:00:00');
    var todayStr = _dashLocalDateStr(new Date());
    while (wkCur <= wkEnd) {
      var wkS = _dashLocalDateStr(wkCur);
      var wkE = new Date(wkCur); wkE.setDate(wkE.getDate() + 6);
      if (wkE > wkEnd) wkE = new Date(wkEnd);
      var wkEStr = _dashLocalDateStr(wkE);
      wkRanges.push({ s: wkS, e: wkEStr, isCur: todayStr >= wkS && todayStr <= wkEStr });
      wkCur.setDate(wkCur.getDate() + 7);
    }

    // 개별 계정과목(leaf) 기준 주별 집계
    // { acctId: [amt_wk0, amt_wk1, ...] }
    var acctWeekly = {};
    mtxs.forEach(function(t) {
      var a = acctMap[t.left];
      if (!a || a.type !== 'expense') return;
      if (!acctWeekly[a.id]) acctWeekly[a.id] = new Array(wkRanges.length).fill(0);
      for (var wi = 0; wi < wkRanges.length; wi++) {
        if (t.date >= wkRanges[wi].s && t.date <= wkRanges[wi].e) {
          acctWeekly[a.id][wi] += t.amount;
          break;
        }
      }
    });

    // 지출 있는 계정과목만, 총액 내림차순 정렬
    var acctList = Object.keys(acctWeekly).map(function(id) {
      var total = acctWeekly[id].reduce(function(s, v) { return s + v; }, 0);
      return { id: id, total: total, weeks: acctWeekly[id] };
    }).filter(function(a) { return a.total > 0; })
      .sort(function(a, b) { return b.total - a.total; });

    // 그룹별로 묶기
    var groupOrder = [], groupMap2 = {};
    acctList.forEach(function(item) {
      var a = acctMap[item.id];
      var gid = a.parentId || a.id;
      var gName = (acctMap[gid] || a).name;
      if (!groupMap2[gid]) { groupMap2[gid] = { name: gName, items: [] }; groupOrder.push(gid); }
      groupMap2[gid].items.push(item);
    });

    // 주 라벨 생성 (1주차, 2주차 …)
    var wkLabels = wkRanges.map(function(w, i) {
      var sm = w.s.slice(5).replace('-', '/'), em = w.e.slice(5).replace('-', '/');
      return { label: (i+1)+'주차', range: sm+'~'+em, isCur: w.isCur };
    });

    // 전체 최대값 (바 스케일용)
    var globalMax = 0;
    acctList.forEach(function(item) {
      item.weeks.forEach(function(v) { if (v > globalMax) globalMax = v; });
    });
    if (globalMax === 0) globalMax = 1;

    // HTML 빌드
    var wkToggleId = 'expWk';

    // ── 선택 필터 상태 (전역 유지) ──
    var allAcctIds = acctList.map(function(item){ return item.id; });
    if (!window._expWkSelected) window._expWkSelected = null; // null = 전체
    // 이번 렌더에서 유효한 id만 유지
    if (window._expWkSelected) {
      window._expWkSelected = window._expWkSelected.filter(function(id){
        return allAcctIds.indexOf(id) >= 0;
      });
      if (window._expWkSelected.length === 0) window._expWkSelected = null;
    }

    // ── 계정과목 필터 칩 ──
    var chipHtml = '<div style="padding:12px 16px 10px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:0.5px solid rgba(0,0,0,.06)">'
      + '<button id="expWkChip_all" onclick="window.expWkFilterAll()" style="'
      +   'padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;'
      +   'border:1.5px solid '+(window._expWkSelected===null?'#111':'rgba(0,0,0,.12)')+';'
      +   'background:'+(window._expWkSelected===null?'#111':'transparent')+';'
      +   'color:'+(window._expWkSelected===null?'#fff':'#777')+'">'
      +   '전체'
      + '</button>';
    acctList.forEach(function(item) {
      var a = acctMap[item.id];
      var isSel = window._expWkSelected === null || window._expWkSelected.indexOf(item.id) >= 0;
      chipHtml += '<button id="expWkChip_'+item.id+'" onclick="window.expWkFilterAcct(\''+item.id+'\')" style="'
        + 'padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;'
        + 'border:1.5px solid '+(isSel?'var(--expense)':'rgba(0,0,0,.12)')+';'
        + 'background:'+(isSel?'rgba(192,57,43,.07)':'transparent')+';'
        + 'color:'+(isSel?'var(--expense)':'#aaa')+'">'
        + escapeHTML(a.name)
        + '</button>';
    });
    chipHtml += '</div>';

    // ── 필터 적용한 표시 목록 ──
    var visibleList = window._expWkSelected === null
      ? acctList
      : acctList.filter(function(item){ return window._expWkSelected.indexOf(item.id) >= 0; });

    // 필터된 그룹
    var visGroupOrder = [], visGroupMap = {};
    visibleList.forEach(function(item) {
      var a = acctMap[item.id];
      var gid = a.parentId || a.id;
      var gName = (acctMap[gid] || a).name;
      if (!visGroupMap[gid]) { visGroupMap[gid] = { name: gName, items: [] }; visGroupOrder.push(gid); }
      visGroupMap[gid].items.push(item);
    });

    var groupHtml = visGroupOrder.length === 0
      ? '<div style="padding:24px;text-align:center;color:#aaa;font-size:13px">선택된 계정과목이 없습니다</div>'
      : visGroupOrder.map(function(gid) {
      var g = visGroupMap[gid];
      var gTotal = g.items.reduce(function(s, item) { return s + item.total; }, 0);

      var acctHtml = g.items.map(function(item) {
        var a = acctMap[item.id];
        var uid = wkToggleId + '_' + item.id;
        var maxWk = Math.max.apply(null, item.weeks.concat([1]));
        var wkBarHtml = wkLabels.map(function(wl, wi) {
          var amt = item.weeks[wi] || 0;
          var bw = amt > 0 ? (amt / maxWk * 100).toFixed(1) : '0';
          var isCur = wl.isCur;
          return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0">'
            + '<span style="font-size:11px;color:'+(isCur?'#111':'#777')+';font-weight:'+(isCur?'600':'400')+';width:42px;flex-shrink:0">'
            +   wl.label
            + '</span>'
            + '<div style="flex:1;height:6px;background:var(--surface);border-radius:99px;overflow:hidden">'
            +   '<div style="height:100%;width:'+bw+'%;background:'+(isCur?'var(--income)':'var(--expense)')+';border-radius:99px;opacity:'+(isCur?'1':'0.65')+';transition:width .4s"></div>'
            + '</div>'
            + '<span style="font-size:11px;'+(amt>0?'font-weight:600;color:var(--text)':'color:#aaa')+';min-width:60px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">'
            +   (amt > 0 ? fmtW(amt) : '—')
            + '</span>'
            + '</div>';
        }).join('');

        var pct = totalExp > 0 ? (item.total / totalExp * 100).toFixed(0) : 0;
        return '<div style="border-top:0.5px solid rgba(0,0,0,.05)">'
          + '<div onclick="window.expWkToggle(\''+uid+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 18px 10px 24px;cursor:pointer;transition:background .12s" '
          +   'onmouseenter="this.style.background=\'rgba(0,0,0,.025)\'" onmouseleave="this.style.background=\'\'">'
          +   '<span style="font-size:13px;color:var(--text);flex:1">'+escapeHTML(a.name)+'</span>'
          +   '<span style="font-size:11px;color:#aaa;min-width:26px;text-align:right">'+pct+'%</span>'
          +   '<span style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:68px;text-align:right">'+fmtW(item.total)+'</span>'
          +   '<svg id="'+uid+'-chv" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#aaa" stroke-width="1.5" style="flex-shrink:0;transition:transform .2s"><path d="M4 6l4 4 4-4"/></svg>'
          + '</div>'
          + '<div id="'+uid+'" style="display:none;padding:4px 18px 10px 24px;background:#F7F7F7">'
          +   wkBarHtml
          + '</div>'
          + '</div>';
      }).join('');

      return '<div style="border-bottom:0.5px solid rgba(0,0,0,.06)">'
        + '<div style="display:flex;align-items:center;gap:6px;padding:8px 18px 4px">'
        +   '<span style="font-size:10px;font-weight:600;color:var(--text2);background:#FFFFFF;padding:2px 8px;border-radius:99px;letter-spacing:.2px">'+escapeHTML(g.name)+'</span>'
        +   '<span style="font-size:11px;color:#aaa;margin-left:auto">'+fmtW(gTotal)+'</span>'
        + '</div>'
        + acctHtml
        + '</div>';
    }).join('');

    weeklyHtml = '<div style="margin-top:24px;margin-bottom:20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--expense)">'
      +   '<span style="font-size:13px;font-weight:700;color:var(--text2)">계정과목별 주간 지출</span>'
      +   '<span style="font-size:11px;color:#aaa">항목을 눌러 주차별 내역 확인</span>'
      + '</div>'
      + '<div style="background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)">'
      + chipHtml
      + groupHtml
      + '</div></div>';

    // ── 이벤트 핸들러 ──
    if (!window.expWkToggle) window.expWkToggle = function(uid) {
      var body = document.getElementById(uid);
      var chv  = document.getElementById(uid + '-chv');
      if (!body) return;
      var isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      if (chv) chv.style.transform = isOpen ? '' : 'rotate(180deg)';
    };

    window.expWkFilterAll = function() {
      window._expWkSelected = null;
      renderExpense();
    };

    window.expWkFilterAcct = function(id) {
      var all = Object.keys(acctWeekly).filter(function(aid){
        return (acctWeekly[aid]||[]).reduce(function(s,v){return s+v;},0) > 0;
      });
      // 현재 전체 선택 상태면 → 이 항목만 선택
      if (window._expWkSelected === null) {
        window._expWkSelected = [id];
      } else {
        var idx = window._expWkSelected.indexOf(id);
        if (idx >= 0) {
          window._expWkSelected.splice(idx, 1);
          if (window._expWkSelected.length === 0) window._expWkSelected = null;
        } else {
          window._expWkSelected.push(id);
          if (window._expWkSelected.length === all.length) window._expWkSelected = null;
        }
      }
      renderExpense();
    };
  }

  document.getElementById('expenseContent').innerHTML =
    '<div style="font-size:12px;color:var(--text2);margin-bottom:12px">'+periodLabel+'</div>'
    + summaryHtml
    + cmpHtml
    + weeklyHtml
    + sectionTitle('수익', totalRev, pTotalRev, true)
    + (revHtml || '<div class="card card-body" style="margin-bottom:10px"><div style="color:var(--text2);font-size:13px">이번 달 수익 거래가 없습니다</div></div>')
    + '<div style="margin-top:20px"></div>'
    + sectionTitle('지출', totalExp, pTotalExp, false)
    + (expHtml || '<div class="card card-body"><div style="color:var(--text2);font-size:13px">이번 달 지출 거래가 없습니다</div></div>');
}

window.toggleExpCard = function(id) {
  var body = document.getElementById(id);
  var btn  = document.getElementById(id + '-btn');
  if (!body || !btn) return;
  var isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  btn.textContent = isOpen ? '+' : '−';
  btn.style.background = isOpen ? 'rgba(0,0,0,.07)' : 'rgba(0,0,0,.12)';
  btn.style.color = isOpen ? '#777' : 'var(--income)';
  btn.style.borderColor = isOpen ? 'rgba(0,0,0,.08)' : 'rgba(0,0,0,.25)';
};



/* ══ BALANCE ══ */
function renderBalance() {
  const bals = calcBalances();
  const asA = accts.filter(a=>a.type==='asset');
  const liA = accts.filter(a=>a.type==='liability');
  const tA = asA.reduce((s,a)=>s+(bals[a.id]||0),0);
  const tL = liA.reduce((s,a)=>s+(bals[a.id]||0),0);
  const net = tA - tL;
  const debtRatio = tA>0 ? tL/tA*100 : 0;

  // 전월 순자산 계산
  var prevNetBal = 0;
  if (periodMode === 'month') {
    var pmo = viewMonth-1, pyr = viewYear;
    if (pmo<0){pmo=11;pyr--;}
    var pCutoff = dateRange(pyr,pmo).e;
    var pBals = {}; accts.forEach(a=>{pBals[a.id]=a.init||0;});
    txs.filter(t=>t.date<=pCutoff&&!isFutureInstall(t)).forEach(t=>{
      var la=accts.find(a=>a.id===t.left), ra=accts.find(a=>a.id===t.right);
      if(!la||!ra) return;
      var lS=(['asset','expense'].includes(la.type))?1:-1;
      var rS=(['liability','capital','revenue'].includes(ra.type))?1:-1;
      if(pBals[t.left]!==undefined) pBals[t.left]+=lS*t.amount;
      if(pBals[t.right]!==undefined) pBals[t.right]+=rS*t.amount;
    });
    accts.forEach(a=>{
      if(a.type==='asset') prevNetBal+=(pBals[a.id]||0);
      if(a.type==='liability') prevNetBal-=(pBals[a.id]||0);
    });
  }
  const netDiff = net - prevNetBal;

  // 그룹(부모 계정) 기준으로 자산/부채 표시 (CC 레이블 자산·부채에서 제거)
  const mkAcctRows = (type, tot, color) => {
    const parents  = accts.filter(a => a.type === type && !a.parentId);
    const acctMap  = {};
    accts.forEach(a => { acctMap[a.id] = a; });

    return parents.map(group => {
      const children = accts.filter(a => a.parentId === group.id);
      const groupVal = children.length
        ? children.reduce((s, c) => s + (bals[c.id] || 0), 0)
        : (bals[group.id] || 0);
      const gp = tot > 0 ? groupVal / tot * 100 : 0;

      // 부채의 경우 완납 예정 계산 (할부 남은 회차 기반)
      var payoffInfo = '';
      if (type === 'liability' && groupVal > 0) {
        var remainMonths = null;
        var relatedInstalls = txs.filter(t => {
          var ra = acctMap[t.right];
          return ra && (ra.id===group.id || ra.parentId===group.id) && t.install && t.install.total>1;
        });
        if (relatedInstalls.length > 0) {
          var maxRemain = relatedInstalls.reduce(function(mx, t){
            return Math.max(mx, t.install.total - t.install.current);
          }, 0);
          if (maxRemain >= 0) {
            var payoffDate = new Date(viewYear, viewMonth + maxRemain, 1);
            payoffInfo = '<div style="font-size:10px;color:var(--text2);margin-top:2px">완납 예정 '+payoffDate.getFullYear()+'.'+(payoffDate.getMonth()+1)+'월</div>';
          }
        }
      }

      const childRows = children.map(c => {
        const v = bals[c.id] || 0;
        const cp = tot > 0 ? v / tot * 100 : 0;
        return `<div class="cat-bar-row" style="padding-left:18px;background:rgba(255,255,255,.03)">
          <div class="cat-bar-name" style="color:#555;font-size:12px">${escapeHTML(c.name)}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.max(0,cp).toFixed(1)}%;background:${color};opacity:.7"></div></div>
          <div class="cat-bar-val" style="color:#555;font-size:12px">${fmtW(v)}</div>
        </div>`;
      }).join('');

      return `
        <div class="cat-bar-row" style="padding-top:10px;padding-bottom:${children.length?'4px':'8px'}">
          <div class="cat-bar-name" style="font-weight:700;display:flex;flex-direction:column;gap:0">
            <span>${escapeHTML(group.name)}</span>${payoffInfo}
          </div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.max(0,gp).toFixed(1)}%;background:${color}"></div></div>
          <div class="cat-bar-val" style="color:${color}">${fmtW(groupVal)}</div>
        </div>
        ${childRows}`;
    }).join('');
  };

  // 자산 구성 도넛 차트 데이터
  const assetGroups = accts.filter(a=>a.type==='asset'&&!a.parentId).map(g=>{
    const children = accts.filter(a=>a.parentId===g.id);
    const val = children.length ? children.reduce((s,c)=>s+(bals[c.id]||0),0) : (bals[g.id]||0);
    return {name:g.name, val:Math.max(0,val)};
  }).filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
  const donutColors = ['var(--income)','var(--income)','#8B9E7A','#555','#7A8CA0','#9E8A7A'];
  const donutTotal = assetGroups.reduce((s,d)=>s+d.val,0)||1;

  // 도넛 SVG 생성
  let donutSvg = '';
  if (assetGroups.length > 0) {
    let cumAngle = -90;
    const cx=60, cy=60, r=46, ir=28;
    let paths = '';
    assetGroups.forEach((d,i)=>{
      const pct = d.val/donutTotal;
      const angle = pct*360;
      const startRad = cumAngle*Math.PI/180;
      const endRad = (cumAngle+angle)*Math.PI/180;
      const x1=cx+r*Math.cos(startRad), y1=cy+r*Math.sin(startRad);
      const x2=cx+r*Math.cos(endRad),   y2=cy+r*Math.sin(endRad);
      const ix1=cx+ir*Math.cos(startRad), iy1=cy+ir*Math.sin(startRad);
      const ix2=cx+ir*Math.cos(endRad),   iy2=cy+ir*Math.sin(endRad);
      const large = angle>180?1:0;
      const col = donutColors[i%donutColors.length];
      paths += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${ix2.toFixed(1)} ${iy2.toFixed(1)} A${ir} ${ir} 0 ${large} 0 ${ix1.toFixed(1)} ${iy1.toFixed(1)} Z" fill="${col}" opacity=".85" stroke="var(--card)" stroke-width="1.5"/>`;
      cumAngle += angle;
    });
    donutSvg = `<svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0">${paths}<text x="60" y="56" text-anchor="middle" style="font-size:9px;fill:#999999">총자산</text><text x="60" y="68" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--text)">${fmtShort(tA)}</text></svg>`;
  }

  // 순자산 추이 (최근 6개월 간이 계산)
  var netHistory = [];
  for (var hi=5; hi>=0; hi--) {
    var hmo = viewMonth-hi, hyr = viewYear;
    while(hmo<0){hmo+=12;hyr--;}
    var hCutoff = dateRange(hyr,hmo).e;
    var hBals = {}; accts.forEach(a=>{hBals[a.id]=a.init||0;});
    txs.filter(t=>t.date<=hCutoff&&!isFutureInstall(t)).forEach(t=>{
      var la2=accts.find(a=>a.id===t.left), ra2=accts.find(a=>a.id===t.right);
      if(!la2||!ra2) return;
      var lS2=(['asset','expense'].includes(la2.type))?1:-1;
      var rS2=(['liability','capital','revenue'].includes(ra2.type))?1:-1;
      if(hBals[t.left]!==undefined) hBals[t.left]+=lS2*t.amount;
      if(hBals[t.right]!==undefined) hBals[t.right]+=rS2*t.amount;
    });
    var hNet = 0;
    accts.forEach(a=>{
      if(a.type==='asset') hNet+=(hBals[a.id]||0);
      if(a.type==='liability') hNet-=(hBals[a.id]||0);
    });
    netHistory.push({y:hyr, m:hmo, v:hNet});
  }
  const nhMax = Math.max(...netHistory.map(h=>Math.abs(h.v)),1);
  const nhMin = Math.min(...netHistory.map(h=>h.v));
  const nhRange = nhMax - nhMin || 1;
  const svgW=280, svgH=56, pad=8;
  const pts = netHistory.map((h,i)=>{
    const x = pad + i*(svgW-pad*2)/5;
    const y = svgH - pad - (h.v - nhMin)/nhRange*(svgH-pad*2);
    return {x,y,v:h.v,m:h.m,yr:h.y};
  });
  const polyline = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPath = `M${pts[0].x.toFixed(1)},${svgH} `+pts.map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+` L${pts[pts.length-1].x.toFixed(1)},${svgH} Z`;
  const trendUp = pts[pts.length-1].v >= pts[0].v;
  const trendColor = trendUp ? 'var(--income)' : 'var(--expense)';
  const netTrendSvg = `<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" style="overflow:visible">
    <defs><linearGradient id="nhg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${trendUp?'#5BA882':'#C96B6B'}" stop-opacity=".2"/><stop offset="100%" stop-color="${trendUp?'#5BA882':'#C96B6B'}" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#nhg)"/>
    <polyline points="${polyline}" fill="none" stroke="${trendColor}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${trendColor}"/>
    <text x="${p.x.toFixed(1)}" y="${svgH}" text-anchor="middle" style="font-size:9px;fill:#999999">${p.m+1}월</text>`).join('')}
  </svg>`;

  document.getElementById('balanceContent').innerHTML = `
    <div class="g3" style="margin-bottom:18px">
      ${[['총 부채',tL,'var(--expense)'],['총 자산',tA,'var(--income)'],['순자산',net,net>=0?'var(--income)':'var(--expense)']].map(([l,v,c])=>`
      <div class="metric-card">
        <div class="metric-label">${l}</div>
        <div class="metric-value" style="color:${c}">${fmtW(v)}</div>
        ${l==='순자산'&&periodMode==='month'?`<div class="metric-sub" style="color:${netDiff>=0?'var(--text)':'var(--expense)'}">${netDiff>=0?'+':''}${fmtShort(netDiff)} 전월 대비</div>`:''}
      </div>`).join('')}
    </div>

    <!-- 순자산 추이 -->
    <div class="card card-body" style="margin-bottom:18px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px">순자산 추이 (최근 6개월)</div>
      <div style="padding:4px 0 16px">${netTrendSvg}</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px">
        <span>${pts[0].yr}년 ${pts[0].m+1}월 ${fmtShort(pts[0].v)}</span>
        <span style="color:${trendColor};font-weight:700">${trendUp?'▲ 상승 추세':'▼ 하락 추세'}</span>
        <span>현재 ${fmtShort(net)}</span>
      </div>
    </div>

    <div class="g2">
      <div>
        <div class="section-title">자산 상세</div>
        <!-- 자산 도넛 차트 -->
        ${assetGroups.length>0?`<div class="card card-body" style="margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px">자산 구성</div>
          <div style="display:flex;align-items:center;gap:16px">
            ${donutSvg}
            <div style="flex:1;min-width:0">
              ${assetGroups.map((d,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
                <div style="width:8px;height:8px;border-radius:50%;background:${donutColors[i%donutColors.length]};flex-shrink:0"></div>
                <span style="font-size:12px;color:#555;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(d.name)}</span>
                <span style="font-size:12px;font-weight:700;color:var(--text);white-space:nowrap">${(d.val/donutTotal*100).toFixed(1)}%</span>
              </div>`).join('')}
            </div>
          </div>
        </div>`:''}
        <div class="card card-body">${mkAcctRows('asset',tA,'var(--text)')}
          <div class="cat-bar-row" style="border-top:2px solid rgba(0,0,0,.06);margin-top:4px;padding-top:10px">
            <div class="cat-bar-name"><b>합계</b></div>
            <div class="cat-bar-track"></div>
            <div class="cat-bar-val" style="color:var(--purple);font-size:14px"><b>${fmtW(tA)}</b></div>
          </div>
        </div>
      </div>
      <div>
        <div class="section-title">부채 상세</div>
        <div class="card card-body">${mkAcctRows('liability',tL,'var(--expense)')}
          <div class="cat-bar-row" style="border-top:2px solid rgba(0,0,0,.06);margin-top:4px;padding-top:10px">
            <div class="cat-bar-name"><b>합계</b></div>
            <div class="cat-bar-track"></div>
            <div class="cat-bar-val" style="color:var(--red);font-size:14px"><b>${fmtW(tL)}</b></div>
          </div>
          <div style="margin-top:14px;padding:12px;background:rgba(255,69,58,.12);border-radius:8px">
            <div style="font-size:11px;color:var(--red);margin-bottom:6px;font-weight:600">부채비율 (부채/자산)</div>
            <div style="height:6px;background:rgba(192,57,43,.12);border-radius:99px;overflow:hidden;margin-bottom:5px">
              <div style="height:100%;width:${Math.min(debtRatio,100).toFixed(1)}%;background:${debtRatio>50?'var(--expense)':'var(--text)'};border-radius:99px"></div>
            </div>
            <div style="font-size:13px;font-weight:700;color:${debtRatio>50?'var(--expense)':'#555'}">${debtRatio.toFixed(1)}%</div>
          </div>
        </div>
      </div>
    </div>`;
}

/* ══ CREDIT CARD ══ */
function renderCreditCard() {
  const ccAccts = accts.filter(a=>a.subtype==='credit');
  if (!ccAccts.length) {
    document.getElementById('ccContent').innerHTML =
      '<div class="card card-body"><div style="color:var(--text2)">신용카드 항목이 없습니다. 설정에서 추가하세요.</div></div>';
    return;
  }

  const html = ccAccts.map(cc => {
    const bals = calcBalances();
    const outstandingBal = bals[cc.id] || 0;
    // [FIX] 청구 기간 범위 기반으로 이번 달 / 지난 달 집계
    const thisRange = ccBillingRange(cc.cc, viewYear, viewMonth);
    const thisMonth = ccBillingAmount(cc, viewYear, viewMonth);
    const lastMonth = ccLastBillingAmount(cc, viewYear, viewMonth);
    const payDate = ccPaymentDate(cc, viewYear, viewMonth);
    const days = daysUntil(payDate);
    const urgent = days !== null && days <= 7 && days >= 0;

    // [FIX] 거래 목록도 청구 기간(billing range) 기준으로 표시
    const ccTxs = txs.filter(t => t.right === cc.id && t.date >= thisRange.s && t.date <= thisRange.e)
                     .sort((a,b) => b.date.localeCompare(a.date));

    // 청구 기간 표시용 레이블
    const billingLabel = thisRange.s.replace(/-/g,'.') + ' ~ ' + thisRange.e.replace(/-/g,'.');

    // By sub-item breakdown
    const byItem = {};
    ccTxs.forEach(t => {
      var k = t.item + (t.subitem?' ('+t.subitem+')':'');
      byItem[k] = (byItem[k]||0) + t.amount;
    });

    const billing = cc.cc || {};

    // 잔여 할부채무: 이번 청구기간 이후에 남은 할부 회차 합계 (이번 달 청구예정 제외)
    const remainInstall = txs.filter(t => {
      return t.right === cc.id && t.install && t.install.total > 1
        && t.date > thisRange.e; // 이번 청구기간 종료일 이후의 회차만
    }).reduce((s, t) => s + t.amount, 0);

    return `<div class="card" style="margin-bottom:16px;overflow:hidden${urgent?';border-color:rgba(192,57,43,.22)':''}" >
      <div style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--card-border)${urgent?';background:rgba(255,69,58,.12)':''}">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;background:${urgent?'rgba(192,57,43,.12)':'rgba(0,0,0,.05)'};border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.7"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/><path d="M1.5 6.5h13"/></svg></div>
          <div>
            <div style="font-weight:700;font-size:16px">${escapeHTML(cc.name)}</div>
            <div style="font-size:11px;color:var(--accent2);margin-top:2px;font-weight:600">
              이번 청구: ${billingLabel}
              <button onclick="(function(btn){var el=btn.closest('[data-ccwrap]').querySelector('.cc-billing-detail');var open=el.style.display!=='none';el.style.display=open?'none':'block';btn.textContent=open?'▼ 청구 설정':'▲ 접기';})(this)" style="font-size:10px;color:var(--text2);background:#FFFFFF;border:1px solid rgba(0,0,0,.08);border-radius:5px;padding:1px 7px;cursor:pointer;font-family:var(--font);margin-left:6px">▼ 청구 설정</button>
            </div>
            <div class="cc-billing-detail" style="display:none;font-size:11px;color:var(--text2);margin-top:3px">
              매월 ${billing.billing_start}일~${billing.billing_end}일 청구 · 결제일: 매월 ${billing.billing_day}일
            </div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--text2)">결제 예정일</div>
          <div style="font-size:14px;font-weight:700;color:${urgent?'var(--expense)':'var(--text)'}">${payDate}</div>
          <div style="font-size:12px;color:${urgent?'var(--expense)':'#777'}">${days!==null?(days>=0?'D-'+days:'D+'+Math.abs(days)):'−'}</div>
        </div>
      </div>

      <!-- 지표 그리드: 목표한도 미설정 시 숨김 처리 -->
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1px;background:var(--card-border)">
        ${[
          ['이번 달 청구예정', fmtW(thisMonth), urgent?'var(--expense)':'var(--text)', true],
          ['지난달 청구액',   fmtW(lastMonth), '#555', true],
          ['잔여 할부채무',   fmtW(remainInstall), remainInstall>0?'var(--text)':'#777', true],
          ['카드 잔여채무',   fmtW(outstandingBal), outstandingBal>0?'var(--expense)':'var(--text)', true],
          ...(billing.target>0 ? [['월 목표한도', fmtW(billing.target), '#777', true]] : []),
        ].map(([l,v,c])=>`<div style="padding:12px 14px;background:var(--card)">
          <div style="font-size:11px;color:var(--text2);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l}</div>
          <div style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:${c};white-space:nowrap">${v}</div>
        </div>`).join('')}
      </div>

      <!-- 목표한도 프로그레스바 -->
      ${billing.target>0 ? `<div style="padding:10px 20px;background:var(--surface);border-top:1px solid rgba(0,0,0,.06)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-size:11px;color:var(--text2)">목표한도 사용률</span>
          <span style="font-size:12px;font-weight:700;color:${thisMonth>billing.target?'var(--expense)':'#555'}">${(thisMonth/(billing.target||1)*100).toFixed(1)}% ${thisMonth>billing.target?'<span style="font-size:10px;color:var(--red)">초과</span>':''}</span>
        </div>
        <div style="height:7px;background:var(--surface);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${Math.min(thisMonth/(billing.target||1)*100,100).toFixed(1)}%;background:${thisMonth>billing.target?'var(--expense)':thisMonth/billing.target>0.8?'var(--income)':'var(--income)'};border-radius:99px;transition:width .3s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:3px;font-size:10px;color:var(--text2)">
          <span>사용 ${fmtShort(thisMonth)}</span>
          <span>${thisMonth>billing.target?'초과 '+fmtShort(thisMonth-billing.target):'잔여 '+fmtShort(billing.target-thisMonth)}</span>
        </div>
      </div>` : ''}

      <!-- 카테고리별 지출 비중 -->
      ${(()=>{
        const _ccAcctMap = {}; accts.forEach(a=>{ _ccAcctMap[a.id]=a; });
        const cats = {};
        ccTxs.forEach(t=>{
          const la = _ccAcctMap[t.left];
          const k = la ? la.name : t.item;
          cats[k]=(cats[k]||0)+t.amount;
        });
        const catList = Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
        const catTotal = catList.reduce((s,[,v])=>s+v,0)||1;
        if (!catList.length) return '';
        const catColors=['var(--income)','var(--income)','#555','var(--expense)','#8B9E7A'];
        return `<div style="padding:12px 20px;border-top:1px solid var(--card-border)">
          <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px">이번 청구 카테고리별 지출</div>
          ${catList.map(([k,v],i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
            <div style="width:6px;height:6px;border-radius:50%;background:${catColors[i]};flex-shrink:0"></div>
            <span style="font-size:12px;color:#555;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(k)}</span>
            <div style="flex:0 0 80px;height:4px;background:var(--bar-inactive);border-radius:99px;overflow:hidden"><div style="height:100%;width:${(v/catTotal*100).toFixed(1)}%;background:${catColors[i]};border-radius:99px"></div></div>
            <span style="font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;min-width:52px;text-align:right">${fmtShort(v)}</span>
          </div>`).join('')}
        </div>`;
      })()}

      <!-- 청구 내역 -->
      <div style="padding:14px 20px;border-top:1px solid var(--card-border)">
        <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none" onclick="toggleCCTxList(this)">
          <div>
            <div style="font-size:12px;font-weight:700;color:var(--text2)">청구 기간 사용 내역 (${ccTxs.length}건)</div>
            <div style="font-size:11px;color:var(--text2);margin-top:2px">${billingLabel}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <div class="cc-toggle-btn" style="width:26px;height:26px;border-radius:8px;background:#FFFFFF;border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:300;color:#555;flex-shrink:0;transition:background .15s">+</div>
          </div>
        </div>
        <div class="cc-tx-list" style="display:none;margin-top:10px">
          ${ccTxs.length ? ccTxs.map(t=>txRowHTML(t)).join('') : '<div style="color:var(--text2);font-size:13px">해당 청구 기간 사용 내역 없음</div>'}
        </div>
      </div>
    </div>`;
  });

  document.getElementById('ccContent').innerHTML = `<div data-ccwrap>${html.join('</div><div data-ccwrap="1">')}</div>`;
}

window.toggleCCTxList = function(headerEl) {
  var list = headerEl.parentNode.querySelector('.cc-tx-list');
  var btn  = headerEl.querySelector('.cc-toggle-btn');
  if (!list || !btn) return;
  var isOpen = list.style.display !== 'none';
  list.style.display = isOpen ? 'none' : 'block';
  btn.textContent = isOpen ? '+' : '−';
  btn.style.background = isOpen ? 'rgba(0,0,0,.07)' : 'rgba(0,0,0,.12)';
  btn.style.color = isOpen ? '#555' : 'var(--income)';
  btn.style.borderColor = isOpen ? 'rgba(0,0,0,.08)' : 'rgba(0,0,0,.25)';
};


/* ══ SETTINGS ══ */
function renderSettings() {
  const ccAccts = accts.filter(a=>a.subtype==='credit');

  // ── 계층 구조 렌더 헬퍼 ──
  // 유형별 색상
  const TC = {
    asset:    {color:'#C9A96E', bg:'rgba(0,0,0,.05)',  label:'자산'},
    liability:{color:'#C96B6B', bg:'rgba(192,57,43,.1)',  label:'부채'},
    capital:  {color:'#9896A8', bg:'rgba(152,150,168,.12)',  label:'순자산'},

      flashSuccess(document.querySelector('#page-settings .card'));

window.stEditAccount = id => {
  const a = accts.find(x=>x.id===id);
  if (!a) return;
  const modal = document.getElementById('st-edit-modal');
  if (!modal) return;
  // 일반 모드 세팅
  modal.querySelector('[name=editId]').value = id;
  modal.querySelector('[name=editIsCC]').value = '0';
  modal.querySelector('[name=editName]').value = a.name;

  // 금액 필드 자동 쉼표
  ['editBudget','editTarget','editCCInit'].forEach(function(nm) {
    var el = modal.querySelector('[name='+nm+']');
    if (!el) return;
    el.oninput = function() {
      var digits = this.value.replace(/[^0-9]/g,'');
      var cursor = this.selectionStart;
      var prev = this.value;
      this.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g,',');
      var diff = this.value.length - prev.length;
      try { this.setSelectionRange(cursor+diff, cursor+diff); } catch(e) {}
    };
  });
  // costType 체크박스 세팅
  var costTypeWrap = document.getElementById('stEditCostTypeWrap');
  if (costTypeWrap) {
    costTypeWrap.style.display = a.type==='expense' ? '' : 'none';
    var cb = document.getElementById('editCostTypeCheck');
    if (cb) {
      cb.checked = a.costType === 'fixed';
      var lbl = document.getElementById('ctCheckLabel');
      if (lbl) {
        lbl.style.borderColor = cb.checked ? 'var(--text)' : 'var(--card-border)';
        lbl.style.background  = cb.checked ? 'rgba(201,169,110,.07)' : 'rgba(0,0,0,.03)';
      }
    }
  }
  document.getElementById('stEditNormalFields').style.display = 'block';
  document.getElementById('stEditCCFields').style.display = 'none';
  document.getElementById('stEditTitle').textContent = '항목 수정';
  const budWrap = document.getElementById('stEditBudgetWrap');
  if (budWrap) budWrap.style.display = a.type==='expense' ? 'block' : 'none';
  modal.querySelector('[name=editBudget]').value = fmt(budgets[id]||0);
  modal.style.display = 'flex';

window.deleteAcct = id => {
  var acct = accts.find(a => a.id === id);
  if (!acct) return;

  // [FIX] 무결성 체크 ①: 이 계정을 참조하는 거래 수 확인
  var refTxs = txs.filter(t => t.left === id || t.right === id);
  if (refTxs.length > 0) {
    alert('이 항목을 사용하는 거래가 ' + refTxs.length + '건 있어 삭제할 수 없습니다.\n\n'
      + '최근 거래 예시:\n'
      + refTxs.slice(0, 3).map(function(t){ return '  · ' + t.date + ' ' + t.item + ' ' + fmtW(t.amount); }).join('\n')
      + (refTxs.length > 3 ? '\n  … 외 ' + (refTxs.length - 3) + '건' : '')
      + '\n\n먼저 해당 거래를 삭제하거나 다른 항목으로 변경해주세요.');
    return;
  }

  // [FIX] 무결성 체크 ②: 자식 계정 존재 여부
  var children = accts.filter(a => a.parentId === id);
  if (children.length > 0) {
    var childNames = children.map(function(c){ return c.name; }).join(', ');
    alert('이 그룹 아래에 하위 항목이 ' + children.length + '개 있어 삭제할 수 없습니다.\n\n'
      + '하위 항목: ' + childNames + '\n\n'
      + '하위 항목을 먼저 삭제하거나 다른 그룹으로 이동해주세요.');
    return;
  }

  // [FIX] 무결성 체크 ③: 신용카드 결제통장으로 참조되는지 확인
  var ccRefs = accts.filter(a => a.cc && a.cc.payment_acct === id);
  if (ccRefs.length > 0) {
    var ccNames = ccRefs.map(function(c){ return c.name; }).join(', ');
    alert('이 계정이 신용카드 결제통장으로 설정되어 있어 삭제할 수 없습니다.\n\n'
      + '참조 카드: ' + ccNames + '\n\n'
      + '해당 카드의 결제통장을 먼저 변경해주세요.');
    return;
  }

  if (!confirm('「' + acct.name + '」 항목을 삭제하시겠습니까?')) return;
  accts = accts.filter(a => a.id !== id);
  // 예산도 함께 삭제
  if (budgets[id]) { delete budgets[id]; }
  save(); renderSettings();
};

/* ══ 데이터 무결성 검증 ══
   앱 시작 시 + 설정 페이지 진입 시 실행
   문제가 있으면 자동 복구하고 사용자에게 알림 */
function checkIntegrity() {
  var issues = [];
  var fixed  = 0;
  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });

  // ① 고아 자식 계정: parentId가 존재하지 않는 부모를 가리키는 경우
  var orphanIds = [];
  accts.forEach(function(a) {
    if (a.parentId && !acctMap[a.parentId]) {
      // 이 고아 계정을 참조하는 거래가 있는지 확인
      var hasRef = txs.some(function(t){ return t.left === a.id || t.right === a.id; });
      if (hasRef) {
        // 거래가 있으면 최상위로 승격 (데이터 보존)
        issues.push('「' + a.name + '」(ID:' + a.id + ')의 상위 그룹(ID:' + a.parentId + ')이 존재하지 않아 최상위로 이동했습니다. (동명의 다른 항목에는 영향 없음)');
        a.parentId = undefined;
        fixed++;
      } else {
        // 거래가 없으면 삭제 대상
        orphanIds.push(a.id);
        issues.push('옛 항목 「' + a.name + '」(ID:' + a.id + ', 삭제된 그룹 ' + a.parentId + ' 소속) → 참조 거래 0건, 자동 제거. 현재 사용 중인 동명 항목에는 영향 없음.');
        fixed++;
      }
    }
  });
  // 미참조 고아 계정 일괄 제거
  if (orphanIds.length > 0) {
    accts = accts.filter(function(a){ return orphanIds.indexOf(a.id) < 0; });
    // acctMap도 갱신
    acctMap = {};
    accts.forEach(function(a){ acctMap[a.id] = a; });
  }

  // ② 거래에서 삭제된 계정을 참조하는 경우 (경고만, 자동 삭제 안 함)
  var orphanTxCount = 0;
  txs.forEach(function(t) {
    if (!acctMap[t.left] || !acctMap[t.right]) {
      orphanTxCount++;
    }
  });
  if (orphanTxCount > 0) {
    issues.push(orphanTxCount + '건의 거래가 삭제된 계정을 참조하고 있어 잔액 계산에서 누락됩니다.');
  }

  // ③ 신용카드 결제통장이 존재하지 않는 경우
  accts.filter(function(a){ return a.cc && a.cc.payment_acct; }).forEach(function(a) {
    if (!acctMap[a.cc.payment_acct]) {
      issues.push('「' + a.name + '」의 결제통장이 존재하지 않습니다. 설정에서 다시 지정해주세요.');
    }
  });

  // ④ 중복 ID 확인
  var idCount = {};
  accts.forEach(function(a) {
    idCount[a.id] = (idCount[a.id] || 0) + 1;
  });
  Object.keys(idCount).forEach(function(id) {
    if (idCount[id] > 1) {
      issues.push('계정 ID 「' + id + '」가 ' + idCount[id] + '회 중복되어 있습니다.');
    }
  });

  // 자동 수정분이 있으면 저장
  if (fixed > 0) {
    save();
  }

  return issues;
}

window.importData = e => {

  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      // [FIX] WARN-3: 구조 검증 — 배열 여부 및 필수 필드 확인
      if (!Array.isArray(d.accts) || !Array.isArray(d.txs)) {
        alert('파일 형식이 올바르지 않습니다.\n(accts, txs 배열이 필요합니다)'); return;

      const validAccts = d.accts.every(a => a.id && a.name && a.type);
      const validTxs   = d.txs.every(t => t.id && t.date && t.amount != null && t.left && t.right);
      if (!validAccts || !validTxs) {
        alert('데이터 구조가 올바르지 않습니다.\n필수 필드(id, name, type / id, date, amount, left, right)가 누락된 항목이 있습니다.'); return;
      }
      if (d.accts)   accts   = d.accts;
      if (d.txs)     txs     = d.txs;
      if (d.budgets && typeof d.budgets === 'object' && !Array.isArray(d.budgets)) budgets = d.budgets;
      if (d.cycleStartDay != null) { cycleStartDay = parseInt(d.cycleStartDay)||1; LS.set('gb_cycle_start', cycleStartDay); }
      if (d.installRoundMode !== undefined) { installRoundMode = d.installRoundMode||''; LS.set('gb_install_round', installRoundMode); }

window.openCalDay = function(dateStr) {
  var dayTxs = txs.filter(function(t){ return t.date === dateStr; });
  if (!dayTxs.length) return;

  var dp   = dateStr.split('-');
  var dObj = new Date(+dp[0], +dp[1]-1, +dp[2]);
  var KO_DAY = ['일','월','화','수','목','금','토'];
  var title = dp[0]+'년 '+parseInt(dp[1])+'월 '+parseInt(dp[2])+'일 ('+KO_DAY[dObj.getDay()]+')';

  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });
  var totalInc = 0, totalExp = 0;
  dayTxs.forEach(function(t){
    var la = acctMap[t.left]  || null;
    var ra = acctMap[t.right] || null;
    if (la && la.type === 'expense') totalExp += t.amount;
    if (ra && ra.type === 'revenue') totalInc += t.amount;
  });

  var summaryParts = [];
  if (totalInc > 0) summaryParts.push('<span style="color:var(--text2)">+'+fmtW(totalInc)+'</span>');
  if (totalExp > 0) summaryParts.push('<span style="color:var(--text2)">-'+fmtW(totalExp)+'</span>');
  if (!summaryParts.length) summaryParts.push('<span style="color:var(--text2)">이체/조정</span>');

  document.getElementById('calDayTitle').textContent = title;
  document.getElementById('calDaySummary').innerHTML = summaryParts.join(' · ') + ' · ' + dayTxs.length + '건';
  document.getElementById('calDayList').innerHTML = dayTxs
    .sort(function(a,b){ return a.item.localeCompare(b.item); })
    .map(function(t){ return txRowHTML(t, true); }).join('');

  var modal = document.getElementById('cal-day-modal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
};

  var modal = document.getElementById('cal-day-modal');
  if (modal) modal.style.display = 'none';

};

window.openAcctTxPopup = function(acctId, label, isExpStr) {

  var mtxs   = monthTxs(viewYear, viewMonth);
  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });

  var filtered = mtxs.filter(function(t){
    return isExp ? t.left === acctId : t.right === acctId;

  if (!filtered.length) return;

  var total = filtered.reduce(function(s, t){ return s + t.amount; }, 0);

  document.getElementById('calDayTitle').textContent = label;
  document.getElementById('calDaySummary').innerHTML =
    '<span style="color:'+amtColor+'">'+amtPrefix+fmtW(total)+'</span>'
    + ' · ' + filtered.length + '건 · '

  filtered.sort(function(a, b){ return b.date.localeCompare(a.date); });

    filtered.map(function(t){ return txRowHTML(t, true); }).join('');

  var modal = document.getElementById('cal-day-modal');

function updateCCBadge() {

  } else {
    var tLabel = (PICKER_TYPE_COLORS[st.type]||{}).label || st.type;
    bc += '<span onclick="window._mobPickerGoType()" style="font-size:11px;font-weight:600;background:#FFFFFF;color:#555;padding:3px 10px;border-radius:99px;cursor:pointer">← 유형</span>';
    bc += '<span style="font-size:12px;font-weight:700;color:var(--text)">'+escapeHTML(tLabel)+'</span>';
    if (st.groupId) {
      var gNameBC = (accts.find(function(a){return a.id===st.groupId;})||{}).name||'';
      bc += '<span style="font-size:11px;color:#ccc">›</span>'
        +'<span style="font-size:12px;font-weight:600;color:'+(PICKER_TYPE_COLORS[st.type]||{color:'#111'}).color+'">'+escapeHTML(gNameBC)+'</span>';
    }
  }
  bc += '</div>';
  bcEl.innerHTML = bc;

  var c = '';
  if (!st.type) {
    var TYPES = [
      {id:'expense',  label:'비용',   sub:'지출 항목',   dot:'var(--expense)'},
      {id:'revenue',  label:'수익',   sub:'급여·이자',   dot:'#555'},
      {id:'asset',    label:'자산',   sub:'현금·통장',   dot:'#3B8BD4'},
      {id:'liability',label:'부채',   sub:'대출·카드',   dot:'var(--expense)'},
    ];
    c = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 28px">';
    TYPES.forEach(function(tp) {
      c += '<div onclick="window._mobPickerSelType(\''+tp.id+'\')" '
        +'style="border:1.5px solid #E8E8E8;border-radius:12px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:background .1s" '
        +'onmouseenter="this.style.background=\'#FAFAFA\'" onmouseleave="this.style.background=\'\'">'
        +'<div style="width:8px;height:8px;border-radius:50%;background:'+tp.dot+'"></div>'
        +'<div style="font-size:15px;font-weight:600;color:var(--text)">'+tp.label+'</div>'
        +'<div style="font-size:11px;color:#aaa;text-align:center">'+tp.sub+'</div>'
        +'</div>';
    });
    c += '</div>';
  } else {
    /* ── 아코디언 3열 그리드 (스크롤형 분류 선택) ── */
    var typeAccts2 = accts.filter(function(a){ return a.type===st.type && !a.parentId && a.subtype!=='credit'; });
    // 신용카드(liability) 별도 추가
    if (st.type==='liability') {
      var ccList2 = accts.filter(function(a){ return a.subtype==='credit'; });
      typeAccts2 = typeAccts2.concat(ccList2);
    }
    var selGid = st.groupId;
    var selAid = st.acctId;
    var accent = (PICKER_TYPE_COLORS[st.type]||{}).color || 'var(--expense)';

    c = '<div style="overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:60px">';

    // 3열씩 묶어서 행 렌더
    for (var ri = 0; ri < typeAccts2.length; ri += 3) {
      var rowGrps = typeAccts2.slice(ri, ri + 3);
      var rowHasExpanded = rowGrps.some(function(g){ return g.id === selGid; });

      // 부모 카테고리 행
      c += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:0.5px solid var(--surface)">';
      for (var ci2 = 0; ci2 < 3; ci2++) {
        var g2 = rowGrps[ci2];
        if (!g2) {
          c += '<div style="border-right:0.5px solid var(--surface)"></div>';
          continue;
        }
        var isSelGrp = g2.id === selGid;
        var borderR = ci2 < 2 ? 'border-right:0.5px solid var(--surface);' : '';
        c += '<div onclick="window._mobPickerSelGroup(\''+g2.id+'\')" '
          +'style="'+borderR+'padding:13px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;'
          +(isSelGrp ? 'background:#FFF5F5;' : 'background:var(--card);') + '">'
          +'<span style="font-size:13px;font-weight:'+(isSelGrp?'700':'500')+';color:'+(isSelGrp?accent:'#222')+';text-align:center;line-height:1.3">'
          +escapeHTML(g2.name)+'</span>'
          +'<span style="font-size:11px;color:'+(isSelGrp?accent:'#ccc')+'">'+(isSelGrp?'∧':'∨')+'</span>'
          +'</div>';
      }
      c += '</div>';

      // 확장된 행의 자식 항목 표시
      if (rowHasExpanded && selGid) {
        var expGrp2 = accts.find(function(a){ return a.id===selGid; });
        var expCh2  = accts.filter(function(a){ return a.parentId===selGid; });
        c += '<div style="background:#FAFAFA;border-bottom:1px solid #DCDCDC">';
        // 전체 선택 행
        c += '<div onclick="window._mobPickerSelAcct(\''+selGid+'\')" '
          +'style="padding:9px 16px;border-bottom:0.5px solid var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center">'
          +'<span style="font-size:12px;font-weight:700;color:'+accent+'">✓ '+(expGrp2?escapeHTML(expGrp2.name):'')+' 전체 선택</span>'
          +'<span style="font-size:10px;color:#bbb;margin-left:6px">세부 항목 없이 입력</span>'
          +'</div>';
        if (expCh2.length > 0) {
          c += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr">';
          expCh2.forEach(function(ch2, idx2) {
            var isSel2 = selAid === ch2.id;
            var br = (idx2%3)<2 ? 'border-right:0.5px solid var(--surface);' : '';
            c += '<div onclick="window._mobPickerSelAcct(\''+ch2.id+'\')" '
              +'style="'+br+'border-bottom:0.5px solid var(--surface);padding:13px 6px;'
              +'display:flex;align-items:center;justify-content:center;cursor:pointer;'
              +(isSel2?'background:'+accent+';':'background:var(--card);')
              +'">'
              +'<span style="font-size:13px;font-weight:'+(isSel2?'700':'400')+';color:'+(isSel2?'#fff':'#333')+';text-align:center">'
              +escapeHTML(ch2.name)+'</span>'
              +'</div>';
          });
          // 빈 셀 채우기
          var rem2 = expCh2.length % 3;
          if (rem2 !== 0) { for (var ei=rem2; ei<3; ei++) c += '<div style="border-bottom:0.5px solid var(--surface);background:#fff"></div>'; }
          c += '</div>';
        }
        c += '</div>';
      }
    }
    c += '</div>';
  }
  contentEl.innerHTML = c;
}

window._mobPickerSelType = function(type) {
  pickerState[_mps.ns][_mps.side] = {type:type, groupId:null, acctId:null, step:'group'};
  _mobPickerRender();
};
window._mobPickerGoType = function() {
  pickerState[_mps.ns][_mps.side] = {type:null, groupId:null, acctId:null, step:'type'};
  _mobPickerRender();
};
window._mobPickerSelGroup = function(gid) {
  var ch = accts.filter(function(a){ return a.parentId===gid; });
  var ns = _mps.ns, side = _mps.side;
  // 이미 선택된 그룹을 다시 누르면 접기 (토글)
  if (pickerState[ns][side].groupId === gid && pickerState[ns][side].step !== 'type') {
    pickerState[ns][side].groupId = null;
    _mobPickerRender();
    return;
  }
  pickerState[_mps.ns][_mps.side].groupId = gid;
  if (ch.length===0) { window._mobPickerSelAcct(gid); return; }
  pickerState[_mps.ns][_mps.side].step = 'group'; // 아코디언 뷰 유지
  _mobPickerRender();
};
window._mobPickerGoGroup = function() {
  pickerState[_mps.ns][_mps.side].step = 'group';
  pickerState[_mps.ns][_mps.side].groupId = null;
  _mobPickerRender();
};
window._mobPickerSelAcct = function(acctId) {
  var ns = _mps.ns, side = _mps.side;
  pickerState[ns][side].acctId = acctId;
  var hid = document.getElementById(ns+'-val-'+side);
  if (hid) hid.value = acctId;
  /* 거래 내역 계정과목 필터 연동 */
  if (ns === 'hf' && side === 'filter') {
    var hc = document.getElementById('histCat');
    if (hc) { hc.value = acctId; }
    _mobUpdatePickerTrigger(ns, side);
    window.closeMobPicker();
    filterHistory();
    return;
  }
  _mobUpdatePickerTrigger(ns, side);
  pickerUpdateSubmit(ns);
  window.closeMobPicker();
};
function _mobUpdatePickerTrigger(ns, side) {
  var el = document.getElementById('mob-ptrigger-'+ns+'-'+side);
  if (!el) return;
  var st = pickerState[ns][side];
  if (st.acctId) {
    var a4 = accts.find(function(a){ return a.id===st.acctId; });
    var p4 = a4&&a4.parentId ? accts.find(function(a){ return a.id===a4.parentId; }) : null;
    var lbl = (p4?escapeHTML(p4.name)+' › ':'')+(a4?escapeHTML(a4.name):'');
    var col = st.type&&PICKER_TYPE_COLORS[st.type] ? PICKER_TYPE_COLORS[st.type].color : '#111';
    el.innerHTML = '<span style="color:'+col+';font-weight:600;font-size:13px">'+lbl+'</span>'
      +' <button onclick="window._mobResetPicker(\''+ns+'\',\''+side+'\')" '
      +'style="margin-left:6px;font-size:10px;color:#aaa;background:#FFFFFF;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-family:inherit">수정</button>';
  } else {
    var emptyLabel = (el.id === 'mob-ptrigger-hf-filter') ? '전체' : '선택하세요';
    el.innerHTML = '<span style="color:#bbb;font-size:13px">'+emptyLabel+'</span>'
      +'<svg style="flex-shrink:0" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg>';
  }
}
window._mobResetPicker = function(ns, side) {
  pickerState[ns][side] = {type:null, groupId:null, acctId:null, step:'type'};
  if (ns === 'hf' && side === 'filter') {
    var hc = document.getElementById('histCat');
    if (hc) hc.value = '';
    _mobUpdatePickerTrigger(ns, side);
    filterHistory();
    return;
  }
  _mobUpdatePickerTrigger(ns, side);
  pickerUpdateSubmit(ns);
};</script>
<!-- ══ 달력 일별 거래 팝업 ══ -->
<div id="cal-day-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:950;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)closeCalDay()">
  <div style="background:var(--card);border:none;border-radius:20px;width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.8);animation:calDaySlide .22s cubic-bezier(.34,1.56,.64,1)">
    <!-- 헤더 -->
    <div style="padding:16px 20px 14px;border-bottom:none;flex-shrink:0">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div style="min-width:0;flex:1;overflow:hidden">
          <div id="calDayTitle" style="font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
          <div id="calDaySummary" style="font-size:11px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px"></div>
        </div>
        <button onclick="closeCalDay()" style="background:#FFFFFF;border:1px solid rgba(0,0,0,.06);border-radius:8px;width:28px;height:28px;color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s">✕</button>
      </div>
    </div>
    <!-- 거래 목록 -->
    <div id="calDayList" style="overflow-y:auto;padding:10px 14px 20px;flex:1;scrollbar-width:thin;-webkit-overflow-scrolling:touch"></div>
  </div>
</div>
<style>
@keyframes calDaySlide {
  from { opacity:0; transform:scale(.95) translateY(8px); }
  to   { opacity:1; transform:scale(1)   translateY(0); }
}
/* 달력 셀 hover */
#dashPattern .cal-cell {
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
#dashPattern .cal-cell:hover {
  background: rgba(255,255,255,.03) !important;
  border-color: rgba(255,255,255,.16) !important;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 0 6px rgba(255,255,255,.03);
}
#dashPattern .cal-cell.cal-today:hover {
  background: rgba(255,255,255,.12) !important;
  border-color: rgba(255,255,255,.16) !important;
  box-shadow: 0 0 8px rgba(255,255,255,.06);
}
/* ── 달력 셀 컨테이너 쿼리 자동 폰트 스케일 ── */
.cal-cell {
  container-type: inline-size;
}
.cal-monthlabel {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 1;
  flex-shrink: 0;
}
.cal-daynum {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 14px;
  flex-shrink: 0;
}
.cal-amt {
  font-size: clamp(5px, var(--cal-amt-size, 9px), 9px);
  font-weight: 600;
  line-height: 11px;
  white-space: nowrap;
  width: calc(100% + 8px);
  overflow: visible;
  text-overflow: clip;
  text-align: center;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.35px;
}
.cal-amt.cal-income {
  color: #57D98A !important;
}
.cal-amt.cal-expense {
  color: #FF5A68 !important;
}
.cal-dot {
  display: block;
  width: clamp(3px, 3cqi, 5px);
  height: clamp(3px, 3cqi, 5px);
  border-radius: 50%;
  background: var(--accent);
  opacity: .8;
  flex-shrink: 0;
  margin-top: auto;
}
/* 비용·수익 소분류 행 hover */
.sub-table tr[onclick]:hover td {
  background: #F5F5F5 !important;
}
.sub-table tr[onclick]:hover .sub-name {
  color: #111 !important;
}
/* 팝업 스크롤바 */
#calDayList::-webkit-scrollbar { width:4px; }
#calDayList::-webkit-scrollbar-track { background:transparent; }
#calDayList::-webkit-scrollbar-thumb { background:rgba(0,0,0,.08);border-radius:99px; }
#calDayList::-webkit-scrollbar-thumb:hover { background:rgba(0,0,0,.15); }
</style>

</body>
</html>
