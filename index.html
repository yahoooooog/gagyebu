<!-- 모바일 확대/축소 방지 -->
<script>
document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', function(e) {
  e.preventDefault();
}, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);
</script>

<!-- PWA manifest (inline blob) -->
<script>
(function(){
  const manifest = {
    name: "가계부 · 복식부기",
    short_name: "가계부",
    description: "복식부기 개인재무 관리",
    start_url: "./",
    display: "standalone",
    background_color: "#EEF0F5",
    theme_color: "#EEF0F5",
    orientation: "portrait-primary",
    lang: "ko",
    icons: [
      { src: _makeIcon(192), sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: _makeIcon(512), sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };
  function _makeIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    // 배경 — 딥 블랙
    ctx.fillStyle = '#1DB954';
    ctx.fillRect(0,0,size,size);
    // 바 차트 아이콘 (흰색)
    const lw = size*0.055;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    // 왼쪽 바
    ctx.beginPath(); ctx.moveTo(size*.32, size*.38); ctx.lineTo(size*.32, size*.65); ctx.stroke();
    // 가운데 바
    ctx.beginPath(); ctx.moveTo(size*.50, size*.30); ctx.lineTo(size*.50, size*.65); ctx.stroke();
    // 오른쪽 바
    ctx.beginPath(); ctx.moveTo(size*.68, size*.42); ctx.lineTo(size*.68, size*.65); ctx.stroke();
    // 가로 기준선
    ctx.beginPath(); ctx.moveTo(size*.26, size*.65); ctx.lineTo(size*.74, size*.65); ctx.stroke();
    return c.toDataURL('image/png');
  }
  // manifest 등록
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel='manifest'; link.href=url;
  document.head.appendChild(link);
  // apple touch icon
  const ico = document.createElement('link');
  ico.rel='apple-touch-icon'; ico.href=_makeIcon(180);
  document.head.appendChild(ico);
  // favicon
  const fav = document.createElement('link');
  fav.rel='icon'; fav.href=_makeIcon(64); fav.type='image/png';
  document.head.appendChild(fav);
})();
</script>

<!-- Service Worker 등록 -->
<script>
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'gagebu-v1';
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html'])).catch(()=>{}));
});
self.addEventListener('activate', e => {
  e.waitUntil(clients.claim());
});
self.addEventListener('fetch', e => {
  e.respondWith(
    caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./')))
  );
});
  `.trim();
  const blob = new Blob([swCode], {type:'text/javascript'});
  const url  = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url, {scope: './'})
    .catch(()=>{});
}
</script>

<style>
:root{
  /* ══ Cardy Pay Design System ══ */

  /* Surface Hierarchy (No-Line Rule — 색상 층위로만 구분) */
  --bg:#f9f9f9;           /* base canvas */
  --surface:#f3f3f3;      /* surface-container */
  --surface-low:#eeeeee;  /* surface-container-low */
  --surface-high:#ffffff; /* floating / 카드 */
  --icon-bg:#eeeeee;      /* 아이콘 컨테이너 */
  --bar-inactive:#e0e0e0; /* 차트 비활성 */
  --dark-card:#2f3131;    /* inverse-surface — 다크 강조 카드 */
  --dark-card-2:#3a3c3c;  /* 다크 카드 이너 서피스 */

  --sidebar:#ffffff;--sidebar-hover:rgba(0,0,0,.04);--sidebar-active:#2f3131;
  --card:#ffffff;--card-border:transparent;--card-border-h:rgba(0,0,0,.06);

  /* 텍스트 (잉크 계열 — #000 사용 금지) */
  --text:#2f3131;          /* on-surface: 메인 텍스트 */
  --text2:#5f5e5e;         /* secondary: 보조 텍스트 */
  --text3:#9e9d9d;         /* tertiary: 비활성·타임스탬프 */

  /* Primary Red — 외과적 사용만 */
  --accent:#bc0013;--accent2:#eb001b;

  /* 의미 색상 */
  --up:#2E9E5B;--dn:#bc0013;
  --green:#2E9E5B;--red:#bc0013;--gold:#5f5e5e;
  --income:#2E9E5B;--expense:#bc0013;
  --asset:#2f3131;--liability:#bc0013;--capital:#5f5e5e;--purple:#5f5e5e;

  /* Radius: xl(1.5rem) 메인카드 / lg(1rem) 이너 */
  --r:1.5rem;--rs:1rem;

  /* Ambient Shadow only — Y:8 Blur:24 6% */
  --shadow:0 8px 24px rgba(47,49,49,.06);
  --shadow-md:0 8px 24px rgba(47,49,49,.09),0 2px 6px rgba(47,49,49,.04);
  --shadow-lg:0 16px 40px rgba(47,49,49,.11),0 4px 12px rgba(47,49,49,.05);
  --shadow-picker:0 12px 36px rgba(47,49,49,.12),0 3px 8px rgba(47,49,49,.05);

  --fs-xs:clamp(11px,.6rem + .3vw,13px);
  --fs-sm:clamp(12px,.75rem + .4vw,15px);
  --fs-md:clamp(13px,.85rem + .5vw,16px);
  --fs-lg:clamp(15px,1rem + .6vw,20px);
  --fs-xl:clamp(18px,1.2rem + 1vw,28px);
  --fs-2xl:clamp(22px,1.5rem + 1.5vw,38px);
  --fs-num:clamp(18px,2.8vw,36px);

  /* Manrope 우선, Pretendard 한글 폴백 */
  --font:'Manrope','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-size:14px;background:#f9f9f9;color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:var(--font);font-size:13px;touch-action:manipulation}
a,button,label,[onclick],[tabindex]{touch-action:manipulation}
input,select,textarea{font-family:var(--font);font-size:14px}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#sidebar{display:none !important}
#main{flex:1;overflow-y:auto;background:#f9f9f9;padding-top:calc(62px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}

/* ── 전역 상단 고정바 ── */
#global-top-bar{
  position:fixed;top:0;left:0;right:0;
  background:rgba(249,249,249,.85);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:none;
  z-index:500;
  padding:max(env(safe-area-inset-top,0px),10px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
  min-height:calc(62px + max(env(safe-area-inset-top,0px) - 10px, 0px));box-sizing:border-box;
}
.gtb-left{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;align-items:flex-start;padding-left:4px}
.gtb-label{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.gtb-period-row{display:flex;align-items:center;gap:8px}
.gtb-period-val{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px;white-space:nowrap}
.gtb-right{display:flex;align-items:center;gap:8px}
.gtb-btn{
  width:34px;height:34px;border-radius:17px;
  background:rgba(0,0,0,.06);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .12s;flex-shrink:0;
}
.gtb-btn:hover{background:rgba(0,0,0,.1)}
.gtb-btn:active{transform:scale(.9)}

/* ── 전역 하단 탭바 ── */
#global-tab-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(249,249,249,.92);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:none;box-shadow:0 -1px 0 rgba(47,49,49,.06);
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:500;
  height:calc(64px + env(safe-area-inset-bottom,0px));
  overflow:hidden;
}
/* 탭바 내부 - 두 상태 겹치기 */
.gtb-inner{
  position:absolute;top:0;left:0;right:0;height:64px;
  display:flex;align-items:center;
  transition:opacity .22s cubic-bezier(.4,0,.2,1),transform .22s cubic-bezier(.4,0,.2,1);
}
#gtb-normal{opacity:1;transform:translateY(0);pointer-events:auto}
#gtb-analysis-bar{opacity:0;transform:translateY(100%);pointer-events:none}
#global-tab-bar.analysis-open #gtb-normal{opacity:0;transform:translateY(100%);pointer-events:none}
#global-tab-bar.analysis-open #gtb-analysis-bar{opacity:1;transform:translateY(0);pointer-events:auto}
/* 탭 공통 스타일 */
.gtb-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:64px;cursor:pointer;
  border:none;background:none;font-family:inherit;
  transition:opacity .15s;
  -webkit-tap-highlight-color:transparent;
}
.gtb-tab svg{width:22px;height:22px;stroke:#9e9d9d;fill:none;transition:stroke .2s,transform .2s;flex-shrink:0}
.gtb-tab span{font-size:10px;color:#9e9d9d;transition:color .2s;white-space:nowrap;font-weight:600}
.gtb-tab.active svg{stroke:#2f3131;transform:scale(1.0)}
.gtb-tab.active span{color:#2f3131;font-weight:700}
.gtb-tab:active{opacity:.5}
/* 탭 활성 표시 dot (이미지 방식) */
.gtb-tab.active::after{
  content:'';display:block;width:20px;height:4px;border-radius:99px;
  background:#2f3131;margin-top:3px;
}
.gtb-tab::after{
  content:'';display:block;width:20px;height:4px;border-radius:99px;
  background:transparent;margin-top:3px;
}

/* 분석 모드 탭 — 텍스트만 */
.gtb-analysis-tab{
  flex:1;display:flex;align-items:center;justify-content:center;
  height:64px;cursor:pointer;
  border:none;background:none;font-family:inherit;
  font-size:13px;font-weight:500;color:#5f5e5e;
  transition:all .18s;
  -webkit-tap-highlight-color:transparent;
}
.gtb-analysis-tab.active{color:#2f3131;font-weight:700}
.gtb-analysis-tab:active{opacity:.5}
/* 뒤로 탭 */
.gtb-back-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:64px;width:60px;flex-shrink:0;cursor:pointer;
  border:none;background:none;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s;
}
.gtb-back-tab svg{width:20px;height:20px;stroke:#555555;fill:none}
.gtb-back-tab span{font-size:10px;color:var(--text2);font-weight:500}
.gtb-back-tab:active{opacity:.5}

/* ── Content ── */
.page{display:none}
.page.active{
  display:flex !important;flex-direction:column;
  height:calc(100vh - 62px - env(safe-area-inset-top,0px) - 64px - env(safe-area-inset-bottom,0px));
  overflow:hidden;
  padding:14px 18px 0;
  animation:pageFadeIn .22s cubic-bezier(.4,0,.2,1);
}
/* 대시보드 — 패딩 없이 전체 영역, 세로 스크롤 허용 */
#page-dashboard.active{
  padding:16px 20px 80px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  background:#f9f9f9;
}
@media (max-width:600px){
  #page-dashboard.active{padding:12px 14px 80px}
}
/* 거래내역 — 내부 스크롤 허용 */
#page-history.active{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* ── 수익/비용 테이블 ── */
.rev-tr, .exp-tr { transition:background .1s; }
.rev-tr:hover, .exp-tr:hover { background:rgba(0,0,0,.018); }


.metric-card::before{display:none}

/* ── Image 2: 거래 내역 row 스타일 개선 ── */
.tx-row-dark{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:none;
}
.tx-row-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:16px;background:var(--icon-bg);
}
.tx-row-info{flex:1;min-width:0}
.tx-row-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-row-sub{font-size:11px;color:var(--text2);margin-top:1px}
.tx-row-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}

/* ── Image 1: 기간 선택 pill 탭 ── */
.period-pills{
  display:flex;gap:6px;padding:3px;
  background:#FFFFFF;border-radius:12px;
  border:none;
  width:fit-content;
}
.period-pill{
  padding:5px 16px;border-radius:9px;font-size:12px;font-weight:500;
  color:#6E6E73;background:none;border:none;cursor:pointer;
  font-family:inherit;transition:all .18s;
}
.period-pill.active{
  background:#111111;color:#fff;font-weight:700;
}

/* ── 오렌지 하이라이트 badge ── */
.badge-accent{
  display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:99px;font-size:10px;font-weight:700;
  background:rgba(0,0,0,.07);color:var(--text);
}

/* ── 카드 hover 효과 강화 ── */
.card:hover{box-shadow:0 8px 32px rgba(0,0,0,.1),0 1px 4px rgba(255,255,255,.9) inset;transition:box-shadow .2s}

/* ── 입력 폼 focus glow 오렌지 ── */
@keyframes successGlow{
  0%  {box-shadow:var(--shadow)}
  15% {box-shadow:0 0 0 4px rgba(39,174,96,.2),var(--shadow)}
  55% {box-shadow:0 0 0 4px rgba(39,174,96,.06),var(--shadow)}
  100%{box-shadow:var(--shadow)}
}

/* ── Image 3: 수익/지출 섹션 상단 accent 줄 ── */


.page-title{font-size:13px;font-weight:500;margin-bottom:4px;letter-spacing:-.4px;color:var(--text)}
.page-desc{font-size:13px;color:var(--text);margin-bottom:32px;font-weight:500}

/* ── Cards ── */
.card{background:#ffffff;border:none;border-radius:var(--r);box-shadow:var(--shadow)}
.card-body{padding:20px 24px}
.section-title{font-size:11px;font-weight:600;margin-bottom:14px;color:var(--text2);letter-spacing:.4px}

/* ── Grid ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
.ca-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* ── 대시보드 섹션 헤더 ── */
.dash-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dash-hd-ttl{font-size:13px;font-weight:500;color:var(--text);letter-spacing:-.2px}
.dash-hd-val{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:-.2px}
/* ── 대시보드 통계 행 ── */
.dash-slbl{font-size:13px;font-weight:500;color:var(--text)}
.dash-sval{font-size:13px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
/* ── 고정비·변동비 행 ── */
.dash-fv-grp{font-size:13px;font-weight:500;color:var(--text);flex-shrink:0;max-width:55px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-fv-nm{font-size:13px;font-weight:500;color:var(--text);flex:1;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-fv-amt{font-size:13px;font-weight:500;color:var(--text);flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── 대시보드: style.css 스타일을 대시보드에만 적용 ── */

  --bg:#0F0F10;

  flex-shrink:0;

#dashMetrics{

#page-dashboard,

  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif !important;

#dashMetrics .metrics-networth{
  font-weight:300 !important;
}
#dashMetrics .metrics-main-lbl,
#dashMetrics .metrics-box-lbl,

  color:#0F0F10 !important;
}
#dashMetrics .metrics-hero{
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:20px;
  min-height:208px;
  box-sizing:border-box;
  justify-content:space-between;
}
#dashMetrics .metrics-main{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
#dashMetrics .metrics-main-lbl{
  font-size:11px;
  font-weight:600;
  letter-spacing:.5px;
}
#dashMetrics .metrics-networth{
  color:#0F0F10 !important;

  align-items:center;

}
#dashMetrics .metrics-bottom-row{

}
#dashMetrics .metrics-bottom-box{

  border-radius:10px;

}
#dashMetrics .metrics-box-lbl{

}
#dashMetrics .metrics-box-val{

  font-weight:400;

#dashMetrics .metrics-trend-pill{

.budget-kpi-card{

}
@property --budget-pct {

}
.budget-kpi-card,
.budget-kpi-card *{

}
#page-dashboard .budget-kpi-card,
#page-dashboard .budget-kpi-card *{

}
.budget-kpi-donut{

.budget-kpi-donut:before{

}
.budget-kpi-donut span{

.budget-kpi-body{

.budget-kpi-title{

.budget-kpi-total{

  grid-row:1;
  align-self:start;
  white-space:nowrap;
  text-align:right;
  font-size:12px;
  line-height:15px;
  font-weight:700 !important;

}
.budget-kpi-bar{

.budget-kpi-budget{

#page-dashboard .budget-kpi-card.budget-kpi-warn{

#page-dashboard .budget-kpi-card.budget-kpi-normal{

#page-dashboard .budget-kpi-card.budget-kpi-over .budget-kpi-donut,

#page-dashboard .budget-kpi-card.budget-kpi-warn .budget-kpi-donut,

}
#page-dashboard .budget-kpi-card.budget-kpi-normal .budget-kpi-donut,
#page-dashboard .budget-kpi-card.budget-kpi-normal .budget-kpi-donut span{

#page-dashboard .budget-kpi-card .budget-kpi-budget,
#page-dashboard .budget-kpi-card .budget-kpi-diff{

#dashBudget .dash-hd-ttl{

}
.budget-table{

  flex-direction:column;
  margin-top:12px;
}
.budget-table-row{

  grid-template-columns:35% 20% 20% 15% 10%;

.budget-table-head{

}
.budget-table-cell{

  text-overflow:ellipsis;

  font-size:12px;
  line-height:15px;

}
.budget-table-head .budget-table-cell{
  font-size:12px;
  color:var(--text2) !important;
}
.budget-table-num,
.budget-table-rate{

}
.budget-table-head .budget-table-cell{

}
.budget-table-status{

  height:20px;

  border-radius:99px;

}
.budget-table-bar{

  width:100%;
  min-width:34px;

  overflow:hidden;
}
.budget-table-bar-fill{

  border-radius:99px;

}
#page-dashboard .budget-status-over{

}
#page-dashboard .budget-status-warn{
  color:#D6A84F !important;

}
#page-dashboard .budget-status-normal{

.budget-item-list{

  flex-direction:column;
  gap:0;
  margin-top:8px;
  border-bottom:none;
}
.budget-item-card{

}
.budget-item-card:last-child{

}
.budget-item-card:first-child:last-child{

}
.budget-item-arrow{
  color:var(--text2) !important;

}
.budget-item-name{
  font-size:12px;
  line-height:15px;
  font-weight:600 !important;
  color:var(--text) !important;
  white-space:nowrap;

}
.budget-item-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:19px;
  min-width:38px;
  box-sizing:border-box;
  border:1px solid transparent;
  border-radius:99px;
  padding:0 7px;
  font-size:11px;
  line-height:17px;
  font-weight:600 !important;
  flex-shrink:0;
}
.budget-item-bar{
  height:4px;
  width:64px;
  min-width:0;
  background:var(--icon-bg);
  border-radius:99px;
  overflow:hidden;
}
.budget-item-fill{
  width:0%;

}
.budget-item-pct{

  font-size:12px;

}
.budget-item-detail{
  display:none;
  grid-column:1 / -1;

.budget-item-card.budget-open .budget-item-detail{

.budget-item-card.budget-open .budget-item-arrow{

.budget-item-detail span{

  white-space:nowrap;
  font-size:12px;

.budget-item-detail span:first-child{text-align:left}
.budget-item-detail span:last-child{text-align:right}
.budget-item-detail i,
.budget-item-detail em{

.budget-item-detail .budget-meta-spent{color:#FF5A68 !important}
.budget-item-detail .budget-meta-budget{color:#D6A84F !important}
.budget-item-detail .budget-meta-remain{color:#57D98A !important}
#page-dashboard .budget-tone-over{color:#FF5A68 !important;border-color:#FF5A68;background:rgba(255,90,104,.08)}
#page-dashboard .budget-tone-warn{color:#D6A84F !important;border-color:#D6A84F;background:rgba(214,168,79,.09)}
#page-dashboard .budget-tone-normal{color:#57D98A !important;border-color:#57D98A;background:rgba(87,217,138,.08)}
 #page-dashboard .budget-item-pct.budget-tone-over,
 #page-dashboard .budget-item-pct.budget-tone-warn,
 #page-dashboard .budget-item-pct.budget-tone-normal{

}
@media(max-width:600px){
  #dashMetrics .metrics-hero{padding:18px 16px}
  #dashMetrics .metrics-networth{font-size:30px}
  .budget-kpi-card{gap:18px;padding:12px}
  .budget-kpi-donut{width:66px;height:66px}
  .budget-table-row{grid-template-columns:35% 20% 20% 15% 10%;gap:0;padding:7px 0}
  .budget-table-status{min-width:34px;padding:0 5px;height:18px;line-height:16px}
}
#page-dashboard .dash-tile{
  background:rgba(255,255,255,.03) !important;
  border:1px solid rgba(255,255,255,.04);
  border-radius:var(--rs) !important;
}
#page-dashboard button[onclick*="_revMore"],
#page-dashboard button[onclick*="_expMore"],
#page-dashboard button[onclick*="_fvMore"]{
  background:rgba(255,255,255,.03) !important;
  border:1px solid rgba(255,255,255,.04) !important;
  color:#FFFFFF !important;
  border-radius:10px !important;
  box-shadow:none !important;
}
#page-dashboard button[onclick*="_revMore"]:active,
#page-dashboard button[onclick*="_expMore"]:active,
#page-dashboard button[onclick*="_fvMore"]:active{
  background:rgba(255,255,255,.08) !important;
}
#page-dashboard .cc-list{
  background:transparent;
  border:none;
}
#page-dashboard .cal-cell{
  background:transparent !important;
  border:1px solid rgba(255,255,255,.03) !important;
}
#dashPattern .dash-sval{
  font-size:9px !important;
  line-height:11px !important;
}
#dashPattern{
  padding-left:0;
  padding-right:0;
}

/* ── Metric cards ── */
.metric-card{background:#ffffff;border:none;border-radius:var(--r);padding:clamp(14px,2vw,24px) clamp(16px,2.5vw,28px);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.metric-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.metric-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px;letter-spacing:.2px}
.metric-value{font-size:var(--fs-num);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1;overflow:hidden;min-width:0;word-break:break-all}
.metric-sub{font-size:13px;font-weight:500;color:var(--text);margin-top:6px}
.metric-up{color:var(--income)}
.metric-dn{color:var(--expense)}
.metric-nu{color:var(--text)}

/* ── KPI 통합 표 ── */
.kpi-wrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.kpi-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.kpi-tbl thead th{font-size:13px;font-weight:500;color:var(--text);letter-spacing:.4px;text-transform:uppercase;padding:11px 14px;background:rgba(0,0,0,.025);border-bottom:1px solid rgba(0,0,0,.07);text-align:center;width:35%}
.kpi-tbl thead th:first-child{width:15%}
.kpi-tbl thead th.kpi-col-rate{width:15%}
.kpi-tbl thead th.kpi-col-prev{width:35%}
.kpi-tbl tbody tr{transition:background .1s}
.kpi-tbl tbody tr:hover{background:rgba(0,0,0,.015)}
.kpi-tbl tbody tr:last-child td{border-bottom:none}
.kpi-tbl td{padding:13px 14px;border-bottom:0.5px solid rgba(0,0,0,.05);font-size:13px;vertical-align:middle;text-align:right}
.kpi-tbl td.kpi-cat{text-align:left;font-size:13px;font-weight:500;color:var(--text)}
.kpi-tbl td.kpi-amt{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.3px;font-size:13px;color:var(--text)}
.kpi-tbl td.kpi-rate{font-size:13px;font-weight:500;color:var(--text)}
.kpi-tbl td.kpi-prev{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;font-weight:500}
.kpi-muted{color:var(--text);font-weight:500}
@media(max-width:600px){
  .kpi-tbl thead th,.kpi-tbl td{padding:11px 10px}
  .kpi-tbl thead th:first-child{width:46px}
  .kpi-tbl thead th.kpi-col-rate{width:58px}
  .kpi-tbl thead th.kpi-col-prev{width:82px}
}
/* Forms */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:9px;font-weight:700;color:var(--text2);margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase}
.form-label span{font-weight:400;color:var(--text2);text-transform:none;letter-spacing:0;font-size:var(--fs-xs)}
.form-input{width:100%;padding:11px 16px;border:none;border-radius:var(--rs);background:var(--surface);color:var(--text);outline:none;font-size:14px;font-family:var(--font);line-height:1.4;-webkit-appearance:none;appearance:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
input[type="number"].form-input{font-size:14px;padding:10px 14px;height:42px}
.input-amount{font-size:16px !important;font-weight:700 !important;font-variant-numeric:tabular-nums;letter-spacing:-.3px;height:42px !important;padding:10px 14px !important;}
.form-input:focus{border:none;box-shadow:0 0 0 3px rgba(188,0,19,.15);background:var(--surface-high)}
.form-input:hover:not(:focus){background:var(--surface-low)}
select.form-input{cursor:pointer;background-image:none}
select.form-input option{background:#FFFFFF;color:#2f3131}
textarea.form-input{resize:vertical;min-height:60px;height:auto}
.form-row{display:grid;gap:12px}
.form-row.c2{grid-template-columns:1fr 1fr}
.form-row.c3{grid-template-columns:1fr 1fr 1fr}

/* ── Buttons ── */
.btn{padding:10px 20px;border-radius:980px;border:none;font-weight:500;font-size:var(--fs-sm);transition:all .15s ease;display:inline-flex;align-items:center;gap:6px;letter-spacing:-.1px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#bc0013,#eb001b);color:#fff;box-shadow:0 4px 14px rgba(188,0,19,.3)}
.btn-primary:hover{background:linear-gradient(135deg,#a30011,#d00018);box-shadow:0 6px 18px rgba(188,0,19,.35)}
.btn-primary:active{background:#222222;transform:scale(.98)}
.btn-secondary{background:var(--surface);border:none;color:#2f3131}
.btn-secondary:hover{background:rgba(255,255,255,.82)}
.btn-danger{background:rgba(224,48,42,.08);color:var(--expense)}
.btn-danger:hover{background:#FFD6D6}
.btn-sm{padding:7px 16px;font-size:12px;border-radius:980px}
.btn-xs{padding:4px 12px;font-size:11px;border-radius:980px}
.btn-full{width:100%;justify-content:center}

/* ── Tags / Badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:980px;font-size:11px;font-weight:500}

/* ── CC alert ── */
.cc-list{background:#FFFFFF;border-radius:12px;overflow:hidden}
.cc-card{padding:13px 2px;display:grid;grid-template-columns:minmax(0,1fr) minmax(72px,max-content);align-items:center;gap:12px;border-bottom:0.5px solid var(--card-border);min-width:0;overflow:hidden}
.cc-card:last-child{border-bottom:none}
.cc-card:hover{background:rgba(0,0,0,.018)}
.cc-icon{width:34px;height:34px;border-radius:10px;background:var(--icon-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cc-info{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.cc-name{font-weight:600 !important;font-size:15px;line-height:18px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-range{font-size:13px;font-weight:500;line-height:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-amount{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-align:right;justify-self:end}

/* ── 성공 글로우 (Apple 블루) ── */
@keyframes successGlow{
  0%  {box-shadow:var(--shadow)}
  15% {box-shadow:0 0 0 4px rgba(0,0,0,.15),var(--shadow)}
  55% {box-shadow:0 0 0 4px rgba(0,0,0,.06),var(--shadow)}
  100%{box-shadow:var(--shadow)}
}
.success-flash{animation:successGlow 1.4s ease forwards !important}

/* ── Scroll ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.2)}



/* Settings accordion */
.settings-section{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);transition:box-shadow .2s}
.settings-section:hover{box-shadow:var(--shadow-md)}
.settings-head{padding:17px 22px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
.settings-head:hover{background:#FFFFFF}
.settings-head h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.settings-body{padding:22px;display:none}
.settings-body.open{display:block}


/* Chart bars */
.cat-bar-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:none}
.cat-bar-row:last-child{border-bottom:none}
.cat-bar-name{min-width:80px;font-size:13px;color:var(--text2);font-weight:500}
.cat-bar-track{flex:1;height:6px;background:var(--surface);border-radius:99px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.cat-bar-val{min-width:80px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* Sub-item table */
.sub-table{width:100%;border-collapse:collapse;font-size:13px}
.sub-table th{
  text-align:left;padding:8px 12px;
  background:#FFFFFF;

/* ═══════════════════════════════════════
   SETTINGS — 3-tier hierarchy panel
═══════════════════════════════════════ */
.st-settings-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  align-items:start;
}
@media(max-width:700px){
  .st-settings-grid{grid-template-columns:1fr;}
}
.st-panel{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px;
}
.st-panel-title{
  font-size:11px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;gap:6px;
  margin-bottom:16px;
}

/* Type header */
.st-type-header{
  display:flex;align-items:center;gap:8px;
  margin-bottom:8px;
}
.st-type-badge{
  font-size:10px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;padding:3px 10px;
  border-radius:99px;
}
.st-type-count{font-size:11px;color:var(--text2);font-weight:500}
.st-add-group-btn{
  margin-left:auto;
  display:flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:99px;
  border:1.5px solid var(--tc,var(--accent));
  background:var(--tb,rgba(201,169,110,.07));
  color:var(--tc,var(--accent));
  font-size:11px;font-weight:700;cursor:pointer;
  transition:all .2s;
}
.st-add-group-btn:hover{
  background:var(--tc,var(--accent));color:#FFF;
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* Group row */
.st-group{
  border-radius:10px;
  overflow:hidden;
  margin-bottom:2px;
  transition:background .15s;
}
.st-group-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px 8px 12px;
  border-radius:10px;
  background:#FFFFFF;
  transition:background .15s;
}
.st-group-row:hover{background:#FFFFFF}
.st-group-dot{
  width:8px;height:8px;border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;
}
.st-group-name{
  flex:1;font-size:13px;font-weight:700;color:var(--text);
  min-width:0;word-break:keep-all;
}
.st-group-budget{
  font-size:11px;font-weight:600;
}

/* Account row */
.st-account-row{
  display:flex;align-items:center;gap:7px;
  padding:6px 10px 6px 12px;
  border-radius:8px;
  transition:background .12s;
}
.st-account-row:hover{background:#FFFFFF}
.st-account-indent{
  width:16px;flex-shrink:0;
  border-left:2px solid rgba(0,0,0,.08);
  border-bottom:2px solid rgba(0,0,0,.08);
  height:12px;border-bottom-left-radius:4px;
  margin-top:-6px;align-self:flex-start;
}
.st-account-dot{
  width:5px;height:5px;border-radius:50%;flex-shrink:0;
}
.st-account-name{
  flex:1;font-size:12.5px;font-weight:500;color:var(--text2);
}
.st-account-budget{
  font-size:11px;color:var(--text2);font-weight:500;white-space:nowrap;
}

/* Edit / Delete buttons */
.st-edit-btn,.st-del-btn{
  display:flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:7px;border:none;
  background:transparent;cursor:pointer;
  transition:all .15s;color:var(--text2);
  flex-shrink:0;opacity:0;
}
.st-group-row:hover .st-edit-btn,
.st-group-row:hover .st-del-btn,
.st-account-row:hover .st-edit-btn,
.st-account-row:hover .st-del-btn{opacity:1}
.st-edit-btn:hover{background:rgba(201,169,110,.08);color:var(--accent)}
.st-del-btn:hover{background:rgba(192,57,43,.08);color:var(--red)}

/* Add child row */
.st-add-child-row{
  display:none;align-items:center;gap:6px;
  padding:6px 10px 8px 28px;
}
.st-add-child-btn{
  display:flex;align-items:center;gap:4px;
  padding:5px 10px 5px 28px;
  border:none;background:transparent;
  color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;
  transition:color .15s;width:100%;
}
.st-add-child-btn:hover{color:var(--accent)}

.st-empty{
  font-size:12px;color:var(--text2);
  padding:10px 12px;font-style:italic;
}
.st-groups-list{display:flex;flex-direction:column;gap:2px}

/* ── 모바일 하단 탭바 ── */
#mob-tab-bar{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:0.5px solid rgba(0,0,0,.08);
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:300;align-items:center;
}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 7px;cursor:pointer;transition:opacity .15s}
.mob-tab svg{width:22px;height:22px;stroke:#C0C0C8;fill:none;transition:stroke .2s,transform .2s}
.mob-tab span{font-size:10px;color:#C0C0C8;transition:color .2s;white-space:nowrap;font-weight:500}
.mob-tab.active svg{stroke:#111111;transform:scale(1.08)}
.mob-tab.active span{color:var(--text);font-weight:700}
/* 입력 탭 — 동그라미 */
#mob-tab-input{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 7px;cursor:pointer}
#mob-tab-input .tab-circle{width:46px;height:46px;background:#111111;border-radius:23px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
#mob-tab-input:active .tab-circle{transform:scale(.92);box-shadow:0 2px 6px rgba(0,0,0,.12)}
#mob-tab-input span{font-size:10px;color:#C0C0C8;font-weight:500;white-space:nowrap}
/* 분석 서브 내비 — 상단 고정 슬라이드인 */
#mob-analysis-subnav{
  display:none;position:fixed;top:0;left:0;right:0;
  background:rgba(238,240,245,.88);border-bottom:1px solid rgba(255,255,255,.9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  padding-top:env(safe-area-inset-top,44px);
  z-index:350;flex-direction:column;

  transition:transform .35s cubic-bezier(.22,1,.36,1);
  box-shadow:0 4px 24px rgba(0,0,0,.08);
}
#mob-analysis-subnav.open{transform:translateY(0)}
.subnav-top{display:flex;align-items:center;gap:8px;padding:12px 16px 10px}
.subnav-back{display:flex;align-items:center;gap:5px;padding:7px 8px 7px 4px;border-radius:10px;cursor:pointer;background:none;border:none;font-family:inherit;transition:background .15s;flex-shrink:0}
.subnav-back:active{background:#FFFFFF}
.subnav-back svg{stroke:#111111;width:18px;height:18px;fill:none;flex-shrink:0}
.subnav-back span{font-size:15px;color:var(--text);font-weight:700}
.subnav-tabs{display:flex;flex:1;justify-content:flex-end;gap:4px;overflow-x:auto;padding:0 2px}
.subnav-tabs::-webkit-scrollbar{display:none}
.subnav-tab{flex-shrink:0;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;color:#5f5e5e;background:none;border:none;cursor:pointer;font-family:inherit;transition:all .2s cubic-bezier(.22,1,.36,1)}
.subnav-tab.active{background:#2f3131;color:#fff;font-weight:700;transform:scale(1.04)}
/* ── 페이지 전환 애니메이션 (부드럽게 강화) ── */
@keyframes pageFadeSlide{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}

  /* 모바일 전용 숨김 */
  .mob-hide { display: none !important; }
  /* 거래 입력 페이지: 타이틀/설명 숨기고 입력 UI에 집중 */
  #page-input .page-title,
  #page-input .page-desc { display: none !important; }
  #page-input.active { padding-top: 8px !important; }
  /* 입력 폼 금액 폰트 — 모바일에서 더 크게 */
  .mp-field-input[id="mp-amt"] { font-size: 18px !important; font-weight: 700 !important; font-variant-numeric: tabular-nums; }
}
/* 거래내역 필터 — 모바일에서 스크롤 시 상단 고정 */
@media (max-width: 600px) {
  #hist-filter-card {
    position: sticky;
    top: -12px;      /* .page.active padding-top 12px 상쇄 */
    z-index: 10;
    margin-left: -14px;
    margin-right: -14px;
    border-radius: 0 0 var(--r) var(--r) !important;
    box-shadow: 0 2px 12px rgba(0,0,0,.08) !important;
  }
}
/* 100dvh: 모바일 브라우저 주소창 높이 동적 반영 (iOS 15.4+, Chrome 108+) */
@supports (height: 100dvh) {
  #app { height: 100dvh; }
  .page.active {
    height: calc(100dvh - 62px - env(safe-area-inset-top,0px) - 64px - env(safe-area-inset-bottom,0px));
  }
}

/* 내부 콘텐츠 스크롤 — 전 화면 공통 */
.mob-inner-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-bottom: 80px;
}

/* 소형 모바일 (≤375px) */
@media (max-width: 375px) {
  html{font-size:12px}
  .page{padding:10px 12px}
  .g4{grid-template-columns:repeat(2,1fr);gap:6px}
  .card-body{padding:10px 12px}
}
/* ── 기간 선택 탭 ── */
.period-tab{
  flex:1;padding:5px 8px;border:1px solid rgba(0,0,0,.07);
  border-radius:6px;background:transparent;
  color:var(--text2);font-size:11px;font-weight:500;
  cursor:pointer;transition:all .18s;font-family:var(--font);
  white-space:nowrap;letter-spacing:.3px;
}
.period-tab:hover{border-color:rgba(0,0,0,.12);color:var(--text2)}
.period-tab.active{
  background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12);
  color:#111111;
}
.period-panel{transition:all .2s}

/* ── 유틸 타이포 클래스 ── */
.t-xs{font-size:var(--fs-xs)}
.t-sm{font-size:var(--fs-sm)}
.t-md{font-size:var(--fs-md)}
.t-lg{font-size:var(--fs-lg)}
.t-xl{font-size:var(--fs-xl)}
.t-num{font-size:var(--fs-num);font-variant-numeric:tabular-nums}

/* ── 거래 입력 그리드 ── */
.tx-input-grid{
  display:grid;
  grid-template-columns:300px 1fr 1fr;
  gap:14px;
  align-items:start;
}

/* ── History Filter ── */
.hf-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hf-row:last-child{margin-bottom:0}
.hf-label{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;width:52px;flex-shrink:0}
.hf-sep{font-size:13px;color:var(--text2);flex-shrink:0;padding:0 2px}
.hf-row .form-input,.hf-row .hf-input{flex:1;min-width:0}
.hf-row .btn{flex-shrink:0}

/* ── 비용/수익 카드 ── */
.exp-card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 14px;
  border-bottom:0.5px solid var(--card-border);
  gap:10px;
  min-width:0;
}
.exp-card-left{display:flex;align-items:baseline;gap:6px;flex:1;min-width:0;overflow:hidden}
.exp-card-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;align-self:center}
.exp-card-name{font-weight:600;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.exp-card-cnt{font-size:11px;color:var(--text2);line-height:1.2;white-space:nowrap;flex-shrink:0}
.exp-card-right{display:flex;align-items:center;gap:8px;flex-shrink:0;max-width:55%}
.exp-card-total{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-card-budget{font-size:11px;margin-top:2px;white-space:nowrap}

/* ── TX Card Style ── */
.txi-card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--r);
  margin-bottom:6px;
  overflow:hidden;
  transition:border-color .2s,transform .2s;
}
.txi-card:hover{ box-shadow:var(--shadow-md); }
.txi-checkable:hover{ border-color:rgba(0,0,0,.08); }

.txi-top{
  display:flex;align-items:center;gap:8px;
  padding:14px 16px 12px;
  min-width:0;
}
.txi-left{
  flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:4px;
}
.txi-date{
  font-size:11px;color:var(--text2);font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;
}
.txi-amount{
  font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.3px;
  white-space:nowrap;
  flex-shrink:0;
}
.txi-right{
  display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:4px;
}
.txi-mid{ display:none; }
.txi-title{
  font-size:14px;font-weight:500;color:var(--text);
  word-break:break-word;overflow-wrap:break-word;
}
.txi-sub{
  font-size:12px;color:var(--text2);font-weight:400;margin-left:10px;
}
.txi-memo{
  padding:0 16px 6px;
  font-size:11px;color:var(--text2);
  word-break:break-word;overflow-wrap:break-word;
}
.txi-bot{
  display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid rgba(0,0,0,.06);
}
.txi-acct-cell{
  display:flex;align-items:center;gap:6px;
  padding:9px 14px;
  min-width:0;overflow:hidden;
}
.txi-acct-cell + .txi-acct-cell{
  border-left:1px solid rgba(0,0,0,.05);
}
.txi-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.txi-acct-nm{
  font-size:13px;font-weight:500;color:var(--text2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.txi-actions{
  display:flex;gap:4px;flex-shrink:0;
}
.txi-btn{
  display:flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:7px;
  border:none;background:#FFFFFF;
  color:var(--text2);cursor:pointer;
  transition:all .15s;opacity:0;
}
.txi-card:hover .txi-btn{ opacity:1; }
.txi-edit:hover{ background:rgba(201,169,110,.16);color:var(--accent2); }
.txi-del:hover{ background:rgba(192,57,43,.15);color:var(--red); }

.nowrap{white-space:nowrap}

/* ── 자동 추출 유틸 클래스 ── */
.lbl-xs{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
.lbl-xs-b4{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.lbl-xs-t2{font-size:13px;font-weight:500;color:var(--text);margin-top:2px}

/* ══ 세그먼트 날짜 인풋 ══ */
.cdate-wrap{
  width:100%;display:flex;align-items:center;
  padding:10px 14px;
  border:1.5px solid var(--card-border);
  border-radius:var(--rs);
  background:var(--card);
  color:var(--text);
  outline:none;
  font-size:14px;
  font-family:var(--font);
  line-height:1.4;
  box-sizing:border-box;
  cursor:default;
  min-height:42px;
  user-select:none;-webkit-user-select:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.cdate-wrap:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.06);background:#fff}
.cdate-wrap:hover:not(:focus){border-color:var(--card-border-h)}
.cdate-wrap-sm{font-size:12px;padding:6px 8px;min-height:34px}
@media (max-width: 600px) {
  .cdate-wrap-sm{font-size:11px;padding:5px 7px;min-height:30px}
  .cdate-wrap-sm .cdate-num{font-size:11px;letter-spacing:0;font-weight:600}
  .cdate-wrap-sm .cdate-lbl{font-size:9px;margin-left:1px}
  .cdate-wrap-sm .cdate-dot{font-size:9px;margin:0 1px}
  .hf-input.cdate-wrap-sm{min-width:0;flex:1;overflow:hidden}
}
.mp-field-input.cdate-wrap{
  background:transparent;border:none;box-shadow:none;
  padding:0;min-height:unset;width:auto;flex:1;
  font-size:13px;
}
.mp-field-input.cdate-wrap:focus{background:transparent;box-shadow:none;border:none}
.cdate-part{
  display:inline-flex;align-items:baseline;gap:1px;
  padding:2px 4px;border-radius:5px;
  cursor:pointer;transition:background .12s,color .12s;
}
.cdate-part:hover{background:#FFFFFF}
.cdate-part.cd-active{background:#333;color:#fff}
.cdate-part.cd-active .cdate-lbl{color:rgba(0,0,0,.65)}
.cdate-num{font-variant-numeric:tabular-nums;letter-spacing:0.5px;font-weight:500}
.cdate-lbl{font-size:11px;color:var(--text2);margin-left:2px;font-weight:400}
.cdate-dot{color:var(--text2);margin:0 2px;font-size:11px;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
<!-- SIDEBAR -->

<!-- MAIN -->
<main id="main">
  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">

    <!-- KPI 통합 표 -->
    <div id="dashMetrics" style="margin-bottom:14px"></div>

    <!-- 예산 현황 -->
    <div class="card card-body" id="dashBudget" style="margin-bottom:14px"></div>

    <!-- 수익 섹션 -->
    <div class="card card-body" id="dashRevenue" style="margin-bottom:14px"></div>

    <!-- 비용 섹션 -->
    <div class="card card-body" id="dashExpense" style="margin-bottom:14px"></div>

    <!-- 달력 전체폭 -->
    <div class="card card-body" id="dashPattern" style="margin-bottom:14px"></div>

    <!-- 신용카드 + 할부 (단일 카드) -->
    <div id="dashCCSection" class="card card-body" style="display:none;margin-bottom:14px">
      <div class="dash-hd-ttl" style="margin-bottom:14px">신용카드</div>
      <div id="dashCC" style="display:flex;flex-direction:column;gap:8px"></div>
      <div id="dashInstall" style="display:none"></div>
    </div>
    <div id="dashTopExpense" style="display:none"></div>

  </div>

  <!-- TRANSACTION INPUT -->
  <div class="page" id="page-input">
    <div class="page-title">거래 입력</div>
    <div class="page-desc">복식부기 방식으로 거래를 기록합니다</div>
    <div id="txInputLayout" class="mob-inner-scroll"></div>
  </div>

  <!-- HISTORY -->
  <div class="page" id="page-history">
    <div class="page-title">거래 내역</div>
    <div class="page-desc">전체 거래 목록 — 검색·필터·정렬·수정·삭제</div>
    <div id="hist-filter-card" class="card card-body" style="margin-bottom:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px">

      <!-- 검색 — 전체 폭 -->
      <input class="form-input" id="histSearch" placeholder="내용 · 소분류 · 메모 검색" type="text" style="width:100%">

      <!-- 계정과목 + 기간 — 2열 그리드 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start">

        <!-- 계정과목 -->
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.3px">계정과목</span>
          <div onclick="window.openMobPicker('hf','filter')"
               style="display:flex;align-items:center;justify-content:space-between;
                      background:var(--surface);border-radius:var(--rs);
                      padding:10px 14px;cursor:pointer;transition:background .15s;min-height:42px">
            <div id="mob-ptrigger-hf-filter" style="flex:1;display:flex;align-items:center;min-width:0">
              <span style="color:var(--text3);font-size:13px">전체</span>
            </div>
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="var(--text3)" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg>
          </div>
        </div>

        <!-- 기간 -->
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.3px">기간</span>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="cdate-wrap cdate-wrap-sm" tabindex="0" id="histDateFrom_disp" style="flex:1;min-width:0"></div>
            <span style="font-size:12px;color:var(--text3);flex-shrink:0">~</span>
            <div class="cdate-wrap cdate-wrap-sm" tabindex="0" id="histDateTo_disp" style="flex:1;min-width:0"></div>
          </div>
        </div>
      </div>
      <input type="hidden" id="histDateFrom">
      <input type="hidden" id="histDateTo">

      <!-- 정렬 + 초기화 — 한 행 -->
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.3px;white-space:nowrap">정렬</span>
        <select class="form-input" id="histSort" style="flex:1">
          <option value="date_desc">날짜 최신순</option>
          <option value="date_asc">날짜 오래된순</option>
          <option value="amt_desc">금액 높은순</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="resetHistFilters()" style="flex-shrink:0;white-space:nowrap">초기화</button>
      </div>

    </div>

    <!-- 숨겨진 필드 (JS 호환) -->
    <input type="hidden" id="histCat">
    <input type="hidden" id="hf-val-filter">
    <input type="hidden" id="histType" value="">
    <input type="hidden" id="histAmtMin" value="">
    <input type="hidden" id="histAmtMax" value="">

    <div id="histList"></div>
  </div>

  <!-- EXPENSE/REVENUE -->
  <div class="page" id="page-expense">
    <div class="page-title">비용·수익</div>
    <div class="page-desc">항목별 지출·수익 분석 및 전월 비교</div>
    <div id="expenseContent" class="mob-inner-scroll"></div>
  </div>

  <!-- BALANCE -->
  <div class="page" id="page-balance">
    <div class="page-title">자산·부채</div>
    <div class="page-desc">현재 자산·부채 현황 및 순자산</div>
    <div id="balanceContent" class="mob-inner-scroll"></div>
  </div>

  <!-- CREDIT CARD -->
  <div class="page" id="page-creditcard">
    <div class="page-title">신용카드 관리</div>
    <div class="page-desc">신용카드 사용기간·결제일·청구금액 현황</div>
    <div id="ccContent" class="mob-inner-scroll"></div>
  </div>

  <!-- SETTINGS -->
  <div class="page" id="page-settings">
    <div class="page-title">환경 설정</div>
    <div class="page-desc">계정과목·신용카드·예산 관리</div>
    <div id="settingsContent" class="mob-inner-scroll"></div>
  </div>
</main>
</div>

<!-- ══ 전역 상단 고정바 ══ -->
<!-- 숨김 select — buildMonthSel 호환용 -->
<select id="gtb-monthSel" style="display:none;position:absolute;width:0;height:0;opacity:0"></select>

<header id="global-top-bar">
  <!-- 이전 달 -->
  <button class="gtb-btn" id="gtb-prev" onclick="gtbPrevMonth()" aria-label="이전 달">
    <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 6 7 6"/></svg>
  </button>
  <!-- 중앙 월·기간 표시 -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default;user-select:none">
    <div id="gtb-month-lbl" style="font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px;line-height:1"></div>
    <div id="gtb-period-lbl" style="font-size:11px;font-weight:400;color:var(--text2);white-space:nowrap;line-height:1"></div>
  </div>
  <!-- 다음 달 -->
  <button class="gtb-btn" id="gtb-next" onclick="gtbNextMonth()" aria-label="다음 달">
    <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l7 6-7 6"/></svg>
  </button>
  <div class="gtb-right">
    <button class="gtb-btn" onclick="goTo('settings')" title="환경 설정" aria-label="환경 설정">
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="11" r="2.8"/>
        <path d="M11 2v2M11 18v2M2 11h2M18 11h2M4.9 4.9l1.4 1.4M15.7 15.7l1.4 1.4M4.9 17.1l1.4-1.4M15.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<!-- ══ 전역 하단 탭바 ══ -->
<nav id="global-tab-bar">
  <!-- 기본 탭 4개 -->
  <div id="gtb-normal" class="gtb-inner">
    <button class="gtb-tab active" id="gtb-home" onclick="goTo('dashboard')">
      <svg viewBox="0 0 22 22" stroke-width="1.6"><path d="M3 10.5L11 3l8 7.5V19a1 1 0 01-1 1H4a1 1 0 01-1-1v-8.5z"/></svg>
      <span>홈</span>
    </button>
    <button class="gtb-tab" id="gtb-history" onclick="goTo('history')">
      <svg viewBox="0 0 22 22" stroke-width="1.5"><path d="M3 5h16M3 10h10M3 15h13"/></svg>
      <span>내역</span>
    </button>
    <button class="gtb-tab" id="gtb-input" onclick="goTo('input')">
      <svg viewBox="0 0 22 22" stroke-width="2"><path d="M11 5v12M5 11h12"/></svg>
      <span>입력</span>
    </button>
    <button class="gtb-tab" id="gtb-analysis" onclick="openAnalysisMode()">
      <svg viewBox="0 0 22 22" stroke-width="1.5"><path d="M4 17l4-5 4 3 5-8"/></svg>
      <span>분석</span>
    </button>
  </div>
  <!-- 분석 모드 탭 -->
  <div id="gtb-analysis-bar" class="gtb-inner">
    <button class="gtb-back-tab" onclick="closeAnalysisMode()">
      <svg viewBox="0 0 22 22" stroke-width="2"><path d="M14 5l-7 6 7 6"/></svg>
      <span>뒤로</span>
    </button>
    <button class="gtb-analysis-tab active" id="gta-expense" onclick="switchToAnalysis('expense')">비용·수익</button>
    <button class="gtb-analysis-tab" id="gta-balance" onclick="switchToAnalysis('balance')">자산·부채</button>
    <button class="gtb-analysis-tab" id="gta-creditcard" onclick="switchToAnalysis('creditcard')">신용카드</button>
  </div>
</nav>

<!-- ══ 더보기 시트 ══ -->
<div id="mob-more-sheet" class="mob-sheet-overlay" onclick="if(event.target===this)closeMobMore()">
  <div class="mob-sheet-body" style="max-height:60vh">
    <div class="mob-sheet-hd">
      <span style="font-size:15px;font-weight:700;color:var(--text)">더보기</span>
      <button class="mob-sheet-close" onclick="closeMobMore()"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#555" stroke-width="2"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
    </div>
    <div style="padding:6px 0 8px">
      <!-- GS 프로필 전환 (등록된 경우만 표시) -->
      <div id="mob-more-gs-section"></div>
      <div onclick="goTo('balance');closeMobMore()" style="display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer;border-bottom:0.5px solid #F5F5F5">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#555" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l3 2"/></svg>
        <span style="font-size:14px;color:#111;flex:1">자산·부채</span>

<script>
/* ══ 세그먼트 날짜 인풋 공통 함수 ══
   클릭으로 년/월/일 세그먼트 선택
   숫자 입력: 선택 세그먼트 왼→오 순서
   Backspace: 선택 세그먼트 오→왼 삭제
══════════════════════════════════════════════ */
var CDATE_INNER = '<span class="cdate-part" data-seg="y"><span class="cdate-num">____</span><span class="cdate-lbl">년</span></span><span class="cdate-dot"> · </span><span class="cdate-part" data-seg="m"><span class="cdate-num">__</span><span class="cdate-lbl">월</span></span><span class="cdate-dot"> · </span><span class="cdate-part" data-seg="d"><span class="cdate-num">__</span><span class="cdate-lbl">일</span></span>';

// 마지막으로 입력한 날짜 기억 (연속 장부 기입 시 날짜 유지용)
var lastInputDate = '';

/* 성공 피드백: 지정 요소에 초록 글로우 애니메이션만 표시 (팝업 없음) */
function flashSuccess(el) {
  if (!el) return;
  el.classList.remove('success-flash');
  void el.offsetWidth; // reflow로 애니메이션 재시작
  el.classList.add('success-flash');
  setTimeout(function(){ el.classList.remove('success-flash'); }, 1700);
}

function initCustDate(dispId, hiddenId, initVal) {
  var wrap   = document.getElementById(dispId);
  var hidden = document.getElementById(hiddenId);
  if (!wrap || !hidden) return;

  // wrap이 input이면 div로 교체
  if (wrap.tagName === 'INPUT') {
    var div = document.createElement('div');
    div.id        = wrap.id;
    div.className = wrap.className.replace(/\bform-input\b/, 'cdate-wrap').replace(/\bmp-field-input\b/, 'mp-field-input cdate-wrap');
    if (!div.className.includes('cdate-wrap')) div.className += ' cdate-wrap';
    div.setAttribute('tabindex','0');
    div.style.cssText = '';
    wrap.parentNode.replaceChild(div, wrap);
    wrap = div;
  }
  if (!wrap.querySelector('.cdate-part')) {
    wrap.innerHTML = CDATE_INNER;
  }

  var SEG_MAP   = { y:[0,1,2,3], m:[4,5], d:[6,7] };
  var SEG_ORDER = ['y','m','d'];
  var digits    = ['','','','','','','',''];
  var activeSeg = 'y';

  function segPart(s) { return wrap.querySelector('[data-seg="'+s+'"]'); }
  function segNum(s)  { var p=segPart(s); return p?p.querySelector('.cdate-num'):null; }

  function updateHighlight() {
    SEG_ORDER.forEach(function(s) {
      var p = segPart(s);
      if (p) p.classList.toggle('cd-active', s===activeSeg && document.activeElement===wrap);
    });
  }

  function renderDisp() {
    var texts = {
      y: (digits[0]||'_')+(digits[1]||'_')+(digits[2]||'_')+(digits[3]||'_'),
      m: (digits[4]||'_')+(digits[5]||'_'),
      d: (digits[6]||'_')+(digits[7]||'_')
    };
    SEG_ORDER.forEach(function(s) {
      var n = segNum(s); if (n) n.textContent = texts[s];
    });
    updateHighlight();
    if (digits.every(function(v){return v!==''})) {
      hidden.value = digits[0]+digits[1]+digits[2]+digits[3]
        +'-'+digits[4]+digits[5]+'-'+digits[6]+digits[7];
    } else { hidden.value = ''; }
  }

  function fillFromYMD(ymd) {
    if (!ymd || ymd.length < 10) return;
    var y=ymd.substring(0,4), mo=ymd.substring(5,7), d=ymd.substring(8,10);
    digits = [y[0],y[1],y[2],y[3],mo[0],mo[1],d[0],d[1]];
  }

  function selectSeg(s) { activeSeg = s; wrap.focus(); renderDisp(); }

  // ── 모바일 전용: 네이티브 <input type="date"> 를 wrap 위에 투명하게 덮어씌워 직접 탭 가능하게 ──
    var nativeInput = document.createElement('input');
    nativeInput.type = 'date';
    // 투명하되 pointer-events 살려서 사용자가 직접 탭할 수 있게
    nativeInput.style.cssText = [
      'position:absolute',
      'inset:0',
      'width:100%',
      'height:100%',
      'opacity:0',
      'cursor:pointer',
      'z-index:2',
      'border:none',
      'background:transparent',
      '-webkit-appearance:none'
    ].join(';');
    wrap.style.position = 'relative';
    wrap.style.overflow = 'visible';
    wrap.appendChild(nativeInput);

    var syncNativeVal = function() {
      if (digits.every(function(v){ return v!==''; })) {
        nativeInput.value = digits[0]+digits[1]+digits[2]+digits[3]+'-'+digits[4]+digits[5]+'-'+digits[6]+digits[7];
      }
    };

    nativeInput.addEventListener('change', function() {
      if (this.value) {
        fillFromYMD(this.value);
        renderDisp();
      }
    });
    // focus 시 커스텀 하이라이트
    nativeInput.addEventListener('focus', function() { wrap.classList.add('cd-active-wrap'); });
    nativeInput.addEventListener('blur',  function() { wrap.classList.remove('cd-active-wrap'); });

    hidden._setCustVal = function(ymd) { fillFromYMD(ymd); renderDisp(); syncNativeVal(); };
    if (initVal) fillFromYMD(initVal);
    else {
      var now0 = new Date();
      fillFromYMD(now0.getFullYear()+'-'
        +(now0.getMonth()+1<10?'0':'')+(now0.getMonth()+1)+'-'
        +(now0.getDate()<10?'0':'')+now0.getDate());
    }
    renderDisp();
    syncNativeVal();
}

// 외부에서 날짜를 세팅할 때 쓰는 헬퍼
function setCustDate(hiddenId, ymd) {
  var hidden = document.getElementById(hiddenId);
  if (!hidden) return;
  if (hidden._setCustVal) { hidden._setCustVal(ymd); }
  else { hidden.value = ymd; }
}

/* ══════════════════════════════════════════════
   DATA STORE
══════════════════════════════════════════════ */
// [BUG-1 & BUG-2 수정] localStorage 저장 실패 알림 + 파싱 실패 시 원본 백업
function _lsShowError(msg) {
  var el = document.getElementById('ls-error-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ls-error-toast';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:var(--expense);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
}
const LS = {
  get:(k,d)=>{
    try {
      const v=localStorage.getItem(k);
      if (!v) return d;
      try {
        return JSON.parse(v);
      } catch(parseErr) {
        // [BUG-2 수정] 파싱 실패 시 손상 데이터를 별도 키에 백업 후 사용자 알림
        try { localStorage.setItem('gb_backup_raw_'+k, v); } catch(_){}
        _lsShowError('데이터를 불러오는 중 문제가 발생했습니다. 이전 데이터를 백업했습니다. (키: ' + k + ')');
        return d;
      }
    } catch { return d; }
  },
  set:(k,v)=>{
    try {
      localStorage.setItem(k,JSON.stringify(v));
    } catch(e) {
      // [BUG-1 수정] 저장 실패 시 사용자에게 즉시 경고
      _lsShowError('저장 실패: 저장 공간이 부족하거나 시크릿 모드일 수 있습니다. 새로고침 시 데이터가 사라질 수 있습니다.');
    }
  }
};

/* ══ GOOGLE SHEETS 동기화 — 멀티 프로필 ══ */
var GS_PROFILES = LS.get('gb_gs_profiles', []);   // [{id,name,url}, ...]
var GS_ACTIVE_ID = LS.get('gb_gs_active_id', ''); // 활성 프로필 id
// 레거시 단일 URL 마이그레이션
(function(){
  var legacyUrl = LS.get('gb_gs_url', '');
  if (legacyUrl && GS_PROFILES.length === 0) {
    var prof = { id: 'p_legacy', name: '기본', url: legacyUrl };
    GS_PROFILES = [prof];
    GS_ACTIVE_ID = prof.id;
    LS.set('gb_gs_profiles', GS_PROFILES);
    LS.set('gb_gs_active_id', GS_ACTIVE_ID);
    LS.set('gb_gs_url', ''); // 레거시 제거
  }
})();

function _gsActiveProfile() {
  return GS_PROFILES.find(function(p){ return p.id === GS_ACTIVE_ID; }) || null;
}
var GS_URL = _gsActiveProfile() ? _gsActiveProfile().url : '';

var syncState = { timer: null, lastSync: LS.get('gb_last_sync','') };

// ── 디바운스 예약 ──
function schedulSync() {
  if (!GS_URL) return;
  if (syncState.timer) clearTimeout(syncState.timer);
  syncState.timer = setTimeout(function() { pushToSheets(); }, 3000);
  setSyncBadge('pending');
}

// ── 앱 → Sheets: iframe + form POST (CORS 우회) ──
function pushToSheets() {
  if (!GS_URL) return;
  setSyncBadge('syncing');

  // 기존 iframe 제거
  var old = document.getElementById('_gsFrame');
  if (old) old.parentNode.removeChild(old);

  var payload = JSON.stringify({ action:'push', accts:accts, txs:txs, budgets:budgets });

  // 숨김 iframe
  var iframe = document.createElement('iframe');
  iframe.id   = '_gsFrame';
  iframe.name = '_gsFrame';
  iframe.style.cssText = 'display:none;position:absolute;width:0;height:0';
  document.body.appendChild(iframe);

  // 숨김 form
  var form = document.createElement('form');
  form.method  = 'POST';
  form.action  = GS_URL;
  form.target  = '_gsFrame';
  form.style.cssText = 'display:none';

  var inp = document.createElement('input');
  inp.type  = 'hidden';
  inp.name  = 'payload';
  inp.value = payload;
  form.appendChild(inp);
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);

  // 3초 후 성공으로 처리 (form submit은 응답 수신 불가)
  setTimeout(function() {
    syncState.lastSync = new Date().toLocaleString('ko-KR');
    LS.set('gb_last_sync', syncState.lastSync);
    setSyncBadge('ok');
  }, 3000);
}

// ── Sheets → 앱: JSONP GET (CORS 우회) ──
function pullFromSheets(cb) {
  if (!GS_URL) { if(cb) cb(false); return; }
  setSyncBadge('syncing');

  // 콜백 함수명 (전역)
  var cbName = '_gsCallback_' + Date.now();
  var timeoutId;

  window[cbName] = function(res) {
    clearTimeout(timeoutId);
    var s = document.getElementById('_gsScript');
    if (s) s.parentNode.removeChild(s);
    delete window[cbName];

    if (res && res.ok && res.data) {
      var d = res.data;
      if (d.accts)   { accts   = d.accts;   LS.set('gb_accts',   accts); }
      if (d.txs)     { txs     = d.txs;     LS.set('gb_txs',     txs); }
      if (d.budgets) { budgets = d.budgets; LS.set('gb_budgets', budgets); }
      syncState.lastSync = new Date().toLocaleString('ko-KR');
      LS.set('gb_last_sync', syncState.lastSync);
      setSyncBadge('ok');
      if (cb) cb(true);
    } else {
      // JSONP 응답은 왔지만 데이터 없음 — 이전 동기화 성공 기록 있으면 ok 유지
      if (syncState.lastSync) setSyncBadge('ok');
      else setSyncBadge('error');
      if (cb) cb(false);
    }
  };

  timeoutId = setTimeout(function() {
    var s = document.getElementById('_gsScript');
    if (s) s.parentNode.removeChild(s);
    delete window[cbName];
    // 타임아웃: 이전 동기화 성공 기록 있으면 ok 유지, 없으면 error
    if (syncState.lastSync) setSyncBadge('ok');
    else setSyncBadge('error');
    if (cb) cb(false);
  }, 10000);

  var script = document.createElement('script');
  script.id  = '_gsScript';
  script.src = GS_URL + '?action=pull&callback=' + cbName;
  document.head.appendChild(script);
}

function setSyncBadge(state) {
  var el = document.getElementById('syncBadge');
  if (!el) return;
  var map = {
    'off':     { t:'동기화 꺼짐',  c:'rgba(0,0,0,.12)', fg:'#777' },
    'pending': { t:'저장 대기중…', c:'rgba(201,169,110,.16)',   fg:'var(--income)' },
    'syncing': { t:'동기화 중…',   c:'rgba(201,169,110,.16)',   fg:'var(--income)' },
    'ok':      { t:'✓ 동기화됨',   c:'rgba(0,0,0,.15)',   fg:'var(--income)' },
    'error':   { t:'동기화 실패',   c:'rgba(192,57,43,.15)',   fg:'var(--expense)' },
  };
  var s = map[state] || map['off'];
  var label = s.t;
  if (state === 'ok' && syncState.lastSync) {
    var parts = syncState.lastSync.split(' ');
    var timeStr = parts.length >= 3 ? parts[parts.length-2]+' '+parts[parts.length-1] : syncState.lastSync;
    label = '✓ ' + timeStr + ' 동기화';
  }
  el.textContent = label;
  el.style.background = s.c;
  el.style.color = s.fg;
  // 프로필 전환 UI 갱신
  renderGsQuickSwitch();
}

/* ── GS 빠른 프로필 전환 렌더 ── */
function renderGsQuickSwitch() {
  // 사이드바 (데스크톱)
  var qs = document.getElementById('gs-quick-switch');
  if (qs) {
    if (GS_PROFILES.length >= 2) {
      qs.style.display = 'block';
      qs.innerHTML = '<div style="display:flex;flex-direction:column;gap:3px">'
        + GS_PROFILES.map(function(p) {
          var isAct = p.id === GS_ACTIVE_ID;
          return '<button onclick="gsSwitchProfile(\''+p.id+'\')" style="'
            +'display:flex;align-items:center;gap:7px;width:100%;padding:5px 10px;'
            +'border-radius:8px;border:1.5px solid '+(isAct?'rgba(201,169,110,.5)':'rgba(0,0,0,.08)')+';'
            +'background:'+(isAct?'rgba(201,169,110,.1)':'transparent')+';'
            +'cursor:pointer;font-family:inherit;text-align:left;transition:all .15s">'
            +'<div style="width:6px;height:6px;border-radius:50%;background:'+(isAct?'#C9A96E':'#ccc')+';flex-shrink:0"></div>'
            +'<span style="font-size:11px;font-weight:'+(isAct?'700':'500')+';color:'+(isAct?'#111':'#777')+';flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHTML(p.name)+'</span>'
            +(isAct?'<span style="font-size:9px;color:#C9A96E;font-weight:700">ON</span>':'')
            +'</button>';
        }).join('')
        + '</div>';
    } else {
      qs.style.display = 'none';
      qs.innerHTML = '';
    }
  }
  // 모바일 더보기 시트 내 GS 섹션
  var mobGs = document.getElementById('mob-more-gs-section');
  if (mobGs) {
    if (GS_PROFILES.length >= 2) {
      mobGs.innerHTML = '<div style="padding:12px 20px 8px;border-bottom:0.5px solid #F0F0F0">'
        +'<div style="font-size:10px;font-weight:700;color:#bbb;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">Google Sheets</div>'
        +'<div style="display:flex;flex-direction:column;gap:6px">'
        + GS_PROFILES.map(function(p) {
          var isAct = p.id === GS_ACTIVE_ID;
          return '<button onclick="gsSwitchProfile(\''+p.id+'\');closeMobMore()" style="'
            +'display:flex;align-items:center;gap:12px;padding:11px 14px;'
            +'border-radius:10px;border:1.5px solid '+(isAct?'rgba(201,169,110,.5)':'rgba(0,0,0,.08)')+';'
            +'background:'+(isAct?'rgba(201,169,110,.08)':'#F9F9F9')+';'
            +'cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:all .15s">'
            +'<div style="width:8px;height:8px;border-radius:50%;background:'+(isAct?'#C9A96E':'#ccc')+';flex-shrink:0"></div>'
            +'<span style="font-size:14px;font-weight:'+(isAct?'700':'500')+';color:'+(isAct?'#111':'#555')+';flex:1">'+escapeHTML(p.name)+'</span>'
            +(isAct?'<span style="font-size:11px;background:#C9A96E;color:#fff;padding:2px 9px;border-radius:99px;flex-shrink:0">사용중</span>':'')
            +'</button>';
        }).join('')
        +'</div></div>';
    } else {
      mobGs.innerHTML = '';
    }
  }
}

// ── 프로필 추가 ──
window.gsAddProfile = function() {
  var nameEl = document.getElementById('gsProfileName');
  var urlEl  = document.getElementById('gsProfileUrl');
  if (!nameEl || !urlEl) return;
  var name = nameEl.value.trim();
  var url  = urlEl.value.trim();
  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!url || !url.startsWith('https://script.google.com')) {
    alert('올바른 Apps Script URL을 입력해주세요.'); return;
  }
  if (GS_PROFILES.length >= 5) { alert('최대 5개까지 등록할 수 있습니다.'); return; }

function escapeHTML(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')

/* "YYYY-MM-DD" 두 날짜를 받아 "2026년 3월 5일 ~ 4월 4일" 형식으로 반환
   연도가 다를 경우 끝날짜에도 연도 표시 */
function fmtCycleRange(s, e) {
  var sp = s.split('-'), ep = e.split('-');
  var sy = parseInt(sp[0]), sm = parseInt(sp[1]), sd = parseInt(sp[2]);
  var ey = parseInt(ep[0]), em = parseInt(ep[1]), ed = parseInt(ep[2]);
  var start = sy + '년 ' + sm + '월 ' + sd + '일';
  var end   = (ey !== sy ? ey + '년 ' : '') + em + '월 ' + ed + '일';
  return start + ' ~ ' + end;
}
function fmtShort(n) {
  if (n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if (n >= 10000)     return (n/10000).toFixed(1).replace(/\.0$/,'')+'만';
  return fmt(n);
}
function fmtCalShort(n) {
  return fmt(n);
}
function calAmtFontSize(n) {
  return (160 / fmtCalShort(n).length).toFixed(2)+'cqi';
}

/* [FIX] 할부 미래 거래 왜곡 방지 — 헬퍼 함수들 */
// 오늘 날짜를 'YYYY-MM-DD' 형식으로 반환 (호출 시점 기준, 전역 now 사용 안 함)
function todayStr() {
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 미래 할부 거래인지 판별
function isFutureInstall(tx) {
  return tx.install && tx.install.total > 1 && tx.date > todayStr();
}
/* ── 월 범위 계산 (cycleStartDay 반영) ──
   cycleStartDay=1  → 해당 월 1일 ~ 말일  (기존 동작)
   cycleStartDay=5  → 해당 월 5일 ~ 다음 달 4일
   y, m: 0-indexed month (viewMonth 기준)
*/
const dateRange = (y, m) => {
  const d = cycleStartDay || 1;
  if (d <= 1) {
    // 기본: 1일~말일
    const s = `${y}-${((m+1)<10?'0':'')+(m+1)}-01`;
    const e = `${y}-${((m+1)<10?'0':'')+(m+1)}-${new Date(y,m+1,0).getDate()}`;
    return {s, e};
  }
  // 시작: 해당 월 d일
  const sLastDay = new Date(y, m+1, 0).getDate();
  const sd = Math.min(d, sLastDay);
  const sStr = `${y}-${((m+1)<10?'0':'')+(m+1)}-${sd<10?'0':''}${sd}`;
  // 종료: 다음 달 (d-1)일
  let eY = y, eM = m + 1;
  if (eM > 11) { eM = 0; eY++; }
  const eLastDay = new Date(eY, eM+1, 0).getDate();
  const ed = Math.min(d - 1, eLastDay);
  const eStr = `${eY}-${((eM+1)<10?'0':'')+(eM+1)}-${ed<10?'0':''}${ed}`;
  return { s: sStr, e: eStr };
};

/* ── Balance calculation ── */
function calcBalances(cutoffDate) {
  const acctMap = {};
  accts.forEach(a => { acctMap[a.id] = a; });

  // 기본 컷오프: 조회 기간 말일
  var defaultCutoff = cutoffDate || getViewRange().e;

  // 신용카드별 결제일 컷오프 계산
  // 해당 월 결제일(payment_acct 기준)까지 발생한 거래만 잔액에 반영
  var ccCutoff = {};
  accts.filter(a => a.subtype === 'credit' && a.cc).forEach(cc => {
    var payStr = ccPaymentDate(cc, viewYear, viewMonth);
    // "YYYY.MM.DD" → "YYYY-MM-DD"
    var payISO = payStr.replace(/\./g, '-');
    ccCutoff[cc.id] = payISO;
  });

  const b = {};
  accts.forEach(a => { b[a.id] = a.init || 0; });
  txs.forEach(({left, right, amount, date, install}) => {
    const la = acctMap[left], ra = acctMap[right];
    if (!la || !ra) return;

    // [FIX] 미래 할부 거래는 잔액 계산에서 제외
    if (install && install.total > 1 && date > todayStr()) return;

    // 어느 쪽 계정이 신용카드인지 확인해 컷오프 결정
    var ccId = (la.subtype === 'credit') ? la.id : (ra.subtype === 'credit') ? ra.id : null;
    var cutoff = ccId ? (ccCutoff[ccId] || defaultCutoff) : defaultCutoff;

    if (date > cutoff) return;

    const lSign = ['asset','expense'].includes(la.type) ? 1 : -1;
    b[la.id] += lSign * amount;
    const rSign = ['liability','capital','revenue'].includes(ra.type) ? 1 : -1;
    b[ra.id] += rSign * amount;
  });
  return b;
}

/* ── 거래별 자산 잔액 캐시 ──
   txs 배열이 바뀔 때마다 재계산.
   _txBalanceCache[txId] = { leftBal: number|null, rightBal: number|null }
   leftBal/rightBal: 해당 거래 직후의 자산 계좌 잔액 (자산 계좌가 아니면 null) */
var _txBalanceCache = null;

function buildTxBalanceCache() {
  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });

  // 초기 잔액 (init)
  var running = {};
  accts.forEach(function(a){ running[a.id] = (a.init || 0); });

  // 날짜 오름차순 정렬 (같은 날은 txs 배열 순서 역순 = 입력 순)
  var sorted = txs.slice().reverse().sort(function(a,b){
    if(a.date < b.date) return -1; if(a.date > b.date) return 1; return ((a.updatedAt||a.createdAt||0)-(b.updatedAt||b.createdAt||0));
  });

  var cache = {};
  sorted.forEach(function(t) {
    var la = acctMap[t.left]  || null;
    var ra = acctMap[t.right] || null;
    if (!la || !ra) { cache[t.id] = { leftBal: null, rightBal: null }; return; }

    // [FIX] 미래 할부 거래는 잔액에 반영하지 않고 null 처리
    if (isFutureInstall(t)) {
      cache[t.id] = { leftBal: null, rightBal: null, futureInstall: true };
      return;
    }

    // 잔액 업데이트
    var lSign = (['asset','expense'].indexOf(la.type) >= 0) ? 1 : -1;
    var rSign = (['liability','capital','revenue'].indexOf(ra.type) >= 0) ? 1 : -1;
    running[t.left]  += lSign * t.amount;
    running[t.right] += rSign * t.amount;

    // 자산 계좌만 잔액 노출
    cache[t.id] = {
      leftBal:  la.type === 'asset' ? running[t.left]  : null,
      rightBal: ra.type === 'asset' ? running[t.right] : null
    };
  });

  _txBalanceCache = cache;
}

function getTxBal(txId) {
  if (!_txBalanceCache) buildTxBalanceCache();
  return _txBalanceCache[txId] || { leftBal: null, rightBal: null };
}

function monthTxs(y,m) {
  // 기간 모드에 따라 동적으로 범위 결정
  var r = (typeof getViewRange === 'function') ? getViewRange() : dateRange(y,m);
  return txs.filter(function(t){
    if (t.date < r.s || t.date > r.e) return false;
    // [FIX] 미래 할부 거래는 집계에서 제외 (아직 실제 결제가 발생하지 않은 건)
    if (isFutureInstall(t)) return false;
    return true;
  });
}

/* ── CC billing calculation ──
   billing_start <= billing_end : 같은 달 내 (예: 1일~31일 → 해당월 1일~31일)
   billing_start >  billing_end : 달 걸침   (예: 16일~15일 → 전월 16일~당월 15일)
   y, m 은 "청구서 기준 월" (결제 월이 아닌 사용 기간 기준 월)
*/
function ccBillingRange(billing, y, m) {
  var bs = billing.billing_start || 1;
  var be = billing.billing_end   || 31;
  var pad = function(n){ return n < 10 ? '0'+n : String(n); };

  var sY, sM, eY, eM;
  if (bs <= be) {
    // 같은 달 내 (예: 1~31)
    sY = y; sM = m; eY = y; eM = m;
  } else {
    // 달 걸침 (예: 16~15 → 전달 16일 ~ 당달 15일)
    eY = y; eM = m;
    sM = m - 1; sY = y;
    if (sM < 0) { sM = 11; sY--; }
  }
  var sLastDay = new Date(sY, sM+1, 0).getDate();
  var eLastDay = new Date(eY, eM+1, 0).getDate();
  var startDay = Math.min(bs, sLastDay);
  var endDay   = Math.min(be, eLastDay);
  return {
    s: sY+'-'+pad(sM+1)+'-'+pad(startDay),
    e: eY+'-'+pad(eM+1)+'-'+pad(endDay)
  };
}

function ccBillingAmount(ccAcct, y, m) {
  if (!ccAcct.cc) return 0;
  var yr = (y !== undefined) ? y : viewYear;
  var mo = (m !== undefined) ? m : viewMonth;
  var range = ccBillingRange(ccAcct.cc, yr, mo);
  return txs
    .filter(function(t){
      if (t.right !== ccAcct.id) return false;
      if (t.date < range.s || t.date > range.e) return false;
      // [FIX] 미래 할부 거래는 청구 금액에서 제외
      if (isFutureInstall(t)) return false;
      return true;
    })
    .reduce(function(sum, t){ return sum + t.amount; }, 0);
}

/* 지난 달 청구액 — 청구 기준 월을 한 달 앞으로 */
function ccLastBillingAmount(ccAcct, y, m) {
  if (!ccAcct.cc) return 0;
  var mo = (m !== undefined) ? m : viewMonth;
  var yr = (y !== undefined) ? y : viewYear;
  mo--; if (mo < 0) { mo = 11; yr--; }
  return ccBillingAmount(ccAcct, yr, mo);
}

function ccPaymentDate(ccAcct, y, m) {
  if (!ccAcct.cc) return '';
  const {billing_month_offset, billing_day} = ccAcct.cc;
  const payDate = new Date(y, m + billing_month_offset, billing_day);
  var _pm=payDate.getMonth()+1, _pd=payDate.getDate();
  return payDate.getFullYear()+'.'+((_pm<10?'0':'')+_pm)+'.'+((_pd<10?'0':'')+_pd);
}

// [BUG-4 수정] 전역 now 대신 호출 시점의 new Date() 사용 → 자정 이후에도 정확한 날짜 계산
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const [y,mo,d] = dateStr.split('.').map(Number);
  var todayNow = new Date();
  var todayMid = new Date(todayNow.getFullYear(), todayNow.getMonth(), todayNow.getDate());
  const diff = new Date(y,mo-1,d) - todayMid;
  return Math.round(diff / 86400000);
}

/* ── 조회기간 상단바 갱신 ── */
function _updateGtbPeriod() {
  var curVal = viewYear + '-' + viewMonth;
  // 숨김 select 동기화 (buildMonthSel 호환)
  var sel = document.getElementById('gtb-monthSel');
  if (sel && sel.value !== curVal) {
    var opt = sel.querySelector('option[value="'+curVal+'"]');
    if (opt) sel.value = curVal;
  }
  // 중앙 월 라벨
  var monthLbl = document.getElementById('gtb-month-lbl');
  if (monthLbl) monthLbl.textContent = viewYear + '년 ' + (viewMonth + 1) + '월';
  // 중앙 기간 라벨
  var periodLbl = document.getElementById('gtb-period-lbl');

var periodMode = 'month'; // 'month' | '3month' | 'custom'
var viewDateFrom = ''; // custom 시작일
var viewDateTo   = ''; // custom 종료일

// 현재 조회 기간의 날짜 범위 반환
function getViewRange() {
  if (periodMode === 'month') {
    return dateRange(viewYear, viewMonth);
  } else if (periodMode === '3month') {
    var endD = dateRange(viewYear, viewMonth);
    var startM = viewMonth - 2;
    var startY = viewYear;
    if (startM < 0) { startM += 12; startY--; }
    var startD = dateRange(startY, startM);
    return { s: startD.s, e: endD.e };
  } else {
    return { s: viewDateFrom, e: viewDateTo };
  }
}

// 기간 라벨 업데이트
function updatePeriodLabel() {
  var el = document.getElementById('periodLabel');
  if (el) {
    var r = getViewRange();
    if (periodMode === 'month') {
      if ((cycleStartDay || 1) <= 1) {
        el.textContent = viewYear + '년 ' + (viewMonth+1) + '월';
      } else {
        el.textContent = fmtCycleRange(r.s, r.e);
      }
    } else if (periodMode === '3month') {
      var sm = viewMonth - 2; var sy = viewYear;
      if (sm < 0) { sm += 12; sy--; }
      el.textContent = sy + '.' + (sm+1) + ' ~ ' + viewYear + '.' + (viewMonth+1);
    } else {
      el.textContent = fmtCycleRange(r.s||'', r.e||'');
    }
  }
  // 전역 상단바 월 선택기 값 동기화
  var gtbSel = document.getElementById('gtb-monthSel');
  var curVal = viewYear + '-' + viewMonth;

    if (opt) gtbSel.value = curVal;

  // 모바일 헤더도 갱신
  _updateGtbPeriod();
}

function buildMonthSel() {
  var sel = document.getElementById('monthSel');
  var opts = [];
  var d0 = cycleStartDay || 1;
  var _now = new Date();
  for (var i = 23; i >= 0; i--) {
    var d = new Date(_now.getFullYear(), _now.getMonth() - i, 1);
    var y = d.getFullYear(), m = d.getMonth();
    var v = y + '-' + m;
    var r2 = dateRange(y, m);
    // 라벨: "2026년 4월 1일 ~ 4월 30일" 형식
    function _fd(ds) {
      var p = ds.split('-');
      return p[0]+'년 '+parseInt(p[1])+'월 '+parseInt(p[2])+'일';
    }
    var ep = r2.e.split('-');

      ? parseInt(ep[1])+'월 '+parseInt(ep[2])+'일'
      : parseInt(ep[1])+'월 '+parseInt(ep[2])+'일';
    var lbl = _fd(r2.s) + ' ~ ' + endStr;
    opts.push('<option value="'+v+'"'+(y===viewYear&&m===viewMonth?' selected':'')+'>'+lbl+'</option>');
  }
  if (sel) {
    sel.innerHTML = opts.join('');
    sel.onchange = function() {
      var parts = sel.value.split('-');

  var pt = document.getElementById('periodTo');

  if (pf && !pf.value) setCustDate('periodFrom', r.s);
  if (pt && !pt.value) setCustDate('periodTo', r.e);
