/* ══ DASHBOARD ══ */
/* ══ DASHBOARD — 계산 레이어 ══ */
function calcDashData() {
  var mtxs = monthTxs(viewYear, viewMonth);
  var bals = calcBalances();
  var r    = getViewRange();
  var now2 = new Date();
  var dashAcctMap = {};
  accts.forEach(function(a){ dashAcctMap[a.id] = a; });

  var totalRevenue = 0, totalExpense = 0;
  var expByAcct = {}, revByAcct = {};
  for (var i=0;i<mtxs.length;i++) {
    var t = mtxs[i];
    var la = dashAcctMap[t.left]  || null;
    var ra = dashAcctMap[t.right] || null;
    if (la && la.type==='expense') { totalExpense += t.amount; expByAcct[la.id]=(expByAcct[la.id]||0)+t.amount; }
    if (ra && ra.type==='revenue') { totalRevenue += t.amount; revByAcct[ra.id]=(revByAcct[ra.id]||0)+t.amount; }
  }
  var netIncome   = totalRevenue - totalExpense;
  var savingsRate = totalRevenue > 0 ? Math.round((totalRevenue - totalExpense)/totalRevenue*100) : 0;

  var netAsset = 0;
  for (var k=0;k<accts.length;k++) {
    var a=accts[k];
    if (a.type==='asset')     netAsset += (bals[a.id]||0);
    if (a.type==='liability') netAsset -= (bals[a.id]||0);
  }

  var prevExpense=0, prevRevenue=0, prevFixedExp=0, prevVarExp=0;
  var prevExpByGroup={}, prevTxs=[];
  if (periodMode==='month') {
    var pm=viewMonth-1, py=viewYear;
    if (pm<0){pm=11;py--;}
    prevTxs=txs.filter(function(t){var rd=dateRange(py,pm);if(t.date<rd.s||t.date>rd.e)return false;if(isFutureInstall(t))return false;return true;});
    for (var pi=0;pi<prevTxs.length;pi++){
      var pt=prevTxs[pi];
      var pla=dashAcctMap[pt.left]||null, pra=dashAcctMap[pt.right]||null;
      if(pla&&pla.type==='expense'){
        prevExpense+=pt.amount;
        var pct2=pla.costType||(pla.parentId&&dashAcctMap[pla.parentId]?dashAcctMap[pla.parentId].costType:'');
        if(pct2==='fixed') prevFixedExp+=pt.amount; else prevVarExp+=pt.amount;
        var pgid=pla.parentId||pla.id;
        prevExpByGroup[pgid]=(prevExpByGroup[pgid]||0)+pt.amount;
      }
      if(pra&&pra.type==='revenue') prevRevenue+=pt.amount;
    }
  }

  var thisFixedExp=0, thisVarExp=0, thisExpByGroup={};
  for(var fi=0;fi<mtxs.length;fi++){
    var ft=mtxs[fi], fla=dashAcctMap[ft.left]||null;
    if(!fla||fla.type!=='expense') continue;
    var fct=fla.costType||(fla.parentId&&dashAcctMap[fla.parentId]?dashAcctMap[fla.parentId].costType:'');
    if(fct==='fixed') thisFixedExp+=ft.amount; else thisVarExp+=ft.amount;
    var fgid=fla.parentId||fla.id;
    thisExpByGroup[fgid]=(thisExpByGroup[fgid]||0)+ft.amount;
  }

  var prevNetAsset=0;
  if(periodMode==='month'){
    var prevBals={};
    var pm2=viewMonth-1, py2=viewYear;
    if(pm2<0){pm2=11;py2--;}
    var cutoff=dateRange(py2,pm2).e;
    for(var ai=0;ai<accts.length;ai++){prevBals[accts[ai].id]=accts[ai].init||0;}
    var allPrevTxs=txs.filter(function(t){if(t.date>cutoff)return false;if(isFutureInstall(t))return false;return true;});
    for(var ati=0;ati<allPrevTxs.length;ati++){
      var at=allPrevTxs[ati];
      var ala=dashAcctMap[at.left], ara=dashAcctMap[at.right];
      if(!ala||!ara) continue;
      var lSign=(['asset','expense'].indexOf(ala.type)>=0)?1:-1;
      var rSign=(['liability','capital','revenue'].indexOf(ara.type)>=0)?1:-1;
      if(prevBals[at.left]!==undefined)  prevBals[at.left]  += lSign * at.amount;
      if(prevBals[at.right]!==undefined) prevBals[at.right] += rSign * at.amount;
    }
    for(var nai=0;nai<accts.length;nai++){
      var na=accts[nai];
      if(na.type==='asset')     prevNetAsset+=(prevBals[na.id]||0);
      if(na.type==='liability') prevNetAsset-=(prevBals[na.id]||0);
    }
  }

  var thisInstallTotal=txs.filter(function(t){
    return t.install&&t.install.total>1&&t.date>getViewRange().e;
  }).reduce(function(s,t){return s+t.amount;},0);
  var prevInstallTotal=0;
  if(periodMode==='month'){
    var pm3=viewMonth-1,py3=viewYear;
    if(pm3<0){pm3=11;py3--;}
    var prevEnd=dateRange(py3,pm3).e;
    prevInstallTotal=txs.filter(function(t){
      return t.install&&t.install.total>1&&t.date>prevEnd;
    }).reduce(function(s,t){return s+t.amount;},0);
  }

  var catDiffs=[];
  var allGroupIds=Object.keys(Object.assign({},thisExpByGroup,prevExpByGroup));
  allGroupIds.forEach(function(gid){
    var curr=thisExpByGroup[gid]||0, prev2=prevExpByGroup[gid]||0, diff2=curr-prev2;
    if(diff2===0) return;
    var gAcct=dashAcctMap[gid]||null;
    catDiffs.push({name:gAcct?gAcct.name:gid, diff:diff2, curr:curr, prev:prev2});
  });
  catDiffs.sort(function(a,b){return b.diff-a.diff;});
  var top3Up   = catDiffs.filter(function(d){return d.diff>0;});
  var top3Down = catDiffs.filter(function(d){return d.diff<0;}).sort(function(a,b){return a.diff-b.diff;});

  var cashflowDays=null, elapsedDays=null;
  var cycleS=new Date(r.s.replace(/-/g,'/')+' 00:00:00');
  var cycleE=new Date(r.e.replace(/-/g,'/')+' 00:00:00');
  cashflowDays=Math.round((cycleE-cycleS)/86400000)+1;
  var _td=now2, todayD=new Date(_td.getFullYear()+'/'+(_td.getMonth()+1)+'/'+_td.getDate()+' 00:00:00');
  if(todayD>=cycleS&&todayD<=cycleE)      elapsedDays=Math.round((todayD-cycleS)/86400000)+1;
  else if(todayD>cycleE)                   elapsedDays=cashflowDays;
  else                                     elapsedDays=0;
  var dailyAvgExp  = elapsedDays&&elapsedDays>0 ? Math.round(totalExpense/elapsedDays) : null;
  var projectedExp = dailyAvgExp&&cashflowDays   ? dailyAvgExp*cashflowDays              : null;

  /* ── 6개월 이력 (기준달 포함 앞 6개월) ── */
  var sixMonthLabels=[], sixMonthRevenue=[], sixMonthExpense=[];
  for(var si=5;si>=0;si--){
    var sm=viewMonth-si, sy=viewYear;
    while(sm<0){sm+=12;sy--;}
    var sRange=dateRange(sy,sm);
    var sTxs=txs.filter(function(t){return t.date>=sRange.s&&t.date<=sRange.e&&!isFutureInstall(t);});
    var sRev=0,sExp=0;
    sTxs.forEach(function(t){
      var sla=dashAcctMap[t.left],sra=dashAcctMap[t.right];
      if(sla&&sla.type==='expense') sExp+=t.amount;
      if(sra&&sra.type==='revenue') sRev+=t.amount;
    });
    sixMonthLabels.push(sy+'년 '+(sm+1)+'월');
    sixMonthRevenue.push(sRev);
    sixMonthExpense.push(sExp);
  }

  /* ── 저축통장 그룹 잔액 ── */
  var savingsTotal=0;
  accts.forEach(function(a){
    if(a.type!=='asset') return;
    var parentName='';
    if(a.parentId&&dashAcctMap[a.parentId]) parentName=dashAcctMap[a.parentId].name||'';
    else parentName=a.name||'';
    if(parentName==='저축통장'||(a.parentId&&dashAcctMap[a.parentId]&&dashAcctMap[a.parentId].name==='저축통장')){
      savingsTotal+=(bals[a.id]||0);
    }
  });

  /* ── 전월 계정별 수익/비용 맵 ── */
  var prevRevByAcct={}, prevExpByAcct={};
  prevTxs.forEach(function(t){
    var pla=dashAcctMap[t.left],pra=dashAcctMap[t.right];
    if(pla&&pla.type==='expense') prevExpByAcct[pla.id]=(prevExpByAcct[pla.id]||0)+t.amount;
    if(pra&&pra.type==='revenue') prevRevByAcct[pra.id]=(prevRevByAcct[pra.id]||0)+t.amount;
  });

  /* ── 수익 테이블용: 계정과목별 집계 (그룹명 포함) ── */
  var revTableRows=[];
  accts.filter(function(a){return a.type==='revenue'&&revByAcct[a.id];}).forEach(function(a){
    var groupName=a.parentId&&dashAcctMap[a.parentId]?dashAcctMap[a.parentId].name:a.name;
    var acctName=a.parentId?a.name:a.name;
    var curr2=revByAcct[a.id]||0, prev2=prevRevByAcct[a.id]||0;
    revTableRows.push({group:groupName,name:acctName,curr:curr2,prev:prev2});
  });
  /* 부정 > 0% > 긍정 > 이전기록없음 순 */
  function revTrendRank(row){
    if(!row.prev || row.prev===0) return 3;
    var diff=row.curr-row.prev;
    if(diff<0) return 0;
    if(diff===0) return 1;
    return 2;
  }
  function revTrendRate(row){
    return (!row.prev || row.prev===0) ? 0 : Math.abs(row.curr-row.prev)/row.prev;
  }
  revTableRows.sort(function(a,b){
    var ra=revTrendRank(a), rb=revTrendRank(b);
    if(ra!==rb) return ra-rb;
    var pa=revTrendRate(a), pb=revTrendRate(b);
    if(pa!==pb) return pb-pa;
    return b.curr-a.curr;
  });

  /* ── 비용 테이블용: 계정과목별 집계 (그룹명 포함) ── */
  var expTableRows=[];
  accts.filter(function(a){return a.type==='expense'&&expByAcct[a.id];}).forEach(function(a){
    var groupName=a.parentId&&dashAcctMap[a.parentId]?dashAcctMap[a.parentId].name:a.name;
    var acctName=a.parentId?a.name:a.name;
    var curr2=expByAcct[a.id]||0, prev2=prevExpByAcct[a.id]||0;
    expTableRows.push({group:groupName,name:acctName,curr:curr2,prev:prev2});
  });
  /* 상승률 > 0% > 하락률 > 발생없음 순 */
  function expTrendRank(row){
    if(!row.prev || row.prev===0) return 3;
    var diff=row.curr-row.prev;
    if(diff>0) return 0;
    if(diff===0) return 1;
    return 2;
  }
  function expTrendRate(row){
    return (!row.prev || row.prev===0) ? 0 : Math.abs(row.curr-row.prev)/row.prev;
  }
  expTableRows.sort(function(a,b){
    var ra=expTrendRank(a), rb=expTrendRank(b);
    if(ra!==rb) return ra-rb;
    var pa=expTrendRate(a), pb=expTrendRate(b);
    if(pa!==pb) return pb-pa;
    return b.curr-a.curr;
  });

  /* ── 고정비/변동비 항목 (그룹명 포함) ── */
  var fixedItems2=[], variableItems2=[];
  accts.filter(function(a){return a.type==='expense';}).forEach(function(a){
    var v=expByAcct[a.id]||0; if(!v) return;
    var ct=a.costType||(a.parentId&&dashAcctMap[a.parentId]?dashAcctMap[a.parentId].costType:'');
    var groupName=a.parentId&&dashAcctMap[a.parentId]?dashAcctMap[a.parentId].name:a.name;
    var row={group:groupName,name:a.name,val:v};
    if(ct==='fixed') fixedItems2.push(row); else variableItems2.push(row);
  });
  fixedItems2.sort(function(a,b){return b.val-a.val;});
  variableItems2.sort(function(a,b){return b.val-a.val;});

  /* ── 도넛 차트용: 수익 구성비 ── */
  var revDonutData=[];
  accts.filter(function(a){return a.type==='revenue'&&(revByAcct[a.id]||0)>0;}).forEach(function(a){
    var groupName=a.parentId&&dashAcctMap[a.parentId]?dashAcctMap[a.parentId].name:a.name;
    revDonutData.push({name:groupName+' · '+a.name,val:revByAcct[a.id]});
  });
  revDonutData.sort(function(a,b){return b.val-a.val;});

  /* ── 이번 달 소비 통계 ── */
  function dashWeekCount(startStr,endStr){
    var s=new Date(startStr.replace(/-/g,'/')+' 00:00:00');
    var e=new Date(endStr.replace(/-/g,'/')+' 00:00:00');
    s.setDate(s.getDate()-s.getDay());
    e.setDate(e.getDate()-e.getDay());
    return Math.max(1, Math.round((e-s)/86400000/7)+1);
  }
  var txCount=mtxs.filter(function(t){var la=dashAcctMap[t.left];return la&&la.type==='expense';}).length;
  var weekCount=dashWeekCount(r.s,r.e);
  var avgPerTx=txCount>0?Math.round(totalExpense/txCount):0;
  var avgPerDay=elapsedDays&&elapsedDays>0?Math.round(totalExpense/elapsedDays):0;
  var avgPerWeek=weekCount>0?Math.round(totalExpense/weekCount):0;

function _dashAnimateValue(node, target, formatter) {
  if (!node) return;
  var start = 0;
  var end = Number(target) || 0;
  var dur = 850;
  var t0 = null;
  function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / dur, 1);
    var eased = 1 - Math.pow(1 - p, 3);
    var cur = start + (end - start) * eased;
    node.textContent = formatter(cur);
    if (p < 1) requestAnimationFrame(step);
    else node.textContent = formatter(end);
  }
  requestAnimationFrame(step);
}
function _dashFmtSignedWon(n) {
  n = Math.round(n || 0);
  return (n >= 0 ? '+' : '') + fmtW(n);
}
function _dashAnimateMetrics(d) {
  _dashAnimateValue(document.querySelector('#dashMetrics .metrics-networth'), d.netAsset, fmtW);

  _dashAnimateValue(document.querySelector('#dashMetrics [data-metric="expense"]'), d.totalExpense, fmtW);
  _dashAnimateValue(document.querySelector('#dashMetrics [data-metric="net"]'), d.netIncome, _dashFmtSignedWon);

  if (periodMode === 'month' && d.prevNetAsset) {
    var diff = d.netAsset - d.prevNetAsset;

      return Math.round(v) + '%';

  }
}

/* ══ DASHBOARD — 라인 차트 ══ */
function _drawLine(canvas, labels, values, color, tipId) {
  if (!canvas) return;
  var parent = canvas.parentElement;
  var W = parent ? parent.offsetWidth : 160;
  if (W < 10) W = 160;
  var H = 80, dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var pad = { t: 10, r: 8, b: 20, l: 6 };
  var gw = W - pad.l - pad.r, gh = H - pad.t - pad.b;
  var n = values.length;
  var maxV = Math.max.apply(null, values) || 1;
  var minV = Math.min.apply(null, values);
  var range = maxV - minV || 1;

  function xOf(i) { return pad.l + (n > 1 ? i / (n - 1) * gw : gw / 2); }
  function yOf(v) { return pad.t + gh * (1 - (v - minV) / range); }

  var pts = values.map(function(v, i) { return { x: xOf(i), y: yOf(v) }; });

  /* 라인 + 그라디언트 fill — 진행형 애니메이션 */
  var rgb = color === 'var(--expense)' ? '192,57,43' : '17,17,17';
  var t0 = null;
  var DUR = 650;

  function frame(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / DUR, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    ctx.clearRect(0, 0, W, H);

    /* 격자 */
    ctx.strokeStyle = 'rgba(0,0,0,.06)'; ctx.lineWidth = 1;
    [0, 0.5, 1].forEach(function(r) {
      var y = pad.t + gh * r;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + gw, y); ctx.stroke();
    });

    /* 클립: 왼쪽에서 오른쪽으로 */
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, pad.l + ease * gw + 10, H);
    ctx.clip();

    /* fill 그라디언트 */
    var grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + gh);
    grad.addColorStop(0, 'rgba(' + rgb + ',.18)');
    grad.addColorStop(1, 'rgba(' + rgb + ',.02)');
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pad.t + gh);
    pts.forEach(function(pt) { ctx.lineTo(pt.x, pt.y); });
    ctx.lineTo(pts[n - 1].x, pad.t + gh);
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    /* 라인 */
    ctx.beginPath();
    pts.forEach(function(pt, i) { i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y); });
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

    /* 점 */
    pts.forEach(function(pt) {
      if (pt.x > pad.l + ease * gw + 4) return;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    });

    ctx.restore();

    /* x축 월 레이블 */
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.font = '300 9px Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif'; ctx.textAlign = 'center';
    labels.forEach(function(lbl, i) {
      var m = lbl.match(/(\d+)월/); if (!m) return;
      ctx.fillText(m[1] + '월', pts[i].x, H - 4);
    });

    if (p < 1) requestAnimationFrame(frame);
    else {
      /* 인터랙션 데이터 저장 */
      canvas._pts = pts; canvas._labels = labels; canvas._values = values;
    }
  }
  requestAnimationFrame(frame);

  /* 터치·마우스 툴팁 */
  function showTip(cx) {
    if (!canvas._pts) return;
    var rect = canvas.getBoundingClientRect();
    var mx = cx - rect.left;
    var best = 0, bd = 9999;
    canvas._pts.forEach(function(pt, i) { var d = Math.abs(pt.x - mx); if (d < bd) { bd = d; best = i; } });
    var tip = document.getElementById(tipId);
    if (tip) tip.textContent = canvas._labels[best] + ' · ' + fmtW(canvas._values[best]);
  }
  canvas.addEventListener('mousemove', function(e) { showTip(e.clientX); });
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); showTip(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); showTip(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('mouseleave', function() { var t = document.getElementById(tipId); if (t) t.textContent = ''; });
  canvas.addEventListener('touchend', function() { setTimeout(function() { var t = document.getElementById(tipId); if (t) t.textContent = ''; }, 1500); });
}

/* ══ DASHBOARD — 바 차트 ══ */
function _drawBar(canvas, labels, values, colorHl, colorBase, colorHlBottom) {
  colorHlBottom = colorHlBottom || colorHl;
  if (!canvas) return;
  var parent = canvas.parentElement;
  var W = parent ? parent.offsetWidth : 160;
  if (W < 10) W = 160;
  var H = 110, dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  var n = values.length;
  var maxV = Math.max.apply(null, values) || 1;
  var maxIdx = values.reduce(function(m, v, i) { return v > values[m] ? i : m; }, 0);
  var curIdx = n - 1;
  var baseTone = colorBase || 'rgba(243,241,232,0.16)';
  var labelTone = colorBase || 'rgba(243,241,232,0.16)';

  var padT = 20, padB = 16, padLR = 2;
  var barAreaH = H - padT - padB;
  var gap = 5;
  var barW = Math.floor((W - padLR * 2 - gap * (n - 1)) / n);

  var t0 = null, DUR = 600;

  function frame(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / DUR, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < n; i++) {
      var isHl = (i === maxIdx || i === curIdx);
      var v = values[i];
      var ratio = maxV > 0 ? v / maxV : 0;
      var bh = Math.max(ratio > 0 ? 3 : 0, barAreaH * ratio * ease);
      var bx = padLR + i * (barW + gap);
      var by = padT + barAreaH - bh;
      var r = Math.min(3, barW / 2);

      /* 바 (위쪽 모서리 둥글게, 하이라이트는 세로 그라데이션) */
      if (isHl && bh > 1) {
        ctx.fillStyle = colorHl;
      } else {
        ctx.fillStyle = baseTone;
      }
      ctx.beginPath();
      if (bh > r * 2) {
        ctx.moveTo(bx + r, by);
        ctx.lineTo(bx + barW - r, by);
        ctx.quadraticCurveTo(bx + barW, by, bx + barW, by + r);
        ctx.lineTo(bx + barW, by + bh);
        ctx.lineTo(bx, by + bh);
        ctx.lineTo(bx, by + r);
        ctx.quadraticCurveTo(bx, by, bx + r, by);
      } else {
        ctx.rect(bx, by, barW, bh);
      }
      ctx.closePath();
      ctx.fill();

      /* 금액 레이블 (애니메이션 75% 이후) */
      if (ease > 0.75 && v > 0) {
        var amtLbl = v >= 100000000 ? Math.round(v / 100000000) + '억'
                   : v >= 10000    ? Math.round(v / 10000) + '만'
                   : v + '';
        ctx.fillStyle = isHl ? colorHl : labelTone;
        ctx.font = '300 12px Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(amtLbl, bx + barW / 2, by - 4);
      }

      /* 월 레이블 */
      var mMatch = labels[i] ? labels[i].match(/(\d+)월/) : null;
      if (mMatch) {
        ctx.fillStyle = isHl ? colorHl : labelTone;
        ctx.font = '300 12px Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(mMatch[1] + '월', bx + barW / 2, H - 3);
      }
    }
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ══ DASHBOARD — 도넛 차트 ══ */
function _drawDonut(canvas, data, legendId) {
  if (!canvas || !data || !data.length) return;
  var SIZE = 80, dpr = window.devicePixelRatio || 1;
  canvas.width = SIZE * dpr; canvas.height = SIZE * dpr;
  canvas.style.width = SIZE + 'px'; canvas.style.height = SIZE + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var cx = SIZE / 2, cy = SIZE / 2, r = SIZE / 2 - 4, ir = r * 0.58;
  var COLORS = ['#2f3131','#bc0013','#5f5e5e','#9e9d9d','#c5c5c5','#2f3131','#bc0013','#5f5e5e','#9e9d9d'];
  var total = data.reduce(function(s, x) { return s + x.val; }, 0) || 1;
  var segs = [];
  var cur = -Math.PI / 2;
  data.forEach(function(x, i) {
    var sweep = x.val / total * Math.PI * 2;
    segs.push({ s: cur, e: cur + sweep, c: COLORS[i % COLORS.length] });
    cur += sweep;
  });

  var t0 = null, DUR = 500;
  function frame(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / DUR, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    ctx.clearRect(0, 0, SIZE, SIZE);
    segs.forEach(function(sg) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, sg.s, sg.s + (sg.e - sg.s) * ease);
      ctx.closePath();
      ctx.fillStyle = sg.c; ctx.fill();
    });
    /* 가운데 구멍 */
    ctx.beginPath(); ctx.arc(cx, cy, ir, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* 범례 */
  var leg = document.getElementById(legendId);
  if (leg) {
    leg.innerHTML = data.slice(0, 4).map(function(x, i) {
      return '<div style="display:flex;align-items:center;gap:4px">'
        + '<span style="width:7px;height:7px;border-radius:50%;background:' + COLORS[i % COLORS.length] + ';flex-shrink:0;display:inline-block"></span>'
        + '<span style="font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHTML(x.name) + ' ' + Math.round(x.val / total * 100) + '%</span>'
        + '</div>';
    }).join('');
  }
}

function renderDashInstall() {
  var el=document.getElementById('dashInstall');
  var ccSecEl=document.getElementById('dashCCSection');

  if(allInstallTxs.length===0){
    el.style.display='none';
    /* CC도 없으면 섹션 전체 숨김 */
    var ccEl=document.getElementById('dashCC');
    if(ccSecEl&&(!ccEl||!ccEl.innerHTML)) ccSecEl.style.display='none';
    return;
  }
  el.style.display='';
  if(ccSecEl) ccSecEl.style.display='';
  function _purchaseStartYM(t){
    var parts=t.date.split('-'),y=parseInt(parts[0]),m=parseInt(parts[1])-1;
    m-=(t.install.current-1); while(m<0){m+=12;y--;} return y+'-'+String(m+1).padStart(2,'0');
  }
  var purchaseGroups={};
  allInstallTxs.forEach(function(t){
    var key=t.item+'|'+t.install.total+'|'+_purchaseStartYM(t);
    if(!purchaseGroups[key]) purchaseGroups[key]=[];
    purchaseGroups[key].push(t);
  });
  var thisMonthPrefix=viewYear+'-'+String(viewMonth+1).padStart(2,'0');
  var purchases=Object.keys(purchaseGroups).map(function(key){
    var rows=purchaseGroups[key].slice().sort(function(a,b){return a.install.current-b.install.current;});
    var total=rows[0].install.total;

var DAY_KO = ['일','월','화','수','목','금','토'];

function txRowHTML(tx, editable) {
  editable = editable || false;
  // [OPT] 선형 루프 → 해시맵 직접 조회
  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });
  var la = acctMap[tx.left]  || null;
  var ra = acctMap[tx.right] || null;
  var isExp = la ? la.type === 'expense' : false;
  var isRev = ra ? ra.type === 'revenue' : false;
  var amtColor  = isExp ? 'var(--expense)' : 'var(--text)';
  var amtPrefix = isExp ? '−' : isRev ? '+' : '';

  var dp   = tx.date.split('-');
  var dObj = new Date(+dp[0], +dp[1]-1, +dp[2]);
  var dateDisp = tx.date.replace(/-/g,'.') + ' ' + DAY_KO[dObj.getDay()];

  var laMeta = la && TYPE_META[la.type] ? TYPE_META[la.type] : null;
  var raMeta = ra && TYPE_META[ra.type] ? TYPE_META[ra.type] : null;
  var laColor = laMeta ? laMeta.fg : '#777';
  var raColor = raMeta ? raMeta.fg : '#777';

  var laParent = la && la.parentId ? (acctMap[la.parentId] || null) : null;
  // [FIX] WARN-1: 사용자 입력값 escapeHTML 처리
  var laDisp    = escapeHTML(laParent ? laParent.name : (la ? la.name : '?'));
  var laSubDisp = la && la.parentId ? ' <span style="font-size:10px;opacity:.6">'+escapeHTML(la.name)+'</span>' : '';
  var raDisp    = escapeHTML(ra ? ra.name : '?');
  var subHtml   = ''; // 소분류는 메모로 통합
  var installHtml = (tx.install && tx.install.total>0)
    ? ' <span style="font-size:10px;background:rgba(201,169,110,.16);color:var(--accent2);padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap">'+tx.install.current+'/'+tx.install.total+'할부</span>'
    : '';
  // [FIX] 미래 할부 거래에 "예정" 배지 추가
  var futureInstallBadge = isFutureInstall(tx)
    ? ' <span style="font-size:10px;background:rgba(0,0,0,.08);color:var(--text2);padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap">예정</span>'
    : '';
  installHtml += futureInstallBadge;
  // 소분류 + 메모 합쳐서 표시
  var combinedMemo = [tx.subitem, tx.memo].filter(Boolean).join(' · ');
  var memoHtml  = combinedMemo ? '<div class="txi-memo">'+escapeHTML(combinedMemo)+'</div>' : '';

  // ── 자산 잔액 표시 (금액 우측 아래에 우정렬) ──
  var bal = getTxBal(tx.id);
  var acctMap2 = {};
  accts.forEach(function(a){ acctMap2[a.id] = a; });
  var balParts = [];
  if (bal.leftBal !== null) {
    var lName = escapeHTML((acctMap2[tx.left]||{}).name || '');
    balParts.push(lName + ' ' + fmtW(bal.leftBal));
  }
  if (bal.rightBal !== null) {
    var rName = escapeHTML((acctMap2[tx.right]||{}).name || '');
    balParts.push(rName + ' ' + fmtW(bal.rightBal));
  }
  var balInline = balParts.length > 0
    ? '<div style="font-size:11px;color:var(--text2);text-align:right;white-space:nowrap;line-height:1.4">'
      + balParts.join('<br>')
      + '</div>'
    : '';

  var actionBtns = '';
  if (editable) {
    var tid = tx.id;
    actionBtns = '<div class="txi-actions">'
      + '<button class="txi-btn txi-edit" onclick="copyTx(&quot;'+tid+'&quot;)" title="복사" style="color:var(--accent2)">'
      + '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V2.5A1.5 1.5 0 014.5 1H11"/></svg></button>'
      + '<button class="txi-btn txi-edit" onclick="openEditTx(&quot;'+tid+'&quot;)" title="수정">'
      + '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 2l3 3-9 9H2v-3l9-9z"/></svg></button>'
      + '<button class="txi-btn txi-del" onclick="deleteTx(&quot;'+tid+'&quot;)" title="삭제">'
      + '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h12M6 4V2h4v2M5 4l1 10h4l1-10"/></svg></button>'
      + '</div>';
  }

  return '<div class="txi-card" data-tid="'+tx.id+'">'
    + '<div class="txi-top">'
    +   '<div class="txi-left">'
    +     '<span class="txi-date">'+dateDisp+'</span>'
    +     '<div><span class="txi-title">'+escapeHTML(tx.item)+installHtml+'</span>'
    +       (combinedMemo ? '<span class="txi-sub">'+escapeHTML(combinedMemo)+'</span>' : '')
    +     '</div>'
    +   '</div>'
    +   actionBtns
    +   '<div class="txi-right">'
    +     balInline
    +     '<span class="txi-amount" style="color:'+amtColor+'">'+amtPrefix+fmtW(tx.amount)+'</span>'
    +   '</div>'
    + '</div>'
    + '<div class="txi-bot">'
    +   '<div class="txi-acct-cell"><span class="txi-dot" style="background:'+laColor+'"></span><span class="txi-acct-nm">'+laDisp+laSubDisp+'</span></div>'
    +   '<div class="txi-acct-cell"><span class="txi-dot" style="background:'+raColor+'"></span><span class="txi-acct-nm">'+raDisp+'</span></div>'
    + '</div>'
    + '</div>';
}

/* ══ TX ROW — 체크박스 선택 가능 버전 (거래 내역 전용) ══ */
function txRowHTMLCheckable(tx) {
  // [OPT] 선형 루프 → acctMap O(1) 조회
  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });
  var la = acctMap[tx.left]  || null;
  var ra = acctMap[tx.right] || null;
  var isExp = la?la.type==='expense':false;
  var isRev = ra?ra.type==='revenue':false;
  var amtColor  = isExp?'var(--expense)':isRev?'var(--text)':'var(--text)';
  var amtPrefix = isExp?'−':isRev?'+':'';
  var dp=tx.date.split('-');
  var dObj=new Date(+dp[0],+dp[1]-1,+dp[2]);
  var dateDisp=tx.date.replace(/-/g,'.')+' '+DAY_KO[dObj.getDay()];
  var laMeta=la&&TYPE_META[la.type]?TYPE_META[la.type]:null;
  var raMeta=ra&&TYPE_META[ra.type]?TYPE_META[ra.type]:null;
  var laColor=laMeta?laMeta.fg:'#777';
  var raColor=raMeta?raMeta.fg:'#777';
  var laParent = la && la.parentId ? (acctMap[la.parentId] || null) : null;
  // [FIX] WARN-1: XSS — 사용자 입력값 escapeHTML 처리
  var laDisp=escapeHTML(laParent?laParent.name:(la?la.name:'?'));
  var laSubDisp=la&&la.parentId?' <span style="font-size:10px;opacity:.6">'+escapeHTML(la.name)+'</span>':'';
  var raDisp=escapeHTML(ra?ra.name:'?');
  var subHtml=''; // 소분류는 메모로 통합
  var installBadge=(tx.install&&tx.install.total>0)
    ?' <span style="font-size:10px;background:rgba(201,169,110,.16);color:var(--accent2);padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap">'+tx.install.current+'/'+tx.install.total+'할부</span>':'';
  // [FIX] 미래 할부 거래에 "예정" 배지 추가
  var futureInstallBadge2 = isFutureInstall(tx)
    ? ' <span style="font-size:10px;background:rgba(0,0,0,.08);color:var(--text2);padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap">예정</span>'
    : '';
  installBadge += futureInstallBadge2;
  // 소분류 + 메모 합쳐서 표시
  var combinedMemo2 = [tx.subitem, tx.memo].filter(Boolean).join(' · ');
  var memoHtml=combinedMemo2?'<div class="txi-memo">'+escapeHTML(combinedMemo2)+'</div>':'';

  // ── 자산 잔액 표시 (금액 우측 아래에 우정렬) ──
  var bal2 = getTxBal(tx.id);
  var balParts2 = [];
  if (bal2.leftBal !== null) {
    var lName2 = escapeHTML((acctMap[tx.left]||{}).name || '');
    balParts2.push(lName2 + ' ' + fmtW(bal2.leftBal));
  }
  if (bal2.rightBal !== null) {
    var rName2 = escapeHTML((acctMap[tx.right]||{}).name || '');
    balParts2.push(rName2 + ' ' + fmtW(bal2.rightBal));
  }
  var balInline2 = balParts2.length > 0
    ? '<div style="font-size:11px;color:var(--text2);text-align:right;white-space:nowrap;line-height:1.4">'
      + balParts2.join('<br>')
      + '</div>'
    : '';

  return '<div class="txi-card txi-checkable" data-tid="'+tx.id+'" onclick="histCardClick(event,&quot;'+tx.id+'&quot;)" style="cursor:pointer">'
    +'<div class="txi-top">'
    +  '<label style="display:flex;align-items:center;margin-right:4px;flex-shrink:0" onclick="event.stopPropagation()">'
    +    '<input type="checkbox" class="hist-chk" data-tid="'+tx.id+'" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer" onchange="histChkChange()">'
    +  '</label>'
    +  '<div class="txi-left">'
    +    '<span class="txi-date">'+dateDisp+'</span>'
    +    '<div><span class="txi-title">'+escapeHTML(tx.item)+installBadge+'</span>'
    +      (combinedMemo2 ? '<span class="txi-sub">'+escapeHTML(combinedMemo2)+'</span>' : '')
    +    '</div>'
    +  '</div>'
    +  '<div class="txi-actions">'
    +    '<button class="txi-btn txi-edit" onclick="event.stopPropagation();copyTx(&quot;'+tx.id+'&quot;)" title="복사" style="color:var(--accent2)">'
    +      '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V2.5A1.5 1.5 0 014.5 1H11"/></svg></button>'
    +    '<button class="txi-btn txi-edit" onclick="event.stopPropagation();openEditTx(&quot;'+tx.id+'&quot;)" title="수정">'
    +      '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 2l3 3-9 9H2v-3l9-9z"/></svg></button>'
    +    '<button class="txi-btn txi-del" onclick="event.stopPropagation();deleteTx(&quot;'+tx.id+'&quot;)" title="삭제">'
    +      '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h12M6 4V2h4v2M5 4l1 10h4l1-10"/></svg></button>'
    +  '</div>'
    +  '<div class="txi-right">'
    +    balInline2
    +    '<span class="txi-amount" style="color:'+amtColor+'">'+amtPrefix+fmtW(tx.amount)+'</span>'
    +  '</div>'
    +'</div>'
    +'<div class="txi-bot">'
    +  '<div class="txi-acct-cell"><span class="txi-dot" style="background:'+laColor+'"></span><span class="txi-acct-nm">'+laDisp+laSubDisp+'</span></div>'
    +  '<div class="txi-acct-cell"><span class="txi-dot" style="background:'+raColor+'"></span><span class="txi-acct-nm">'+raDisp+'</span></div>'
    +'</div>'
    +'</div>';
}

// 카드 클릭 → 체크박스 토글
window.histCardClick = function(e, tid) {
  var chk = document.querySelector('.hist-chk[data-tid="'+tid+'"]');
  if (chk) { chk.checked = !chk.checked; histChkChange(); }
};

// 체크 변경 → 카운트 + 카드 스타일 업데이트
window.histChkChange = function() {
  var chks = document.querySelectorAll('.hist-chk');
  var sel  = document.querySelectorAll('.hist-chk:checked');
  var countEl = document.getElementById('histSelCount');
  var allChk  = document.getElementById('histSelectAll');
  if (countEl) countEl.textContent = sel.length + '건 선택';
  if (allChk)  allChk.checked = (sel.length === chks.length && chks.length > 0);
  // 선택된 카드 강조
  chks.forEach(function(c){
    var card = c.closest('.txi-card');
    if (card) {
      card.style.background = c.checked ? 'rgba(192,57,43,.06)' : '';
      card.style.borderColor = c.checked ? 'rgba(192,57,43,.2)' : '';
    }
  });
};

// 전체 선택/해제
window.histSelectAllChange = function(allChk) {
  document.querySelectorAll('.hist-chk').forEach(function(c){ c.checked = allChk.checked; });
  histChkChange();
};

// 선택 삭제
window.histDeleteSelected = function() {
  var sel = document.querySelectorAll('.hist-chk:checked');
  if (sel.length === 0) return;
  if (!confirm(sel.length + '건의 거래를 삭제하시겠습니까?')) return;
  var ids = [];
  sel.forEach(function(c){ ids.push(c.getAttribute('data-tid')); });
  txs = txs.filter(function(t){ return ids.indexOf(t.id) === -1; });
  save();
  filterHistory();
};

window.deleteTx = function(id) {
  if (!confirm('이 거래를 삭제하시겠습니까?')) return;
  txs = txs.filter(function(t){ return t.id !== id; });
  save();
  closeCalDay();
  if (currentPage === 'history') {
    filterHistory();
  } else {
    renderPage(currentPage);
  }
};

window.copyTx = function(id) {
  var src = txs.find(function(t){ return t.id === id; });
  if (!src) return;
  var today = (function(){
    var n=new Date();
    return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  })();
  var copy = Object.assign({}, src, {
    id: uid(),
    date: today,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  txs.push(copy);
  save();
  if (currentPage === 'history') { filterHistory(); }
  else { renderPage(currentPage); }
  // 완료 피드백
  var card = document.querySelector('.txi-card[data-tid="'+id+'"]');
  if (card) flashSuccess(card);
};

function _mobEditUpdateSaveBtn() {

/* ══ 계정과목 피커 공유 상태 (mp=거래입력, ep=수정, hf=내역필터) ══ */
var pickerState = {
  mp: { left:  {type:null,groupId:null,acctId:null,step:'type'},
        right: {type:null,groupId:null,acctId:null,step:'type'} },
  ep: { left:  {type:null,groupId:null,acctId:null,step:'type'},
        right: {type:null,groupId:null,acctId:null,step:'type'} },
  hf: { filter:{type:null,groupId:null,acctId:null,step:'type'} }
};

/* 피커 선택 완료 시 제출 버튼 활성화 갱신 */
function pickerUpdateSubmit(ns) {
  if (ns === 'mp') {
    var btn = document.getElementById('mp-submit-btn');
    if (btn) {
      var ok = !!(pickerState.mp.left.acctId && pickerState.mp.right.acctId);
      btn.disabled = !ok;
      btn.style.opacity = ok ? '1' : '0.5';
    }
  } else if (ns === 'hf') {
    if (typeof filterHistory === 'function') filterHistory();
  }
}

/* 피커 트리거 표시 갱신 래퍼 */
function pickerRefresh(ns, side) {
  if (typeof _mobUpdatePickerTrigger === 'function') _mobUpdatePickerTrigger(ns, side);
}

/* ── 모바일 거래 입력 폼 제출 ── */
window.mpSubmit = function() {
  var dateEl = document.getElementById('mp-date');
  var itemEl = document.getElementById('mp-item');
  var memoEl = document.getElementById('mp-memo');
  var amtEl  = document.getElementById('mp-amt');
  var msgEl  = document.getElementById('mp-msg');

  var date   = dateEl ? dateEl.value : '';
  var item   = (itemEl ? itemEl.value : '').trim();
  var memo   = memoEl ? memoEl.value : '';
  var parsed = parseAmtExpr(amtEl ? amtEl.value : '');
  var amt    = parsed ? parsed.amount : 0;
  var left   = pickerState.mp.left.acctId;
  var right  = pickerState.mp.right.acctId;

  function showMpErr(msg) {
    if (msgEl) {
      msgEl.textContent = msg; msgEl.style.display = 'block';
      clearTimeout(msgEl._t);
      msgEl._t = setTimeout(function(){ msgEl.style.display='none'; }, 2500);
    }
  }

  if (!date)          { showMpErr('날짜를 입력해 주세요'); return; }
  if (!item)          { showMpErr('내용을 입력해 주세요'); return; }
  if (!amt || amt<=0) { showMpErr('금액을 입력해 주세요'); return; }
  if (!left)          { showMpErr('차변 계정을 선택해 주세요'); return; }
  if (!right)         { showMpErr('대변 계정을 선택해 주세요'); return; }
  if (left === right) { showMpErr('차변·대변 계정이 같을 수 없습니다'); return; }

  var installCount = parsed && parsed.isAutoInstall ? parsed.installTotal : 0;
  if (installCount > 1) {
    var gid = uid();
    var base = Math.floor(amt / installCount);
    for (var k=0; k<installCount; k++) {
      var d2=new Date(date); d2.setMonth(d2.getMonth()+k);
      txs.push({id:uid(), date:d2.toISOString().slice(0,10),
        item:item+' '+(k+1)+'/'+installCount, memo:memo,
        amount:(k===0 ? amt-(base*(installCount-1)) : base),
        left:left, right:right, createdAt:Date.now(),
        installGroupId:gid, installIndex:k, installTotal:installCount});
    }
  } else {
    txs.push({id:uid(), date:date, item:item, memo:memo, amount:amt,
      left:left, right:right, createdAt:Date.now()});
  }

  lastInputDate = date;
  save();

  if (msgEl) {
    msgEl.textContent='✓ 거래가 입력되었습니다';
    msgEl.style.display='block';
    clearTimeout(msgEl._t);
    msgEl._t = setTimeout(function(){ msgEl.style.display='none'; }, 1800);
  }

  // 피커 상태 초기화 후 재렌더
  pickerState.mp = {
    left:  {type:null,groupId:null,acctId:null,step:'type'},
    right: {type:null,groupId:null,acctId:null,step:'type'}
  };
  setTimeout(function(){ renderMobileInput(); }, 1500);
};

};

window.closeMobEdit = function() {

  if (sheet) sheet.style.display = 'none';
  _mobEditTxId = null;
  pickerState.ep = {
    left:  {type:null, groupId:null, acctId:null, step:'type'},
    right: {type:null, groupId:null, acctId:null, step:'type'}
  };
};

window.submitMobEdit = function() {
  var tid = _mobEditTxId;
  var tx = null;
  for (var i=0; i<txs.length; i++) { if (txs[i].id===tid) { tx=txs[i]; break; } }
  if (!tx) return;

  var dateEl = document.getElementById('mob-edit-date');
  var itemEl = document.getElementById('mob-edit-item');
  var memoEl = document.getElementById('mob-edit-memo');
  var amtEl  = document.getElementById('mob-edit-amt');
  var newDate  = dateEl ? dateEl.value : '';
  var newItem  = (itemEl ? itemEl.value : '').trim();
  var newMemo  = memoEl ? memoEl.value : '';
  var parsed   = parseAmtExpr(amtEl ? amtEl.value : '');
  var newAmt   = parsed ? parsed.amount : 0;
  var newLeft  = pickerState.ep.left.acctId;
  var newRight = pickerState.ep.right.acctId;

  var msgEl = document.getElementById('mob-edit-msg');
  function showErr(msg) {
    if (msgEl) { msgEl.textContent = msg; msgEl.style.display = 'block';
      setTimeout(function(){ msgEl.style.display='none'; }, 2500); }
  }

  if (!newDate || !newItem || !newAmt || newAmt <= 0 || !newLeft || !newRight) {
    showErr('날짜·내용·금액·차변·대변은 필수 항목입니다.'); return;
  }
  if (newLeft === newRight) {
    showErr('차변과 대변 계정이 같을 수 없습니다.'); return;
  }

  tx.date = newDate; tx.item = newItem; tx.memo = newMemo;
  tx.amount = newAmt; tx.left = newLeft; tx.right = newRight;
  tx.updatedAt = Date.now();
  save();

  closeMobEdit();
  closeCalDay();
  if (currentPage === 'history') filterHistory();
  else renderPage(currentPage);
};

window.closeEditTx = function() {
  var m = document.getElementById('txEditModal');
  if (m) m.style.display = 'none';
  // ep 피커 상태 초기화
  pickerState.ep = {
    left:  {type:null, groupId:null, acctId:null, step:'type'},
    right: {type:null, groupId:null, acctId:null, step:'type'}
  };
};

function renderHistory() {
  // 계정과목 트리거 UI 상태 반영
  _mobUpdatePickerTrigger('hf', 'filter');
  // histCat hidden input을 피커 상태와 동기화
  var hc = document.getElementById('histCat');
  if (hc) hc.value = pickerState.hf.filter.acctId || '';

  // ── 현재 periodMode에 맞춰 기간 필터를 항상 자동 동기화 ──
  var r = getViewRange();
  setCustDate('histDateFrom', r.s);
  setCustDate('histDateTo',   r.e);

  filterHistory();

  // 이벤트 등록 (중복 방지: removeEventListener 없이 oninput 재할당)
  ['histSearch','histDateFrom','histDateTo','histAmtMin','histAmtMax'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.oninput = filterHistory;
    const disp = document.getElementById(id+'_disp');
    if (disp) disp.onkeydown = function(){ setTimeout(filterHistory, 0); };
  });
  ['histType','histSort'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onchange = filterHistory;
  });
}

function filterHistory() {
  // [OPT] 루프 시작 전 acctMap 1회 구성 — 이후 O(1) 조회
  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });

  var _hs=document.getElementById('histSearch'); var q=(_hs?_hs.value:'').toLowerCase();
  var _hc=document.getElementById('histCat'); var cat=_hc?_hc.value:'';
  var _ht=document.getElementById('histType'); var type=_ht?_ht.value:'';
  var _hdf=document.getElementById('histDateFrom'); var dateFrom=_hdf?_hdf.value:'';
  var _hdt=document.getElementById('histDateTo'); var dateTo=_hdt?_hdt.value:'';
  var _hmin=document.getElementById('histAmtMin'); var amtMin=(_hmin&&_hmin.value)?parseInt(_hmin.value)||0:0;
  var _hmax=document.getElementById('histAmtMax'); var amtMax=(_hmax&&_hmax.value)?parseInt(_hmax.value)||Infinity:Infinity;
  var _hso=document.getElementById('histSort'); var sort=_hso?_hso.value:'date_desc';

  let filtered = [...txs];

  // 기간
  if (dateFrom) filtered = filtered.filter(t => t.date >= dateFrom);
  if (dateTo)   filtered = filtered.filter(t => t.date <= dateTo);
  // 검색어
  if (q) filtered = filtered.filter(t => (t.item+(t.subitem||'')+(t.memo||'')).toLowerCase().includes(q));
  // 항목
  if (cat) filtered = filtered.filter(t => t.left===cat || t.right===cat);
  // 유형
  if (type) {
    // [OPT] acctMap O(1) 조회 사용
    filtered = filtered.filter(t => {
      const la = acctMap[t.left], ra = acctMap[t.right];
      if (type==='expense') return la ? la.type==='expense' : false;
      if (type==='revenue') return ra ? ra.type==='revenue' : false;
      if (type==='asset')   return (la?la.type==='asset':false) && (ra?ra.type==='asset':false);
      return true;
    });
  }
  // 금액 범위
  if (amtMin > 0)          filtered = filtered.filter(t => t.amount >= amtMin);
  if (amtMax < Infinity)   filtered = filtered.filter(t => t.amount <= amtMax);

  // 정렬
  const sortFns = {
    date_desc: (a,b) => { var dc=b.date.localeCompare(a.date); if(dc!==0) return dc; return ((b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)); },
    date_asc:  (a,b) => { var dc=a.date.localeCompare(b.date); if(dc!==0) return dc; return ((a.updatedAt||a.createdAt||0)-(b.updatedAt||b.createdAt||0)); },
    amt_desc:  (a,b) => b.amount - a.amount,
  };
  filtered.sort(sortFns[sort] || sortFns.date_desc);

  // [OPT] acctMap O(1) 사용으로 집계 개선
  // [FIX] 미래 할부 거래는 집계에서 제외
  const totalIncome  = filtered.filter(t => { if (isFutureInstall(t)) return false; const a = acctMap[t.right]; return a && a.type==='revenue'; }).reduce((s,t)=>s+t.amount,0);
  const totalExpense = filtered.filter(t => { if (isFutureInstall(t)) return false; const a = acctMap[t.left];  return a && a.type==='expense'; }).reduce((s,t)=>s+t.amount,0);

  // 월별 그룹 구분선을 위한 렌더 (날짜 정렬일 때만)
  var useMonthGroup = (sort === 'date_desc' || sort === 'date_asc') && filtered.length > 0;
  var rowsHtml = '';
  if (useMonthGroup) {
    var lastMonthKey = '';
    filtered.forEach(function(t) {
      var mk = t.date.substring(0, 7); // 'YYYY-MM'
      if (mk !== lastMonthKey) {
        var mkY = parseInt(mk.split('-')[0]), mkM = parseInt(mk.split('-')[1]);
        var monthTxsSlice = filtered.filter(function(x){ return x.date.startsWith(mk); });
        var mInc = monthTxsSlice.filter(function(x){ var a=acctMap[x.right]; return a&&a.type==='revenue'&&!isFutureInstall(x);}).reduce(function(s,x){return s+x.amount;},0);
        var mExp = monthTxsSlice.filter(function(x){ var a=acctMap[x.left];  return a&&a.type==='expense'&&!isFutureInstall(x);}).reduce(function(s,x){return s+x.amount;},0);
        rowsHtml += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 4px 4px;margin-top:'+(lastMonthKey?'10px':'0')+';border-bottom:1px solid rgba(0,0,0,.07)">'
          +'<span style="font-size:12px;font-weight:700;color:var(--text2)">'+mkY+'년 '+mkM+'월</span>'
          +'<span style="font-size:11px;color:var(--text2)"><span style="color:var(--text2)">+'+fmtShort(mInc)+'</span>&nbsp;/&nbsp;<span style="color:var(--text2)">-'+fmtShort(mExp)+'</span>&nbsp;·&nbsp;'+monthTxsSlice.length+'건</span>'
          +'</div>';
        lastMonthKey = mk;
      }
      rowsHtml += txRowHTMLCheckable(t);
    });
  } else {
    rowsHtml = filtered.map(function(t){ return txRowHTMLCheckable(t); }).join('');
  }

  document.getElementById('histList').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">'
    + '<span style="font-size:13px;color:#555;font-weight:500">'+filtered.length+'건 조회됨</span>'
    + '<div style="display:flex;align-items:center;gap:8px">'
    +   '<div style="display:flex;gap:12px;font-size:12px;font-weight:700">'
    +     '<span style="color:var(--text)">+'+fmtW(totalIncome)+'</span>'
    +     '<span style="color:var(--text)">지출 −'+fmtW(totalExpense)+'</span>'
    +   '</div>'
    +   ''
    + '</div>'
    + '</div>'
    // 선택 삭제 툴바
    + '<div id="histBulkBar" style="display:none;align-items:center;gap:10px;padding:9px 12px;background:rgba(255,69,58,.12);border:1.5px solid rgba(192,57,43,.15);border-radius:10px;margin-bottom:10px">'
    +   '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text2)">'
    +     '<input type="checkbox" id="histSelectAll" style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer" onchange="histSelectAllChange(this)">'
    +     '전체 선택'
    +   '</label>'
    +   '<span id="histSelCount" style="font-size:12px;font-weight:700;color:var(--text)">0건 선택</span>'
    +   '<button onclick="histDeleteSelected()" class="btn btn-danger btn-sm" style="margin-left:auto;padding:5px 14px;font-size:12px">선택 삭제</button>'
    + '</div>'
    + (filtered.length ? rowsHtml : '<div style="color:var(--text2);font-size:13px;padding:16px 0;text-align:center">조건에 맞는 거래가 없습니다</div>');

  if (filtered.length > 0) {
    var bar = document.getElementById('histBulkBar');
    if (bar) bar.style.display = 'flex';
  }

  // 필터 결과 저장
  window._histFiltered = filtered;
}

window.resetHistFilters = () => {
  ['histSearch'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  const {s} = dateRange(viewYear, viewMonth);
  const {e} = dateRange(viewYear, viewMonth);
  setCustDate('histDateFrom', s);
  setCustDate('histDateTo', e);
  // 계정과목 피커 리셋
  pickerState.hf.filter = {type:null, groupId:null, acctId:null, step:'type'};
  pickerRefresh('hf', 'filter');
  var hc = document.getElementById('histCat'); if(hc) hc.value = '';
  ['histType'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  ['histAmtMin','histAmtMax'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  const sort = document.getElementById('histSort'); if(sort) sort.value='date_desc';
  filterHistory();
};

/* ══ EXPENSE / REVENUE ══ */
let expTab = 'expense';
function renderExpense() {
  var r = getViewRange();
  var periodLabel = (cycleStartDay||1) > 1
    ? fmtCycleRange(r.s, r.e)
    : viewYear+'년 '+(viewMonth+1)+'월';

  // 이번 달 거래
  var mtxs = monthTxs(viewYear, viewMonth);

  // 전월 거래
  var pm = viewMonth - 1, py = viewYear;
  if (pm < 0) { pm = 11; py--; }
  var prevR = dateRange(py, pm);
  var prevMtxs = txs.filter(function(t){
    if (t.date < prevR.s || t.date > prevR.e) return false;
    // [FIX] 미래 할부 거래는 전월 집계에서도 제외
    if (isFutureInstall(t)) return false;
    return true;
  });
  var prevPeriodLabel = (cycleStartDay||1) > 1
    ? fmtCycleRange(prevR.s, prevR.e)
    : py+'년 '+(pm+1)+'월';

  var acctMap = {};
  accts.forEach(function(a){ acctMap[a.id] = a; });

  // ── 집계 헬퍼 ──
  function sumGroups(txList, type) {
    // { groupId: { total, byAcct: { acctId: { count, amount } } } }
    var result = {};
    txList.forEach(function(t) {
      var acctId = type === 'expense' ? t.left : t.right;
      var a = acctMap[acctId];
      if (!a || a.type !== type) return;
      var gid = a.parentId || a.id;
      if (!result[gid]) result[gid] = { total:0, byAcct:{} };
      result[gid].total += t.amount;
      if (!result[gid].byAcct[acctId]) result[gid].byAcct[acctId] = {count:0, amount:0};
      result[gid].byAcct[acctId].count++;
      result[gid].byAcct[acctId].amount += t.amount;
    });
    return result;
  }

  var expData  = sumGroups(mtxs, 'expense');
  var revData  = sumGroups(mtxs, 'revenue');
  var pExpData = sumGroups(prevMtxs, 'expense');
  var pRevData = sumGroups(prevMtxs, 'revenue');

  var totalExp = Object.values(expData).reduce(function(s,v){return s+v.total;},0);
  var totalRev = Object.values(revData).reduce(function(s,v){return s+v.total;},0);
  var pTotalExp = Object.values(pExpData).reduce(function(s,v){return s+v.total;},0);
  var pTotalRev = Object.values(pRevData).reduce(function(s,v){return s+v.total;},0);
  var netInc = totalRev - totalExp;

  // ── 고정비·변동비 ──
  var fx=0, vr=0;
  mtxs.forEach(function(t){
    var a=acctMap[t.left]; if(!a||a.type!=='expense') return;
    var ct=a.costType||(a.parentId&&acctMap[a.parentId]?acctMap[a.parentId].costType:'');
    if(ct==='fixed') fx+=t.amount; else vr+=t.amount;
  });

  // ── diffChip 헬퍼 ──
  function diffChip(curr, prev, goodWhenUp) {
    if (!prev && !curr) return '';
    var diff = curr - prev;
    if (diff === 0) return '<span style="font-size:11px;color:var(--text2)">전월 동일</span>';
    var good = goodWhenUp ? diff > 0 : diff < 0;
    var col = good ? 'var(--income)' : 'var(--expense)';
    var pct = prev > 0 ? ' ('+Math.abs(Math.round(diff/prev*100))+'%)' : '';
    return '<span style="font-size:11px;font-weight:700;color:'+col+'">'
      +(diff>0?'▲ +':'▼ ')+fmtW(Math.abs(diff))+pct+'</span>';
  }

  // ── 카드 HTML 생성 ──
  function buildSection(type, data, prevData, grandTotal, dotColor, amtCol, barCol) {
    var parentAccts = accts.filter(function(a){ return a.type===type && !a.parentId; });
    var sorted = parentAccts.slice().sort(function(a,b){
      // 예산 초과 항목 상단 우선, 그 다음 금액 내림차순
      var aOver = budgets[a.id] && (data[a.id]?data[a.id].total:0) > budgets[a.id] ? 1 : 0;
      var bOver = budgets[b.id] && (data[b.id]?data[b.id].total:0) > budgets[b.id] ? 1 : 0;
      if (bOver !== aOver) return bOver - aOver;
      return (data[b.id]?data[b.id].total:0) - (data[a.id]?data[a.id].total:0);
    });

    var html = '';
    sorted.forEach(function(group) {
      var gd = data[group.id];
      if (!gd || !gd.total) return;
      var pgd = prevData[group.id] || {total:0};
      var total = gd.total;
      var children = accts.filter(function(a){ return a.parentId === group.id; });
      var groupPct = grandTotal > 0 ? (total/grandTotal*100).toFixed(1) : '0.0';
      var bud = budgets[group.id] || 0;
      var pct = bud > 0 ? Math.min(total/bud*100, 100) : 0;
      var over = bud > 0 && total > bud;
      var budHtml = bud > 0
        ? '<div style="font-size:10px;color:'+(over?'var(--expense)':'#777')+'">예산 '+fmtW(bud)+' · '+pct.toFixed(0)+'%'+(over?' 초과':'')+'</div>'
        : '';
      var barHtml = bud > 0
        ? '<div style="height:3px;background:rgba(0,0,0,.06)"><div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+(over?'var(--expense)':'var(--text)')+';transition:width .3s"></div></div>'
        : '';

      // 소분류 행
      var subRows = Object.entries(gd.byAcct)
        .filter(function(e){ return e[1].amount > 0; })
        .sort(function(a,b){ return b[1].amount - a[1].amount; });

      var rowsHtml = subRows.map(function(entry) {
        var id = entry[0], v = entry[1];
        var a = acctMap[id];
        var acctName = (id===group.id && children.length>0) ? '(기타)' : (a ? escapeHTML(a.name) : id);
        var displayLabel = escapeHTML(group.name) + (acctName !== escapeHTML(group.name) ? ' · '+acctName : '');
        var pctVal = (v.amount/total*100).toFixed(1);
        var prevAmt = pgd.byAcct && pgd.byAcct[id] ? pgd.byAcct[id].amount : 0;
        var diff = v.amount - prevAmt;
        var diffStr = prevAmt > 0 || diff !== 0
          ? (diff>0?'<span style="font-size:10px;font-weight:700;color:var(--expense)">▲'+fmtW(diff)+'</span>'
                  : diff<0 ? '<span style="font-size:10px;font-weight:700;color:#1DB954">▼'+fmtW(Math.abs(diff))+'</span>'
                  : '<span style="font-size:10px;color:var(--text2)">-</span>')
          : '';
        return '<tr style="cursor:pointer" onclick="openAcctTxPopup(\''+id+'\',\''+displayLabel.replace(/'/g,"\\'")+'\',\''+(type==='expense')+'\')">'
          +'<td class="sub-name" style="display:flex;align-items:center;gap:5px">'+acctName
          +  '<span style="font-size:9px;color:var(--accent2);opacity:.6">▶</span></td>'
          +'<td class="num" style="color:'+amtCol+'">'+fmtW(v.amount)+'</td>'
          +'<td style="text-align:right;padding:8px 6px;font-size:12px;white-space:nowrap">'+diffStr+'</td>'
          +'<td class="pct">'
          +  '<div style="display:flex;align-items:center;gap:4px;justify-content:flex-end">'
          +    '<div style="width:32px;height:4px;background:var(--surface);border-radius:99px;overflow:hidden">'
          +      '<div style="height:100%;width:'+pctVal+'%;background:'+barCol+';border-radius:99px"></div></div>'
          +    '<span style="font-size:11px;color:var(--text2);min-width:34px;text-align:right">'+pctVal+'%</span>'
          +  '</div>'
          +'</td>'
          +'</tr>';
      }).join('');

      var cardId = 'exp-card-'+group.id;
      var isOverBudget = over;
      html += '<div class="card" style="margin-bottom:10px;overflow:hidden'+(isOverBudget?';border-color:rgba(192,57,43,.3);box-shadow:0 0 0 1px rgba(192,57,43,.15)':'')+'">'
        +'<div class="exp-card-head" style="cursor:pointer;user-select:none'+(isOverBudget?';background:rgba(255,69,58,.12)':'')+'" onclick="toggleExpCard(\''+cardId+'\')">'
        +  '<div class="exp-card-left">'
        +    '<div class="exp-card-dot" style="background:'+dotColor+'"></div>'
        +    '<span class="exp-card-name">'+escapeHTML(group.name)+(isOverBudget?'&nbsp;<span style="font-size:10px;background:rgba(192,57,43,.15);color:var(--red);padding:2px 7px;border-radius:99px;font-weight:800">예산초과</span>':'')+'</span>'
        +    '<span class="exp-card-cnt">'+subRows.reduce(function(s,e){return s+e[1].count;},0)+'건</span>'
        +  '</div>'
        +  '<div class="exp-card-right">'
        +    '<div style="text-align:right">'
        +      '<div class="exp-card-total" style="color:'+amtCol+'">'+fmtW(total)+'</div>'
        +      '<div style="font-size:11px;color:var(--text2);margin-top:1px;display:flex;align-items:center;gap:6px;justify-content:flex-end">'
        +        '<span>'+groupPct+'%</span>'
        +        diffChip(total, pgd.total, type==='revenue')
        +      '</div>'
        +      budHtml
        +    '</div>'
        +    '<div id="'+cardId+'-btn" style="width:28px;height:28px;border-radius:8px;background:#FFFFFF;border:1.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:16px;color:#555;flex-shrink:0;transition:all .15s;line-height:1">+</div>'
        +  '</div>'
        +'</div>'
        +barHtml
        +'<div id="'+cardId+'" style="display:none">'
        +  '<div class="card-body" style="padding:0">'
        +  '<table class="sub-table"><thead><tr>'
        +  '<th style="width:35%">계정과목</th>'
        +  '<th style="width:25%;text-align:right">합계</th>'
        +  '<th style="width:16%;text-align:right">전월 대비</th>'
        +  '<th style="width:24%;text-align:right">그룹내 비율</th>'
        +  '</tr></thead><tbody>'+rowsHtml+'</tbody></table>'
        +'</div></div></div>';
    });
    return html;
  }

  var expHtml = buildSection('expense', expData, pExpData, totalExp, 'var(--expense)', 'var(--expense)', 'var(--income)');
  var revHtml = buildSection('revenue', revData, pRevData, totalRev, 'var(--text)', 'var(--text)', 'var(--text)');

  // ── 요약 지표 ──
  var netCol = netInc >= 0 ? 'var(--text)' : 'var(--expense)';
  var summaryHtml =
    '<div class="g4" style="margin-bottom:18px">'
    +'<div class="metric-card">'
    +'<div class="metric-label">총 수익</div>'
    +'<div class="metric-value" style="color:#111111">'+fmtW(totalRev)+'</div>'
    +'<div class="metric-sub">'+diffChip(totalRev, pTotalRev, true)+'</div>'
    +'</div>'
    +'<div class="metric-card">'
    +'<div class="metric-label">총 지출</div>'
    +'<div class="metric-value" style="color:var(--red)">'+fmtW(totalExp)+'</div>'
    +'<div class="metric-sub">'+diffChip(totalExp, pTotalExp, false)+'</div>'
    +'</div>'
    +'<div class="metric-card">'
    +'<div class="metric-label">수지</div>'
    +'<div class="metric-value" style="color:'+netCol+'">'+(netInc>=0?'+':'')+fmtW(netInc)+'</div>'
    +'<div class="metric-sub">'+(netInc>=0?'흑자':'적자')+'</div>'

    +(fx>0||vr>0

      +'<div class="metric-label">고정 / 변동</div>'
      +'<div class="metric-value" style="color:var(--purple);font-size:var(--fs-lg)">'+fmtW(fx)+'</div>'

  // ── 전월 비교 한눈에 바 ──
  var cmpHtml = '';

      +'<div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px">'
      +'전월 비교 &nbsp;<span style="font-size:11px;font-weight:400;color:var(--text2)">'+prevPeriodLabel+' vs '+periodLabel+'</span></div>'

      +'<div>'
